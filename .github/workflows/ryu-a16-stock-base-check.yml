name: HAOTIAN Stock Base JAR Verification
on:
  workflow_dispatch:
  push:
    branches:
      - test-ryu-notification-battery-a16
    paths:
      - '.github/workflows/ryu-a16-stock-base-check.yml'
      - 'bin/package/COREPATCH/ryu_policy_a16.py'
      - 'bin/package/COREPATCH/ryu_doze_a16.py'
permissions:
  contents: read
jobs:
  check-base:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare stock OTA extractor
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y erofs-utils e2fsprogs
          curl -fsSL --retry 4 -o /tmp/payload-dumper.tar.gz \
            https://github.com/xishang0128/payload-dumper-go/releases/download/v0.1.6/payload-dumper-linux-amd64-v3.tar.gz
          mkdir -p /tmp/dumper
          tar -xf /tmp/payload-dumper.tar.gz -C /tmp/dumper
          find /tmp/dumper -maxdepth 3 -type f -printf '%p\n'
          chmod +x /tmp/dumper/payload-dumper-linux-amd64-v3
          /tmp/dumper/payload-dumper-linux-amd64-v3 --help | head -30
      - name: Fetch official Xiaomi 15 Pro OS3.0.308.0 base system_ext only
        shell: bash
        run: |
          set -euo pipefail
          url='https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip'
          mkdir -p /tmp/haotian-stock
          /tmp/dumper/payload-dumper-linux-amd64-v3 extract "$url" -p system_ext -o /tmp/haotian-stock
          img=$(find /tmp/haotian-stock -type f -name system_ext.img -print -quit)
          [[ -s "$img" ]] || { echo "Could not locate extracted system_ext.img" >&2; exit 1; }
          file "$img"
          mkdir -p /tmp/haotian-fs /tmp/haotian-jar
          if file "$img" | grep -qi 'erofs'; then
            fsck.erofs --extract=/tmp/haotian-fs "$img"
            jar=$(find /tmp/haotian-fs -type f -name miui-services.jar -print -quit)
            [[ -n "$jar" ]] || exit 1
            cp "$jar" /tmp/haotian-jar/miui-services.jar
          else
            for location in '/framework/miui-services.jar' '/system_ext/framework/miui-services.jar'; do
              debugfs -R "dump $location /tmp/haotian-jar/miui-services.jar" "$img" 2>/dev/null || true
              if [[ -s /tmp/haotian-jar/miui-services.jar ]]; then break; fi
            done
          fi
          unzip -tq /tmp/haotian-jar/miui-services.jar
          sha256sum /tmp/haotian-jar/miui-services.jar | tee /tmp/haotian-jar/SHA256SUMS.txt
          echo "[OK] Stock OS3.0.308.0 HAOTIAN miui-services.jar extracted"
      - name: Patch, reassemble and validate stock Xiaomi JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stock-dex
          cd /tmp/stock-dex
          unzip -j /tmp/haotian-jar/miui-services.jar 'classes*.dex'
          for dex in classes*.dex; do
            name="${dex%.dex}"
            [[ "$name" == classes ]] && out=smali || out="smali_$name"
            java -jar "$GITHUB_WORKSPACE/bin/apktool/baksmaliv2.jar" d --api 36 "$dex" -o "$out"
          done
          # Report the actual stock Xiaomi FGS call path before editing it.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = next(Path("/tmp/stock-dex").rglob("ProcessSceneCleaner.smali"))
          txt = p.read_text()
          m = re.search(r"(?ms)^\.method[^\n]*killAppForHasOtherTask\(ILmiui/process/ProcessConfig;\)Z.*?^\.end method", txt)
          assert m, "Missing Xiaomi task cleaner method"
          lines = m.group().splitlines()
          print("===== STOCK XIAOMI FGS TASK METHOD BEGIN =====", flush=True)
          for n, line in enumerate(lines, 1):
            print(f"{n:03}: {line}", flush=True)
          print("===== STOCK XIAOMI FGS TASK METHOD END =====", flush=True)
          PY
          python3 "$GITHUB_WORKSPACE/bin/package/COREPATCH/ryu_policy_a16.py" /tmp/stock-dex
          python3 "$GITHUB_WORKSPACE/bin/package/COREPATCH/ryu_doze_a16.py" /tmp/stock-dex
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = next(Path("/tmp/stock-dex").rglob("ProcessSceneCleaner.smali"))
          s = p.read_text()
          m = re.search(r"(?ms)^\.method[^\n]*killAppForHasOtherTask\(ILmiui/process/ProcessConfig;\)Z.*?^\.end method", s)
          assert m, "Stock task cleaner method not found"
          body = m.group()
          assert body.count("hasForegroundServices()Z") == 1, "FGS check missing or duplicated"
          assert ":hypermos_ryu_fgs_continue" in body, "RYU FGS branch not added"
          assert not re.search(r"const/4 v0, 0x0\s*return v0", body), "FGS early return false"
          assert re.search(r"(?s)hasForegroundServices\(\)Z.*?if-nez v\d+, (:[\w]+)", body)
          print("[PASS] Stock HAOTIAN FGS: one guard, no return-false; RYU Doze patched")
          PY

          for dir in smali smali_classes*; do
            [[ -d "$dir" ]] || continue
            [[ "$dir" == smali ]] && dex=classes.dex || dex="${dir#smali_}.dex"
            java -jar "$GITHUB_WORKSPACE/bin/apktool/smaliv2.jar" a --api 36 "$dir" -o "/tmp/haotian-jar/verify-$dex"
            test -s "/tmp/haotian-jar/verify-$dex"
          done
          echo "[PASS] Xiaomi HAOTIAN OS3.0.308.0 framework patch assembles on the actual base"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HAOTIAN-Stock-Base-JAR-Verification
          path: |
            /tmp/haotian-jar/SHA256SUMS.txt
          retention-days: 7
