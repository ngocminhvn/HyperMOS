name: One-time cleanup EliteRom and dump logs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-eliterom-logs-once.yml

permissions:
  contents: read
  actions: write

jobs:
  delete-only-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove logs from selected completed runs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          success=0
          failed=0
          echo "### EliteRom and dump run log cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "Only log records are removed; runs, artifacts, workflows, and source code are preserved." >> "$GITHUB_STEP_SUMMARY"
          for id in 38822568691 38826817085 38827659686 38829480282 38835073204 38840382765 38842538710 38845240001 38847915271 38856269819 38858806915 38859562859 38860464388 38860629629 38860764656 38861014128 38861036578 38861300953 38861320125 38861342961; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id/logs" >/dev/null 2>&1; then
              echo "Deleted logs for run $id"
              success=$((success+1))
            else
              echo "::warning::Could not delete logs for run $id"
              failed=$((failed+1))
            fi
          done
          echo "Succeeded: $success; Failed: $failed; Total: 20" >> "$GITHUB_STEP_SUMMARY"
          echo "Log cleanup: succeeded=$success failed=$failed total=20"
          test "$failed" -eq 0
