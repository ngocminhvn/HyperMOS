name: Super IMG Editor - ROM ZIP Mods

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Direct download link to already-modded ROM ZIP containing super.img (or direct super.img)'
        required: true
        type: string
      root_mode:
        description: 'KernelSU Next LKM from HyperMOS main (root patches init_boot.img; stock preserves input)'
        required: true
        type: choice
        default: root
        options:
          - root
          - stock
      upload_method:
        description: 'Upload output to'
        required: true
        type: choice
        default: drive
        options:
          - drive
          - pixeldrain
      builder_id:
        description: 'Telegram user/chat ID (optional, also notifies configured channel)'
        required: false
        type: string
      source_sha256:
        description: 'Input ROM SHA256 (optional, recommended)'
        required: false
        type: string
  push:
    branches:
      - super-img-editor
    paths:
      - config.json

permissions:
  contents: read

concurrency:
  group: super-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      upload_method: ${{ steps.source.outputs.upload_method }}
      root_mode: ${{ steps.source.outputs.root_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Compile-check editor scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py Root/detect_kernel_kmi.py
          python3 Root/detect_kernel_kmi.py --self-test
          bash -n Root/patch_init_boot.sh
          sh -n Root/stage_root_manager.sh

      - name: Check whether a source URL has been supplied
        id: source
        env:
          INPUT_URL: ${{ inputs.input_url }}
          INPUT_UPLOAD_METHOD: ${{ inputs.upload_method }}
          INPUT_ROOT_MODE: ${{ inputs.root_mode }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path("config.json").read_text())
          url=(os.environ.get("INPUT_URL") or c.get("source_rom_url") or c.get("source_super_url") or "").strip()
          ready="true" if url.startswith(("https://","http://")) else "false"
          method=(os.environ.get("INPUT_UPLOAD_METHOD") or c.get("upload_method") or "drive").strip().lower()
          if method not in ("drive","pixeldrain"):
              raise SystemExit("upload_method must be drive or pixeldrain")
          root_mode=(os.environ.get("INPUT_ROOT_MODE") or c.get("root_mode") or "root").strip().lower()
          if root_mode not in ("root","stock"):
              raise SystemExit("root_mode must be root or stock")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready="+ready+chr(10))
              f.write("upload_method="+method+chr(10))
              f.write("root_mode="+root_mode+chr(10))
          print("ROM input provided:",ready)
          PY

  edit-rom:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      INPUT_URL: ${{ inputs.input_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      UPLOAD_METHOD: ${{ needs.preflight.outputs.upload_method }}
      ROOT_MODE: ${{ needs.preflight.outputs.root_mode }}
      GH_TOKEN: ${{ github.token }}
      BUILDER_ID: ${{ inputs.builder_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
      RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Increase runner disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout editor and all Mods LFS blobs
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Resolve Git LFS content
        run: |
          set -euo pipefail
          git lfs pull

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aapt curl jq rclone 7zip e2fsprogs util-linux file unzip zip \
            android-sdk-libsparse-utils python3 ca-certificates
          chmod +x Linux/* || true
          echo "$PWD/Linux" >> "$GITHUB_PATH"
          mkdir -p work/reports work/output
          command -v aapt
          Linux/lpunpack --help >/dev/null 2>&1 || true
          df -h . | tee work/reports/disk-before.txt

      - name: Download ROM ZIP and extract existing super.img
        run: |
          set -euo pipefail
          python3 scripts/input_rom.py download 2>&1 | tee work/reports/download.log

      - name: Replace bootanimation, system apps, and optionally patch KernelSU Next root
        run: |
          set -euo pipefail
          python3 scripts/edit_super.py 2>&1 | tee work/reports/edit.log

      - name: Package resulting ROM without modifying other image entries
        run: |
          set -euo pipefail
          python3 scripts/input_rom.py package 2>&1 | tee work/reports/package.log

      - name: Upload through Rclone or Pixeldrain
        run: |
          set -euo pipefail
          bash scripts/upload.sh 2>&1 | tee work/reports/upload.log

      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-editor-reports-${{ github.run_number }}
          path: work/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Telegram result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/notify.py || true
