name: Super IMG Editor - ROM ZIP Mods

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Direct download link to already-modded ROM ZIP containing super.img (or direct super.img)'
        required: true
        type: string
      root_mode:
        description: 'KernelSU Next LKM from HyperMOS main (root patches init_boot.img; stock preserves input)'
        required: true
        type: choice
        default: root
        options:
          - root
          - stock
      upload_method:
        description: 'Upload output to'
        required: true
        type: choice
        default: drive
        options:
          - drive
          - pixeldrain

  workflow_call:
    inputs:
      input_url:
        description: 'Direct URL to already-modded ROM ZIP or super.img'
        required: true
        type: string
      root_mode:
        description: 'KernelSU Next root or preserve original'
        required: false
        default: root
        type: string
      upload_method:
        description: 'drive or pixeldrain'
        required: false
        default: drive
        type: string

permissions:
  contents: read

concurrency:
  group: super-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: super-img-editor
          lfs: false

      - name: Validate manual inputs
        env:
          INPUT_URL: ${{ inputs.input_url }}
          ROOT_MODE: ${{ inputs.root_mode }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          source = os.environ.get("INPUT_URL", "").strip()
          parsed = urlsplit(source)
          if parsed.scheme not in ("https", "http") or not parsed.hostname:
              raise SystemExit("input_url must be an absolute HTTP(S) link to a ROM ZIP or super.img")
          if parsed.username or parsed.password:
              raise SystemExit("Do not put credentials inside the input_url")
          if os.environ.get("ROOT_MODE") not in ("root", "stock"):
              raise SystemExit("root_mode must be root or stock")
          if os.environ.get("UPLOAD_METHOD") not in ("drive", "pixeldrain"):
              raise SystemExit("upload_method must be drive or pixeldrain")
          print("Manual build inputs accepted; link content will be checked during download.")
          PY

      - name: Compile-check editor and root scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py Root/detect_kernel_kmi.py
          python3 -m unittest scripts.test_super_rw_fallback -v
          python3 -m unittest scripts.test_edit_super_extract -v
          python3 Root/detect_kernel_kmi.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          shell_paths = [
              Path("functions.sh"),
              *Path("Mods/OS3").glob("*.sh"),
              *Path("Root").glob("*.sh"),
              *Path("scripts").glob("*.sh"),
          ]
          for path in shell_paths:
              data = path.read_bytes()
              if 13 in data:
                  raise SystemExit(f"{path}: CR/CRLF detected; convert to LF before building")
          print(f"Checked LF line endings in {len(shell_paths)} shell scripts")
          PY
          for script in functions.sh Mods/OS3/*.sh Root/*.sh scripts/*.sh; do
            bash -n "$script"
          done
          bash -c 'source functions.sh; declare -F mods info warn error >/dev/null'
          python3 - <<'PY'
          from pathlib import Path
          if Path("Mods/OS3/system").exists():
              raise SystemExit("Legacy OS3 system APK bundle still exists; refuse build")
          source = Path("scripts/edit_super.py").read_text()
          if "Mods/OS3/system" in source or "system/update.sh" in source:
              raise SystemExit("Legacy system APK update is still referenced by editor")
          if 'run("bash","Mods/OS3/kashimod.sh")' not in source:
              raise SystemExit("Kashi module integration was unexpectedly removed")
          print("Verified: stock system APKs preserved, Kashi mods retained.")
          PY
          sh -n Root/stage_root_manager.sh

  edit-rom:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      INPUT_URL: ${{ inputs.input_url }}
      UPLOAD_METHOD: ${{ inputs.upload_method }}
      ROOT_MODE: ${{ inputs.root_mode }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
      RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare runner storage without LVM
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h / /mnt "$GITHUB_WORKSPACE"
          # Keep apt/dpkg, /tmp and the ROM workspace on the real root FS.
          # Previous maximize-build-space LVM consumed almost all root disk,
          # leaving apt with 0.1-2 GiB despite a 99 GiB empty build volume.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h / /mnt "$GITHUB_WORKSPACE"
          root_free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if (( root_free_kb < 80 * 1024 * 1024 )); then
            echo "::error::Less than 80 GiB free on root volume; unsafe to start multi-image ROM repack"
            exit 1
          fi
          root_dev=$(df -P / | awk 'NR==2 {print $1}')
          work_dev=$(df -P "$GITHUB_WORKSPACE" | awk 'NR==2 {print $1}')
          if [[ "$root_dev" != "$work_dev" ]]; then
            echo "::error::Unexpected separate workspace device: root=$root_dev workspace=$work_dev"
            exit 1
          fi
          echo "Storage ready: no LVM, ample root space for apt and ROM packaging."

      - name: Checkout editor and all Mods LFS blobs
        uses: actions/checkout@v4
        with:
          ref: super-img-editor
          lfs: true
          persist-credentials: true

      - name: Resolve Git LFS content
        run: |
          set -euo pipefail
          git lfs pull

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aapt curl jq rclone 7zip e2fsprogs util-linux file unzip zip \
            android-sdk-libsparse-utils python3 ca-certificates
          chmod +x Linux/* || true
          echo "$PWD/Linux" >> "$GITHUB_PATH"
          mkdir -p work/reports work/output
          command -v aapt
          Linux/lpunpack --help >/dev/null 2>&1 || true
          df -h . | tee work/reports/disk-before.txt

      - name: Download ROM ZIP and extract existing super.img
        run: |
          set -euo pipefail
          python3 scripts/input_rom.py download 2>&1 | tee work/reports/download.log

      - name: Replace bootanimation, system apps, and optionally patch KernelSU Next root
        run: |
          set -euo pipefail
          python3 scripts/edit_super.py 2>&1 | tee work/reports/edit.log

      - name: Package resulting ROM without modifying other image entries
        run: |
          set -euo pipefail
          python3 scripts/input_rom.py package 2>&1 | tee work/reports/package.log

      - name: Upload through Rclone or Pixeldrain
        run: |
          set -euo pipefail
          bash scripts/upload.sh 2>&1 | tee work/reports/upload.log

      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-editor-reports-${{ github.run_number }}
          path: work/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Telegram result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/notify.py || true
