name: Pin Global303 PowerKeeper DEX (one shot)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pin-global-powerkeeper-once.yml"
      - "bin/package/NOTIFICATION_FIX/A16/EU/zk_patch.py"
permissions:
  contents: write
  actions: read
jobs:
  pin-global-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified original Global303 DEX from existing ROM-dump artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          url = "https://api.github.com/repos/ngocminhvn/HyperMOS/actions/artifacts/12494258310/zip"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "HyperMOS-donor-pin"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              urllib.request.build_opener(NoRedirect).open(req, timeout=180)
              raise RuntimeError("GitHub did not redirect to the artifact download")
          except urllib.error.HTTPError as response:
              if response.code not in (301, 302, 303, 307, 308):
                  raise
              location = response.headers["Location"]
          # The redirect is a short-lived signed storage URL. Never forward
          # the GitHub Authorization header to the artifact storage host.
          with urllib.request.urlopen(location, timeout=180) as response:
              outer = response.read()
          with zipfile.ZipFile(io.BytesIO(outer)) as archive:
              if "HyperMOS-dump-base-2.zip" not in archive.namelist():
                  raise RuntimeError("Expected Global303 ROM-dump archive missing")
              nested = archive.read("HyperMOS-dump-base-2.zip")
          with zipfile.ZipFile(io.BytesIO(nested)) as archive:
              apk = archive.read("powerkeeper.apk")
          if hashlib.sha256(apk).hexdigest() != "56f0a7e02a9966e47441dee60d78f4d99e93700b1e912f45617d3d0d29c52eda":
              raise RuntimeError("Global303 PowerKeeper APK differs from verified source")
          with zipfile.ZipFile(io.BytesIO(apk)) as archive:
              dex = archive.read("classes.dex")
          if hashlib.sha256(dex).hexdigest() != "21c20b3ddbaab981276bab60ab6c2a0f62587ea6d87b84bc54aa33def6df25bf":
              raise RuntimeError("Global303 PowerKeeper classes.dex mismatch")
          target = pathlib.Path("bin/package/NOTIFICATION_FIX/A16/EU/class/powerkeeper/global.dex")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(dex)
          print("Global303 donor pinned:", target, "bytes:", len(dex))
          PY
      - name: Validate patcher Python syntax
        run: python3 -m py_compile bin/package/NOTIFICATION_FIX/A16/EU/zk_patch.py
      - name: Commit original donor and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/package/NOTIFICATION_FIX/A16/EU/class/powerkeeper/global.dex
          git rm .github/workflows/pin-global-powerkeeper-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "build(eu): pin original Global303 PowerKeeper global.dex"
          git push origin HEAD:main
