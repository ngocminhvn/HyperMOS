name: Update Kashi Apps

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check releases only; do not commit changed ZIPs'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-kashi-apps
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    name: Verify latest Kashi system-app releases
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current local app snapshots
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false

      - name: Prepare APK validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aapt unzip

      - name: Validate latest releases and smoke-test OS3 integration
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 bin/modfile/OS3/kashi_preflight.py

      - name: Commit integration-verified Kashi ZIPs to main
        if: ${{ steps.update.outputs.changed == 'true' && inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kashi updater only runs on main"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bin/modfile/OS3/kashi
          if git diff --cached --quiet; then
            echo "No ZIP files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore(kashi): update verified system-app snapshots"
          git push origin HEAD:main
          echo "Verified app updates committed to main." >> "$GITHUB_STEP_SUMMARY"

      - name: Report dry-run or no-op
        if: ${{ steps.update.outputs.changed != 'true' || inputs.dry_run == true }}
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry-run mode: no branch or PR created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new Kashi release changes. Nothing committed." >> "$GITHUB_STEP_SUMMARY"
          fi
