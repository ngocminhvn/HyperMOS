name: RYUOS HAOTIAN Full Framework Audit

on:
  push:
    branches:
      - audit-ryuos-haotian-notification
    paths:
      - '.github/workflows/ryu-notification-audit.yml'
      - 'bin/audit/**'
  workflow_dispatch:
    inputs:
      ryu_url:
        description: Stable SourceForge direct URL (do not include expiring st/e query tokens)
        required: true
        type: string
        default: https://downloads.sourceforge.net/project/projectzk/ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip
      inventory_only:
        description: Only read ZIP central directory (use if runner lacks disk space)
        required: true
        type: boolean
        default: false
      stock_bundle_url:
        description: Optional direct URL to a ZIP containing all 3 original JARs (for full diff)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ryu-notification-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Extract RYU and inspect every framework class/method
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout HyperMOS audit branch
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare filesystem utilities and HTTP-range ZIP reader
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils e2fsprogs android-sdk-libsparse-utils
          python -m pip install --disable-pip-version-check --no-cache-dir remotezip==0.12.3
          mkdir -p ryu-reports ryu-extracted ryu-work
          df -h .

      - name: Validate all audit Python scripts before starting the download
        run: |
          python -m py_compile bin/audit/ryu_fetch_extract.py bin/audit/ryu_notification_dex.py \
            bin/audit/ryu_full_jar_diff.py bin/audit/ryu_semantic_smali.py bin/audit/ryu_decode_smali.py \
            bin/audit/ryu_powerkeeper_report.py

      - name: Read RYUOS ZIP inventory and extract targeted IMG contents
        id: extract
        shell: bash
        env:
          RYU_URL: ${{ inputs.ryu_url || 'https://downloads.sourceforge.net/project/projectzk/ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip' }}
          INVENTORY_ONLY: ${{ inputs.inventory_only || 'false' }}
        run: |
          set -euo pipefail
          opts=()
          if [[ "$INVENTORY_ONLY" == "true" ]]; then opts+=(--inventory-only); fi
          python bin/audit/ryu_fetch_extract.py \
            --url "$RYU_URL" --work ryu-work --out ryu-extracted "${opts[@]}"

      - name: Scan all 3 RYU JARs - every class method and field
        if: ${{ success() && !inputs.inventory_only }}
        shell: bash
        run: |
          set -euo pipefail
          python bin/audit/ryu_full_jar_diff.py scan \
            --directory ryu-extracted \
            --output ryu-reports/ryu-full-dex.json.gz
          python bin/audit/ryu_full_jar_diff.py summary \
            --input ryu-reports/ryu-full-dex.json.gz \
            --markdown ryu-reports/ryu-full-inventory.md

      - name: Download optional user stock JAR bundle
        if: ${{ success() && !inputs.inventory_only && inputs.stock_bundle_url != '' }}
        shell: bash
        env:
          STOCK_BUNDLE_URL: ${{ inputs.stock_bundle_url }}
        run: |
          set -euo pipefail
          mkdir -p stock-jars
          python - <<'PY'
          import os, pathlib, urllib.request, zipfile, shutil
          url=os.environ['STOCK_BUNDLE_URL']
          assert url.startswith('https://'), 'Only HTTPS URLs accepted'
          destination=pathlib.Path('stock-jars')
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'HyperMOS-Audit/1'}),timeout=120) as inp:
              with open('stock-bundle.zip','wb') as out:shutil.copyfileobj(inp,out)
          expected=['framework.jar','services.jar','miui-services.jar']
          with zipfile.ZipFile('stock-bundle.zip') as z:
              for name in expected:
                  matching=[p for p in z.namelist() if pathlib.PurePosixPath(p).name==name]
                  if len(matching)!=1:raise ValueError(f'{name}: expected one match, found {len(matching)}')
                  with z.open(matching[0]) as inp, (destination/name).open('wb') as out:
                      shutil.copyfileobj(inp,out)
          print('Three matching JARs extracted from stock bundle')
          PY
          rm -f stock-bundle.zip

      - name: Compare all methods and classes RYU vs original stock
        if: ${{ success() && !inputs.inventory_only && inputs.stock_bundle_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python bin/audit/ryu_full_jar_diff.py scan \
            --directory stock-jars --output ryu-reports/stock-full-dex.json.gz
          python bin/audit/ryu_full_jar_diff.py compare \
            --stock ryu-reports/stock-full-dex.json.gz \
            --custom ryu-reports/ryu-full-dex.json.gz \
            --output ryu-reports/full-dex-diff.json.gz \
            --markdown ryu-reports/full-dex-diff.md

      - name: Verify all changed methods with full smali comparison
        if: ${{ success() && !inputs.inventory_only && inputs.stock_bundle_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python bin/audit/ryu_decode_smali.py --input stock-jars --out stock-all-smali
          python bin/audit/ryu_decode_smali.py --input ryu-extracted --out ryu-all-smali
          python bin/audit/ryu_semantic_smali.py \
            --stock stock-all-smali --ryu ryu-all-smali \
            --output ryu-reports/full-smali-diff.json \
            --markdown ryu-reports/full-smali-diff.md
          gzip -f ryu-reports/full-smali-diff.json
          rm -rf stock-all-smali ryu-all-smali

      - name: Decompile only RYU PowerKeeper and inspect FCM changes
        if: ${{ success() && !inputs.inventory_only }}
        shell: bash
        run: |
          set -euo pipefail
          java -jar bin/apktool/apke.jar d -t raw -f -no-dex-debug \
            -i ryu-extracted/PowerKeeper.apk -o ryu-smali
          python bin/audit/ryu_powerkeeper_report.py \
            --smali ryu-smali \
            --output ryu-reports/powerkeeper-audit.md

      - name: Save ZIP inventory with reports (never upload ROM/JAR/APK or smali)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ryu-reports
          if [[ -f ryu-extracted/zip_inventory.json ]]; then
            cp ryu-extracted/zip_inventory.json ryu-reports/zip_inventory.json
          fi
          {
            echo "## RYUOS audit"
            echo
            if [[ -f ryu-reports/full-dex-diff.md ]]; then
              head -n 85 ryu-reports/full-dex-diff.md
            elif [[ -f ryu-reports/ryu-full-inventory.md ]]; then
              cat ryu-reports/ryu-full-inventory.md
            else
              echo "No full JAR results; inspect preceding logs."
            fi
            if [[ -f ryu-reports/powerkeeper-audit.md ]]; then
              echo
              cat ryu-reports/powerkeeper-audit.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish text and JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryuos-haotian-full-framework-audit
          path: ryu-reports/
          retention-days: 14
          if-no-files-found: warn
