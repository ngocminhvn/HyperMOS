name: One-time unpack ZK backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-backupzk-once.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and commit ZK reference
        shell: bash
        run: |
          set -euo pipefail
          BASE="bin/package/NOTIFICATION_FIX/A16/EU"
          python3 "$BASE/unpack_backupzk.py" \
            --archive "$BASE/backupzk.zip" \
            --output "$BASE/zk_extracted"
          test -s "$BASE/zk_extracted/_unpack_manifest.json"
          python3 - "$BASE/zk_extracted/_unpack_manifest.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f:
              d=json.load(f)
          assert d["member_count"] and d["installed_into_rom"] is False
          print("ZK extraction members:", d["member_count"])
          for row in d["files"]:
              print("  ",row["path"],row["size"])
          PY
          rm -- "$BASE/backupzk.zip" "$BASE/unpack_backupzk.py"
          rm -- ".github/workflows/unpack-backupzk-once.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$BASE" ".github/workflows/unpack-backupzk-once.yml"
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(eu): commit extracted ZK reference, remove backup zip"
          git push origin HEAD:main
