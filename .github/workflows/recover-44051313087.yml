name: Trigger corrected HyperMOS build 44051313087

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-44051313087.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      ${{ github.event.head_commit.message == 'ci: trigger corrected HyperMOS build for run 44051313087' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch same ROM build after toolchain fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "${GITHUB_REPOSITORY}" --ref main \
            -f input_url='https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.4.0.XOBCNXM/haotian-ota_full-OS4.0.4.0.XOBCNXM-user-17.0-42c1452dc3.zip' \
            -f builder_id='' \
            -f debug=false \
            -f root_mode=root \
            -f upload_method=pixeldrain
          echo "Dispatched updated build.yml with HAOTIAN OS4.0.4.0, root, Pixeldrain."
