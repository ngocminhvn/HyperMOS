name: Extract Xiaomi.eu extras ZIP, paths, build.prop

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Xiaomi.eu SourceForge ROM link or direct HTTPS fastboot ZIP (super.img/super.img.N)'
        required: true
        type: string
        default: 'https://sourceforge.net/projects/xiaomi-eu-multilang-miui-roms/files/xiaomi.eu/HyperOS-STABLE-RELEASES/HyperOS3.0/xiaomi.eu_HAOTIAN_OS3.0.309.0.WOBCNXM_16_f5fba57993.zip/download#'

permissions:
  contents: read

jobs:
  audit:
    name: Extract 3 extras into ZIP, paths, build.prop and Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK: /tmp/hypermos-xiaomieu-${{ github.run_id }}
      ROM_URL: ${{ inputs.rom_url }}
    steps:
      - name: Checkout HyperMOS
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Validate audit workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "[AUDIT] Staging directory: $WORK"
          mkdir -p "$WORK/output"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          source = os.environ["ROM_URL"].strip()
          url = urlsplit(source)
          if url.scheme != "https" or not url.hostname or url.username or url.password or len(source) > 4096:
              raise SystemExit("ROM_URL must be a public HTTPS URL for a ROM ZIP")
          print("[AUDIT] ROM URL host:", url.hostname)
          PY

      - name: Free disk and install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl unzip android-sdk-libsparse-utils e2fsprogs erofs-utils
          python3 -m py_compile bin/lpunpack.py bin/audit/audit_xiaomi_eu_apps.py
          df -h "$WORK"

      - name: Auto-select the fastest verified SourceForge mirror and download ROM
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/dump/sourceforge_download.py \
            --url "$ROM_URL" \
            --output "$WORK/eu-rom.zip" \
            --report "$WORK/output/mirror-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["WORK"]) / "output/mirror-report.json").read_text())
          mirrors = [item for item in report.get("probes", []) if item.get("status") == "ok"]
          selected = report.get("selected_mirror") or "unknown"
          print(f"[MIRROR] Selected: {selected} | verified range samples: {len(mirrors)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Xiaomi.eu SourceForge download\n\n")
              summary.write(f"- Selected download route: `{selected}`\n")
              summary.write(f"- Verified mirror samples: {len(mirrors)}\n")
              summary.write("- Full probe results and fallbacks: `mirror-report.json` (artifact)\n\n")
          PY

      - name: Extract Xiaomi.eu components, build.prop and original Launcher (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/audit_xiaomi_eu_apps.py \
            "$WORK/eu-rom.zip" "$WORK" \
            "bin/lpunpack.py" "bin/modfile/ModApp/OS3/kashimod.sh"
          test -s "$WORK/output/xiaomieu-extras.zip"
          test -s "$WORK/output/xiaomieu-component-paths.txt"
          python3 - "$WORK/output/xiaomieu-extras.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              required = {"xiaomieu-component-paths.txt", "xiaomieu-components-manifest.json"}
              assert required <= set(z.namelist()), "ZIP missing path report/manifest"
          print("[OK] Original Xiaomi.eu components ZIP verified")
          PY
          cat "$WORK/output/audit.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact includes xiaomieu-extras.zip (the three EU components found), xiaomieu-component-paths.txt (original paths), original build.prop files, mirror-report.json, and the Launcher comparison. No China comparison, ROM patching, or flashing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mirror diagnostics if download or extraction fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: xiaomieu-mirror-diagnostics-${{ github.run_id }}
          path: ${{ env.WORK }}/output/mirror-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload original EU apps, build.prop and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaomieu-extras-vs-launcher-${{ github.run_id }}
          path: ${{ env.WORK }}/output/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
