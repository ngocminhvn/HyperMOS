name: Boot chain verifier checks
on:
  push:
    paths:
      - 'bin/vbpatcher.py'
      - 'bin/verify_boot_chain.py'
      - 'bin/patch-vbmeta.py'
      - 'bin/tests/test_boot_chain.py'
      - 'bin/tests/check_stock_boot_chain.sh'
      - 'bin/package/DISABLE_AVB/DISABLEavb.sh'
      - '.github/workflows/boot-chain-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install lz4 zstandard
      - name: Syntax and regression checks
        run: |
          for f in build.sh uploadROM.sh bin/package/patchpackage.sh bin/package/DISABLE_AVB/DISABLEavb.sh; do
            bash -n "$f"
          done
          python3 -m py_compile bin/vbpatcher.py bin/verify_boot_chain.py bin/patch-vbmeta.py bin/tests/test_boot_chain.py
          python3 -m unittest discover -s bin/tests -p test_boot_chain.py -v
      - name: Build and verify official haotian boot-chain images
        run: |
          chmod +x bin/Linux/x86_64/payload-extract
          bash bin/tests/check_stock_boot_chain.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-boot-chain-integration
          path: build/boot-chain-integration/*.json
