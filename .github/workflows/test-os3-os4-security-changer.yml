name: Validate shared OS3 OS4 countdown and HyperChanger routing

on:
  push:
    paths:
      - "bin/modfile/UpdateFile/SecurityCountdown/**"
      - "bin/modfile/UpdateFile/InfoChanger/update.sh"
      - "bin/modfile/ModApp/OS3/kashimod.sh"
      - "bin/modfile/ModApp/OS3/README.md"
      - "bin/modfile/ModApp/OS4/README.md"
      - ".github/workflows/test-os3-os4-security-changer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and single-owner checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/modfile/ModApp/OS3/kashimod.sh \
            bin/modfile/UpdateFile/SecurityCountdown/update.sh \
            bin/modfile/UpdateFile/InfoChanger/update.sh \
            bin/modfile/UpdateFile/insupdate.sh
          python3 -m py_compile bin/modfile/UpdateFile/SecurityCountdown/patch.py
          test ! -e bin/modfile/ModApp/OS3/securitycenter_countdown.py
          ! grep -Eq 'securitycenter_countdown.py|patch_stock_securitycenter' \
            bin/modfile/ModApp/OS3/kashimod.sh
          grep -Fq 'OS3/16|OS4/17' bin/modfile/UpdateFile/SecurityCountdown/update.sh
          grep -Fq 'OS3/16|OS4/17' bin/modfile/UpdateFile/InfoChanger/update.sh
          test "$(find bin/modfile/UpdateFile/SecurityCountdown -maxdepth 1 -name 'update.sh' | wc -l)" -eq 1
      - name: Test method match, mutation scope and incompatible layouts
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import tempfile
          p=Path('bin/modfile/UpdateFile/SecurityCountdown/patch.py')
          spec=importlib.util.spec_from_file_location('countdown_patch',p)
          mod=importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          assert mod.patch_fragment('.method protected g0()I\n    .locals 1\n    const/16 v0, 0xa\n    return v0\n.end method\n')[1] == 10
          with tempfile.TemporaryDirectory() as temp:
            folder=Path(temp)
            f=folder/'smali/classes3/com/miui/permcenter/privacymanager/InterceptPermissionFragment.smali'
            f.parent.mkdir(parents=True)
            original=(
              '.class public Lcom/miui/permcenter/privacymanager/InterceptPermissionFragment;\n'
              '.method protected g0()I\n  .locals 1\n  const/16 v0, 0xa\n  return v0\n.end method\n'
              '.method public unrelated()I\n  .locals 1\n  const/16 v0, 0xa\n  return v0\n.end method\n'
            )
            f.write_text(original)
            result=mod.patch(folder)
            updated=f.read_text()
            assert result.fragment_old_seconds==10 and result.fragment_new_seconds==0
            assert updated.count('const/16 v0, 0x0')==1
            assert '.method public unrelated()I\n  .locals 1\n  const/16 v0, 0xa' in updated
            assert mod.patch(folder).changed_files==[]
            f.write_text(original.replace('const/16 v0, 0xa','const/16 v0, 0xb',1))
            try:
              mod.patch(folder)
            except ValueError:
              pass
            else:
              raise AssertionError('Unsupported countdown was accepted')
          print('PASS: countdown is isolated, idempotent and rejects unsupported methods')
          PY
      - name: Test runtime gates for both modules without APK mutation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/bin/ddevice" "$tmp/bin/modfile/UpdateFile/InfoChanger" \
            "$tmp/bin/modfile/UpdateFile/SecurityCountdown" \
            "$tmp/build/baserom/images/system_ext"
          cp functions.sh "$tmp/functions.sh"
          cp bin/modfile/UpdateFile/InfoChanger/update.sh "$tmp/bin/modfile/UpdateFile/InfoChanger/update.sh"
          cp bin/modfile/UpdateFile/SecurityCountdown/update.sh "$tmp/bin/modfile/UpdateFile/SecurityCountdown/update.sh"
          for pair in "OS3 16" "OS4 17"; do
            read -r os sdk <<< "$pair"
            echo "$os" > "$tmp/bin/ddevice/rom_os.txt"
            echo "$sdk" > "$tmp/bin/ddevice/androidver.txt"
            echo "xiaomi_eu" > "$tmp/bin/ddevice/rom_source.txt"
            (cd "$tmp" && bash bin/modfile/UpdateFile/SecurityCountdown/update.sh) | tee "$tmp/countdown.log"
            grep -q 'Xiaomi.eu' "$tmp/countdown.log"
            (cd "$tmp" && bash bin/modfile/UpdateFile/InfoChanger/update.sh) | tee "$tmp/info.log"
            grep -q 'expected one SystemUI APK, found 0' "$tmp/info.log"
            echo "PASS: both modules route $os Android $sdk"
          done
