name: HAOTIAN RYU Thermal Safety Preflight
on:
  push:
    branches:
      - test-ryu-performance-haotian
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and inactive dangerous overrides
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/audit/collect-haotian-heat.sh
          python3 -m py_compile bin/audit/ryu_performance_parity.py
          python3 -m py_compile bin/package/COREPATCH/ryu_policy_a16.py
          python3 -m py_compile bin/package/COREPATCH/ryu_doze_a16.py
          python3 -m py_compile bin/modfile/UpdateFile/RYUPerfProfile/port_ryu_thermal_profiles.py
          python3 - <<'PYSUP'
          from bin.modfile.UpdateFile.RYUPerfProfile.port_ryu_thermal_profiles import PROFILES, PROTECTED, REQUIRED
          assert {'normal', 'per-normal', 'hp-normal', 'video'} <= set(PROFILES)
          assert not set(PROFILES).intersection(PROTECTED)
          assert len(PROFILES) >= 18
          print('[PASS] RYU thermal app profiles exclude no-limit and charging modes')
          PYSUP
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("bin/modfile/UpdateFile")
          active = sorted(root.rglob("update.sh"))
          assert active, "No module installers discovered"
          dangerous = {"ThermalServices", "Xiaomi_NoLowEnd"}
          for path in active:
              assert path.parent.name not in dangerous, f"Unsafe update module enabled: {path}"
          installer = (root / "insupdate.sh").read_text()
          assert '-name "update.sh"' in installer, "Changed installer dispatch contract"
          refresh = Path("bin/package/RefreshRate/1hz.sh").read_text()
          assert "Preserve the device stock Smart FPS / LTPO behavior" in refresh
          print(f"[PASS] {len(active)} active modules: no thermal-nolimit/forced-CPU module")
          PY
      - name: Exercise read-only performance parity report on fixtures
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/stock" "$tmp/ryu" "$tmp/reports"
          printf '.class public Ltest/ThermalManager;\n.method public example()V\n    .locals 0\n    return-void\n.end method\n' > "$tmp/stock/ThermalManager.smali"
          printf '.class public Ltest/ThermalManager;\n.method public example()V\n    .locals 1\n    const/4 v0, 0x1\n    return-void\n.end method\n' > "$tmp/ryu/ThermalManager.smali"
          printf '.class public Lcom/projectryu/perf/PerfHook;\n.method public static example()V\n    .locals 0\n    return-void\n.end method\n' > "$tmp/ryu/PerfHook.smali"
          python3 bin/audit/ryu_performance_parity.py \
            --stock "$tmp/stock" --ryu "$tmp/ryu" --out "$tmp/reports"
          python3 - "$tmp/reports/ryu-performance-parity.json" <<'PY'
          import json
          import sys
          report=json.load(open(sys.argv[1]))
          assert len(report["ryu_private_classes"])==1, report
          assert len(report["performance_changes"])==2, report
          assert any(x["state"]=="different" for x in report["performance_changes"])
          print("[PASS] Detects method delta and RYU-only PerfHook")
          PY
