name: Temporary smali tools export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zk-compile-tools-temp.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate consolidated patch source
        run: |
          python3 -m py_compile bin/package/NOTIFICATION_FIX/A16/EU/zk_patch.py
          python3 bin/package/NOTIFICATION_FIX/A16/EU/zk_patch.py --check-reference-only
      - uses: actions/upload-artifact@v4
        with:
          name: smali-toolchain-a16
          path: |
            bin/apktool/baksmaliv2.jar
            bin/apktool/smaliv2.jar
          retention-days: 1
