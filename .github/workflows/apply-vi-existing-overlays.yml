name: Apply Vietnamese fixes to existing overlays

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-vi-existing-overlays.yml'
      - 'bin/modfile/UpdateFile/MultiLang/patches/**'
      - 'bin/modfile/UpdateFile/MultiLang/patch_existing_overlays.py'

permissions:
  contents: write

concurrency:
  group: apply-vi-existing-overlays-main
  cancel-in-progress: false

jobs:
  rebuild-in-place:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current source (retain original APK names)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Local Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt zipalign > /dev/null
          command -v aapt
          command -v zipalign

      - name: Apply translation XML to existing APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/modfile/UpdateFile/MultiLang/patch_existing_overlays.py \
            --source bin/modfile/UpdateFile/MultiLang/updatesource \
            --patches bin/modfile/UpdateFile/MultiLang/patches \
            --output "$RUNNER_TEMP/vi-built" \
            --apktool bin/apktool/apktool.jar \
            --aapt "$(command -v aapt)" \
            --apksigner-jar bin/apktool/apksigner.jar \
            --zipalign "$(command -v zipalign)" \
            --key bin/package/DISABLE_AVB/HMATools/aosp/security/testkey.pk8 \
            --cert bin/package/DISABLE_AVB/HMATools/aosp/security/testkey.x509.pem
          echo "VI_REPORT_DIR=$RUNNER_TEMP/vi-built" >> "$GITHUB_ENV"

      - name: Verify original signing certificate before replacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$VI_REPORT_DIR/patch-report.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1], encoding="utf-8"))
          expected={"Nothings.Settings.apk","Nothings.MiuiSystemUI.apk","Nothings.SecurityCenter.apk"}
          assert {r["overlay"] for r in rows} == expected, "Unexpected target overlay set"
          for row in rows:
              assert row["status"] in ("candidate_needs_device_validation","unchanged"), row
              if row["status"]=="candidate_needs_device_validation":
                  assert row["signer_preserved"] is True, row
                  assert row["package"].startswith("NT.overlay."), row
                  print("Verified original certificate and target:",row["overlay"])
          PY

      - name: Replace original overlay APKs and commit (same package IDs)
        shell: bash
        run: |
          set -euo pipefail
          src="bin/modfile/UpdateFile/MultiLang/updatesource"
          for file in Nothings.Settings.apk Nothings.MiuiSystemUI.apk Nothings.SecurityCenter.apk; do
            if [[ -s "$VI_REPORT_DIR/$file" ]]; then
              cp -f "$VI_REPORT_DIR/$file" "$src/$file"
              echo "[INPLACE] Updated existing $file"
            fi
          done
          git add "$src/Nothings.Settings.apk" "$src/Nothings.MiuiSystemUI.apk" "$src/Nothings.SecurityCenter.apk"
          if git diff --cached --quiet; then
            echo "[INPLACE] No binary changes (translations already applied)"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m "l10n(vi): update existing Settings, SystemUI and SecurityCenter overlay APKs"
          git push origin HEAD:main

      - name: Publish patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-place-vietnamese-translation-report
          path: |
            ${{ runner.temp }}/vi-built/patch-report.json
            ${{ runner.temp }}/vi-built/PATCH_REPORT.md
            ${{ runner.temp }}/vi-built/*.log
          if-no-files-found: warn
          retention-days: 14
