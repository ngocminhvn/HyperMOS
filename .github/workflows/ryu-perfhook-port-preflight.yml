name: RYU PerfHook Port Preflight
on:
  workflow_dispatch:
  push:
    branches:
      - test-ryu-performance-haotian
    paths:
      - '.github/workflows/ryu-perfhook-port-preflight.yml'
      - 'bin/audit/ryu_perfhook_dependency_map.py'
      - 'bin/package/NOTIFICATION_FIX/A16/ryu_perfhook_port.py'
      - 'bin/package/NOTIFICATION_FIX/A16/test_ryu_perfhook_port.py'
      - 'bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate analyzer (fast fail)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/audit/ryu_perfhook_dependency_map.py
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/ryu"
          cat > "$tmp/ryu/PerfHook.smali" <<'EOF'
          .class public Lcom/projectryu/perf/PerfHook;
          .super Ljava/lang/Object;
          .method public static start()V
              .locals 1
              const-string v0, "projectryu_thermal_sconfig"
              return-void
          .end method
          EOF
          python3 bin/audit/ryu_perfhook_dependency_map.py --ryu "$tmp/ryu" --out "$tmp/out"
          python3 - "$tmp/out/ryu-perfhook-dependency-map.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["perf_method_count"] == 1
          assert "projectryu_thermal_sconfig" in d["focused_string_literals"]
          print("[OK] analyzer parses actual smali format and settings keys")
          PY
      - name: Run PerfHook port unit tests and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/package/NOTIFICATION_FIX/A16/ryu_perfhook_port.py
          (cd bin/package/NOTIFICATION_FIX/A16 && python3 -m unittest -v test_ryu_perfhook_port.py)
          bash -n bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh
      - name: Get previously extracted genuine RYUOS PowerKeeper
        uses: actions/download-artifact@v4
        with:
          name: RYUOS-HAOTIAN-PowerKeeper
          run-id: 37916279893
          repository: ngocminhvn/HyperMOS
          github-token: ${{ github.token }}
          path: /tmp/ryu-apk
      - name: Decode RYU APK and map PerfHook and callers
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/ryu-apk/RYUOS_HAOTIAN_PowerKeeper.apk
          unzip -tq /tmp/ryu-apk/RYUOS_HAOTIAN_PowerKeeper.apk
          java -jar bin/apktool/apke.jar d -t raw -f -no-dex-debug \
            -i /tmp/ryu-apk/RYUOS_HAOTIAN_PowerKeeper.apk -o /tmp/ryu-perfhook-smali
          python3 bin/audit/ryu_perfhook_dependency_map.py \
            --ryu /tmp/ryu-perfhook-smali --out reports
          python3 - reports/ryu-perfhook-dependency-map.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["perf_method_count"] > 0
          assert d["call_sites"], "PerfHook has no observed activation site"
          print("[RYU] Activation sites:")
          for s in d["call_sites"][:20]:
              print(s["class"], s["method"])
          print("[RYU] Private dependencies:", len(d["ryu_private_dependencies"]))
          PY
      - name: Test original RYU PerfHook entrypoint and actual multidex assembly
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/ryu-perfhook-smali
          # Source RYU classes stay on the ephemeral runner; synthetic target
          # removes PerfHook only, to verify class closure and repack behavior.
          cp -a /tmp/ryu-perfhook-smali /tmp/ryu-perfhook-synthetic
          find /tmp/ryu-perfhook-synthetic -type f -path '*/com/projectryu/perf/PerfHook*.smali' -delete
          python3 - <<'PY'
          from pathlib import Path
          import re
          target = Path('/tmp/ryu-perfhook-synthetic')
          files = list(target.rglob('PowerKeeperApplication.smali'))
          assert len(files) == 1, files
          src = files[0].read_text(encoding='utf-8')
          # Original RYU has one PerfHook.getInstance(Context) call.
          expr = (r'(?m)^ *invoke-static *\{[vp]\d+\}, *'
                  r'Lcom/projectryu/perf/PerfHook;->getInstance'
                  r'\(Landroid/content/Context;\)Lcom/projectryu/perf/PerfHook;[ \t]*\n'
                  r' *move-result-object +[vp]\d+[ \t]*\n'
                  r' *invoke-virtual *\{[vp]\d+\}, *'
                  r'Lcom/projectryu/perf/PerfHook;->init\(\)V[ \t]*\n')
          edited, count = re.subn(expr, '', src)
          assert count == 1, f'RYU two-stage PerfHook activation not as expected: {count}'
          files[0].write_text(edited, encoding='utf-8')
          PY
          python3 bin/package/NOTIFICATION_FIX/A16/ryu_perfhook_port.py \
            --ryu /tmp/ryu-perfhook-smali \
            --stock /tmp/ryu-perfhook-synthetic \
            --report reports/ryu-perfhook-synthetic-install.json
          python3 - <<'PY'
          import json
          r=json.load(open('reports/ryu-perfhook-synthetic-install.json'))
          assert r['class_count'] >= 17, r
          print('[PASS] RYU PerfHook dependency closure:',r['class_count'])
          PY
          java -jar bin/apktool/apke.jar b -f \
            -i /tmp/ryu-perfhook-synthetic -o /tmp/ryu-perfhook-verify.apk
          test -s /tmp/ryu-perfhook-verify.apk
          unzip -tq /tmp/ryu-perfhook-verify.apk
          unzip -Z1 /tmp/ryu-perfhook-verify.apk | grep -Eq '^classes[2-9][0-9]*\.dex$'
          echo '[PASS] Original RYU PerfHook injected, bytecode reassembled, valid multidex APK'

      - name: Publish test report (no APK or proprietary smali)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryu-perfhook-port-preflight-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Save RYU PerfHook method inventory to test branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cp reports/ryu-perfhook-dependency-map.md docs/RYU-PERFHOOK-ACTUAL-INVENTORY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RYU-PERFHOOK-ACTUAL-INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit: update RYU PerfHook method inventory on test branch'
            git push origin HEAD:test-ryu-performance-haotian
          fi
