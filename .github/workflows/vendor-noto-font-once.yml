name: Vendor Noto Sans font once

on:
  push:
    paths:
      - '.github/workflows/vendor-noto-font-once.yml'

permissions:
  contents: write

jobs:
  vendor-noto-sans:
    if: github.repository == 'ngocminhvn/HyperMOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Fetch pinned Noto Sans variable binary
        shell: bash
        run: |
          set -euo pipefail
          dest="bin/modfile/UpdateFile/Fonts/HyperOS/NotoSans-VF.ttf"
          mkdir -p "$(dirname "$dest")"
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/2eb0b48d5f760f62e286216f0859a8c540dbc1bd/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf' \
            -o "$dest"
          python3 - "$dest" <<'PY'
          import hashlib
          import pathlib
          import sys
          p = pathlib.Path(sys.argv[1])
          raw = p.read_bytes()
          git_hash = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          assert len(raw) == 2049096, f"Unexpected Noto Sans size: {len(raw)}"
          assert git_hash == "75575046c015ff623a848096a15779867ba71453", git_hash
          print(f"[OK] Verified Noto Sans binary: {len(raw)} bytes, SHA {git_hash}")
          PY

      - name: Commit bundled font into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bin/modfile/UpdateFile/Fonts/HyperOS/NotoSans-VF.ttf
          git diff --cached --quiet && exit 0
          git commit -m "fonts: bundle verified Noto Sans VF into ROM source"
          git push origin HEAD:main
