name: EU ZK304 notification patch tests
on:
  push:
    paths:
      - 'bin/package/NOTIFICATION_FIX/A16/EU/**'
      - '.github/workflows/test-eu-a16-notification.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Python
        run: |
          python3 -m compileall -q bin/package/NOTIFICATION_FIX/A16/EU
      - name: Run unit tests
        run: |
          python3 -m unittest discover -s bin/package/NOTIFICATION_FIX/A16/EU/tests -v
      - name: Verify real EU-to-ZK PowerKeeper method merge and DEX assembly
        run: |
          set -euo pipefail
          dir=/tmp/zk304-pk-test
          mkdir -p "$dir/eu" "$dir/zk"
          zstd -q -d -f bin/package/NOTIFICATION_FIX/A16/CN/eu-powerkeeper.dex.zst -o "$dir/eu.dex"
          zstd -q -d -f bin/package/NOTIFICATION_FIX/A16/EU/ZK304/zk304-powerkeeper.dex.zst -o "$dir/zk.dex"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          a=Path('/tmp/zk304-pk-test/eu.dex').read_bytes()
          assert hashlib.sha256(a).hexdigest()=='ad30c2d2aa6d474c1b975bce8fb0f8816fc4dafe19fc825ff23022a5016f73ae'
          PY
          java -jar bin/apktool/baksmaliv2.jar d --api 36 "$dir/eu.dex" -o "$dir/eu"
          java -jar bin/apktool/baksmaliv2.jar d --api 36 "$dir/zk.dex" -o "$dir/zk"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/donor_powerkeeper_port_a16.py             --eu "$dir/eu" --zk "$dir/zk" --report "$dir/port-report.json"
          java -jar bin/apktool/smaliv2.jar a --api 36 "$dir/eu" -o "$dir/merged.dex"
          java -jar bin/apktool/baksmaliv2.jar d --api 36 "$dir/merged.dex" -o "$dir/verified"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/zk304-pk-test')
          report=json.loads((p/'port-report.json').read_text())
          assert report['ported_count']>0
          assert (p/'merged.dex').stat().st_size>3_000_000
          print('Merged methods:',report['ported_count'],'Rejected:',report['rejected_count'], 'EU-retained signatures:',len(report['eu_missing_donor_signatures']))
          PY
      - name: Upload PowerKeeper policy ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk304-eu-powerkeeper-methods
          path: /tmp/zk304-pk-test/port-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Test ZK304 Greeze and Doze donor merge against actual EU309
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/zk304-miui-test
          mkdir -p "$d/zk" "$d/eu"
          gh run download 39452530513 --repo "$GITHUB_REPOSITORY"             --name xiaomieu-original-miui-services-39452530513             --dir "$d/eu"
          test -s "$d/eu/miui-services.jar"
          zstd -q -d -f bin/package/NOTIFICATION_FIX/A16/EU/ZK304/zk304-miui-services.jar.zst             -o "$d/zk/miui-services.jar"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('bin/package/NOTIFICATION_FIX/A16/EU/ZK304/manifest.json').read_text())
          raw=Path('/tmp/zk304-miui-test/zk/miui-services.jar').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==m['files']['miui-services.jar']
          PY
          for origin in zk eu; do
            mkdir -p "$d/$origin/disasm"
            unzip -q "$d/$origin/miui-services.jar" 'classes*.dex' -d "$d/$origin/disasm"
            for dex in "$d/$origin/disasm"/classes*.dex; do
              stem="$(basename "$dex" .dex)"
              group=smali
              [[ "$stem" == classes ]] || group="smali_$stem"
              java -jar bin/apktool/baksmaliv2.jar d --api 36 "$dex"                 -o "$d/$origin/disasm/$group"
            done
          done
          python3 bin/package/NOTIFICATION_FIX/A16/EU/donor_greeze_policy_port_a16.py             "$d/eu/disasm" "$d/zk/disasm" --report "$d/greeze.json"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/donor_notification_policy_a16.py             "$d/eu/disasm" "$d/zk/disasm" --report "$d/notification.json"
          for dex in "$d/eu/disasm"/classes*.dex; do
            stem="$(basename "$dex" .dex)"
            group=smali
            [[ "$stem" == classes ]] || group="smali_$stem"
            java -jar bin/apktool/smaliv2.jar a --api 36               "$d/eu/disasm/$group" -o "$d/eu/$stem.dex"
          done
          cat "$d/greeze.json"
          cat "$d/notification.json"
      - name: Upload Greeze ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk304-eu-greeze-policy-audit
          path: /tmp/zk304-miui-test/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify pinned ZK304 donor integrity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          zstd -q -d -f bin/package/NOTIFICATION_FIX/A16/EU/ZK304/zk304-miui-services.jar.zst -o /tmp/zk304.jar
          zstd -q -d -f bin/package/NOTIFICATION_FIX/A16/EU/ZK304/zk304-powerkeeper.dex.zst -o /tmp/zk304-powerkeeper.dex
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('bin/package/NOTIFICATION_FIX/A16/EU/ZK304/manifest.json').read_text())
          checks={'miui-services.jar':'/tmp/zk304.jar','classes.dex':'/tmp/zk304-powerkeeper.dex'}
          for key,source in checks.items():
              assert hashlib.sha256(Path(source).read_bytes()).hexdigest()==m['files'][key],key
          print('Verified original ZK304 JAR + PowerKeeper policy donor hashes')
          PY
