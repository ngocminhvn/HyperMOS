name: Super IMG Editor

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Link ROM mod (ZIP co super.img)'
        required: true
        type: string
      root_mode:
        description: 'KernelSU Next root or preserve original root/stock'
        required: true
        type: choice
        default: root
        options:
          - root
          - stock
      upload_method:
        description: 'Upload with Rclone or Pixeldrain'
        required: true
        type: choice
        default: drive
        options:
          - drive
          - pixeldrain

permissions:
  contents: read

jobs:
  run-super-img-editor:
    # Only a small UI launcher is on main. All ROM editing code stays on super-img-editor.
    uses: ngocminhvn/HyperMOS/.github/workflows/super-editor.yml@super-img-editor
    with:
      input_url: ${{ inputs.input_url }}
      root_mode: ${{ inputs.root_mode }}
      upload_method: ${{ inputs.upload_method }}
    secrets: inherit
