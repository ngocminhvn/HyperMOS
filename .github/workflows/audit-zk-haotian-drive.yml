                  regions = {region for _, region, _ in ranked}
                  if len(regions) != 1:
                      raise SystemExit(f'Incompatible ZKOS ROM variants: {sorted(regions)}')
                  newest = max(version for version, _, _ in ranked)
                  winners = [item for version, _, item in ranked if version == newest]
                  if len(winners) != 1:
                      raise SystemExit('Multiple super.img files for newest release; cannot safely choose')
                  item = winners[0]
                  print('Detected super.img releases:', flush=True)
                  for version, region, candidate in sorted(ranked, key=lambda x: x[0], reverse=True):
                      print('  ', '.'.join(map(str, version)), region,
                            candidate.filename, candidate.file_size, flush=True)
                  print('SELECTED newest ZKOS:', item.filename, flush=True)
                  Path('reports/zk-drive/selected-super.txt').write_text(
                      item.filename + '\\n', encoding='utf-8')
                  if shutil.disk_usage('/tmp').free < item.file_size + 2147483648:
                      raise SystemExit('No space to stage super.img; larger runner needed')
                  with z.open(item) as src, open('/tmp/zk-super.img','wb') as dst:
                      shutil.copyfileobj(src,dst,length=16*1024*1024)
                  print('Super image:', item.filename, item.file_size, flush=True)
