name: Vietnamese Translation Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vietnamese-translation-audit.yml'
      - 'bin/modfile/UpdateFile/MultiLang/translation_audit.py'
      - 'bin/modfile/UpdateFile/MultiLang/compare_english_vi.py'
      - 'bin/modfile/UpdateFile/MultiLang/updatesource/**'
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Full stock HyperOS 3.0.308.0 China OTA ZIP URL'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip'

permissions:
  contents: read

jobs:
  vietnamese-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout with existing RRO APKs
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Locate AAPT2 (skip deprecated SDK tools package)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 unzip aapt zipalign > /dev/null
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"
          if [[ ! -x "$AAPT2" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            [[ -n "$SDKMANAGER" ]] || { echo "[ERROR] sdkmanager missing"; exit 1; }
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi
          [[ -x "$AAPT2" ]] || { echo "[ERROR] Android 36 AAPT2 missing"; exit 1; }
          echo "AAPT2_PATH=$AAPT2" >> "$GITHUB_ENV"
          "$AAPT2" version

      - name: Validate auditor
        run: |
          set -euo pipefail
          python3 -m py_compile bin/modfile/UpdateFile/MultiLang/translation_audit.py
          python3 bin/modfile/UpdateFile/MultiLang/translation_audit.py --self-test
          python3 -m py_compile bin/modfile/UpdateFile/MultiLang/compare_english_vi.py
          python3 bin/modfile/UpdateFile/MultiLang/compare_english_vi.py --self-test

      - name: Extract stock English application resources
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url || 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip' }}
        run: |
          set -euo pipefail
          if [[ -z "$ROM_URL" ]]; then
            echo "[ERROR] Full stock OTA URL is required for English to Vietnamese comparison."
            exit 2
          fi
          [[ "$ROM_URL" == https://* ]] || { echo "[ERROR] Full HTTPS OTA ZIP required"; exit 1; }
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/translation-stock"
          IMAGES="$WORK/images"
          STOCK="$WORK/unpacked"
          mkdir -p "$IMAGES" "$STOCK"
          BIN="$ROOT/bin/Linux/x86_64"
          chmod +x "$BIN/payload-extract" "$BIN/gettype" "$BIN/extract.erofs"
          INPUT="$ROM_URL"
          download_fallback() {
            local zip="$WORK/stock-ota.zip"
            local payload="$WORK/payload.bin"
            if [[ ! -s "$payload" ]]; then
              echo "[INFO] Range extraction failed, downloading full OTA once"
              aria2c -q -x 8 -s 8 --file-allocation=none -d "$WORK" -o stock-ota.zip "$ROM_URL"
              unzip -l "$zip" payload.bin >/dev/null || { echo "[ERROR] No payload.bin"; exit 1; }
              unzip -p "$zip" payload.bin > "$payload"
              test -s "$payload"
            fi
            INPUT="$payload"
          }
          for part in product system_ext system; do
            echo "[INFO] Extract partition: $part"
            if ! "$BIN/payload-extract" extract "$INPUT" -p "$part" -o "$IMAGES" -j 2; then
              if [[ "$INPUT" == "$ROM_URL" ]]; then
                download_fallback
                "$BIN/payload-extract" extract "$INPUT" -p "$part" -o "$IMAGES" -j 2
              else
                echo "[ERROR] Unable to extract $part"
                exit 1
              fi
            fi
            img="$IMAGES/$part.img"
            test -s "$img" || { echo "[ERROR] Missing $img"; exit 1; }
            fs="$("$BIN/gettype" -i "$img" || true)"
            if [[ "$fs" != "erofs" ]]; then
              echo "[ERROR] Unsupported $part file system '$fs' (expects EROFS)."
              exit 1
            fi
            mkdir -p "$STOCK/$part"
            "$BIN/extract.erofs" -x -i "$img" -o "$STOCK/$part" >/dev/null
            rm -f "$img"
          done
          echo "STOCK_APKS=$STOCK" >> "$GITHUB_ENV"

      - name: Audit all shipped translation overlays
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --overlays bin/modfile/UpdateFile/MultiLang/updatesource
            --extra-overlays bin/modfile/UpdateFile/MultiLang/supplemental
            --output translation-audit
            --aapt2 "$AAPT2_PATH"
          )
          if [[ -n "${STOCK_APKS:-}" ]]; then
            args+=(--stock-apks "$STOCK_APKS")
          fi
          python3 bin/modfile/UpdateFile/MultiLang/translation_audit.py "${args[@]}"
          cat translation-audit/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Export translations from existing top-priority overlays
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          src="bin/modfile/UpdateFile/MultiLang/updatesource"
          mkdir -p translation-audit/current-xml
          tool="bin/apktool/apktool.jar"
          : > translation-audit/apktool-errors.txt
          for name in Nothings.Settings Nothings.MiuiSystemUI Nothings.HyperPhoneSystemUI Nothings.MiuiSystemUIPlugin Nothings.SecurityCenter; do
            apk="$src/$name.apk"
            tmp="$RUNNER_TEMP/decoded-$name"
            echo "[TRANSLATION] Decoding $name"
            if ! java -Xmx3g -jar "$tool" d -f -s "$apk" -o "$tmp" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "[WARN] Could not decode $name" | tee -a translation-audit/apktool-errors.txt
              tail -n 12 "$RUNNER_TEMP/$name.log" >> translation-audit/apktool-errors.txt
              continue
            fi
            mkdir -p "translation-audit/current-xml/$name"
            for folder in "$tmp"/res/values "$tmp"/res/values-vi "$tmp"/res/values-vi-rVN; do
              if [[ -d "$folder" ]]; then
                cp -a "$folder" "translation-audit/current-xml/$name/"
              fi
            done
            cp "$tmp/AndroidManifest.xml" "translation-audit/current-xml/$name/AndroidManifest.xml"
            echo "[OK] Exported existing vi strings for $name"
          done

      - name: Compare original English strings with current Vietnamese overlays
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STOCK_APKS:-}" ]]; then
            echo "[EN-VI] Stock ROM not supplied. Cannot infer missing translations from overlays alone."
            printf '%s\n' 'English→Vietnamese resource comparison requires the matching stock ROM OTA.' \
              > translation-audit/ENGLISH_VI.md
          else
            python3 bin/modfile/UpdateFile/MultiLang/compare_english_vi.py \
              --report translation-audit/report.json \
              --stock-root "$STOCK_APKS" \
              --overlay-xml translation-audit/current-xml \
              --apktool bin/apktool/apktool.jar \
              --output translation-audit
            cat translation-audit/ENGLISH_VI.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload read-only audit report (original APKs untouched)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnamese-translation-audit
          path: |
            translation-audit/SUMMARY.md
            translation-audit/report.json
            translation-audit/missing.csv
            translation-audit/english-vietnamese-all.csv
            translation-audit/english-vietnamese-review.csv
            translation-audit/english-vi-summary.json
            translation-audit/ENGLISH_VI.md
            translation-audit/current-xml/
            translation-audit/apktool-errors.txt
          if-no-files-found: warn
          retention-days: 14
