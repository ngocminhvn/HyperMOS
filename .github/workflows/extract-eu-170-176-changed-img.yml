name: "EU 170 to 176 - All Changed IMG"

on:
  workflow_dispatch:
    inputs:
      base_drive_id:
        description: "Exact Google Drive file ID for HyperMOS EU #170"
        required: true
        type: string
        default: "1iL_cm52QLJ0KzCkkpV0xUUd6jSE4r-pW"
      target_pixeldrain_id:
        description: "Exact Pixeldrain file ID for HyperMOS EU #176"
        required: true
        type: string
        default: "z9mjqzdg"

permissions:
  contents: read

jobs:
  images:
    name: Compare #170 and #176 and export all modified IMG
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: /tmp/hypermos-170-to-176-${{ github.run_id }}
      DRIVE_ID: ${{ inputs.base_drive_id }}
      PIXELDRAIN_ID: ${{ inputs.target_pixeldrain_id }}
    steps:
      - name: Checkout comparison tools
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Prepare disk and extraction tools
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq \
            rclone curl unzip android-sdk-libsparse-utils e2fsprogs erofs-utils
          for executable in rclone curl unzip simg2img fsck.erofs debugfs; do
            command -v "$executable"
          done
          mkdir -p "$WORK/base" "$WORK/new" "$WORK/output" "$WORK/temp"
          python3 -m py_compile \
            bin/lpunpack.py bin/audit/audit_xiaomi_eu_apps.py \
            bin/audit/compare_build_partition_images.py \
            bin/audit/compare_build_firmware_images.py
          df -h /

      - name: Download #170 from Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_URL: ${{ secrets.RCLONE_TOKEN_PATH }}
        run: |
          set -euo pipefail
          [[ "$DRIVE_ID" =~ ^[a-zA-Z0-9_-]{10,100}$ ]] || { echo "::error::Invalid #170 Drive ID"; exit 1; }
          [ -n "$RCLONE_CONFIG_URL" ] || { echo "::error::Missing RCLONE_TOKEN_PATH secret"; exit 1; }
          case "$RCLONE_CONFIG_URL" in
            https://*) url="$RCLONE_CONFIG_URL" ;;
            //*) url="https:$RCLONE_CONFIG_URL" ;;
            *) url="https://$RCLONE_CONFIG_URL" ;;
          esac
          conf="$RUNNER_TEMP/hypermos-170-176-rclone.conf"
          trap 'rm -f "$conf"' EXIT
          curl -fsSL --retry 4 --retry-all-errors "$url" -o "$conf"
          chmod 600 "$conf"
          remote="$(rclone --config "$conf" listremotes | head -n 1)"
          [ -n "$remote" ] || { echo "::error::Drive remote is not configured"; exit 1; }
          rclone --config "$conf" --retries 3 backend copyid "$remote" \
            "$DRIVE_ID" "$WORK/base/rom170.zip"
          test -s "$WORK/base/rom170.zip"
          unzip -tqq "$WORK/base/rom170.zip"
          ls -lh "$WORK/base/rom170.zip"

      - name: Hash #170 external firmware IMG and extract #170 super
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/compare_build_firmware_images.py base \
            --zip "$WORK/base/rom170.zip" --manifest "$WORK/base-firmware.json"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0, "bin/audit")
          from audit_xiaomi_eu_apps import make_super
          folder = Path(os.environ["WORK"]) / "base"
          raw = make_super(folder / "rom170.zip", folder)
          if not raw.is_file() or raw.stat().st_size < 1000000000:
              raise SystemExit("Invalid #170 super.img")
          print("[#170 SUPER]", raw, raw.stat().st_size, flush=True)
          PY
          df -h /

      - name: Download #176 from Pixeldrain
        shell: bash
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$PIXELDRAIN_ID" =~ ^[a-zA-Z0-9]{5,32}$ ]] || { echo "::error::Invalid #176 Pixeldrain ID"; exit 1; }
          auth=()
          if [ -n "$PIXELDRAIN_API_KEY" ]; then auth=(-u ":$PIXELDRAIN_API_KEY"); fi
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            "${auth[@]}" "https://pixeldrain.com/api/file/$PIXELDRAIN_ID" \
            -o "$WORK/new/rom176.zip"
          test -s "$WORK/new/rom176.zip"
          unzip -tqq "$WORK/new/rom176.zip"
          ls -lh "$WORK/new/rom176.zip"

      - name: Export changed external firmware IMG and extract #176 super
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/compare_build_firmware_images.py target \
            --zip "$WORK/new/rom176.zip" --manifest "$WORK/base-firmware.json" \
            --output "$WORK/output"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0, "bin/audit")
          from audit_xiaomi_eu_apps import make_super
          folder = Path(os.environ["WORK"]) / "new"
          raw = make_super(folder / "rom176.zip", folder)
          if not raw.is_file() or raw.stat().st_size < 1000000000:
              raise SystemExit("Invalid #176 super.img")
          print("[#176 SUPER]", raw, raw.stat().st_size, flush=True)
          PY
          df -h /

      - name: Export ALL changed logical partition IMG, including product
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/compare_build_partition_images.py \
            --base-super "$WORK/base/super.raw.img" \
            --new-super "$WORK/new/super.raw.img" \
            --work "$WORK/temp" --output "$WORK/output"
          cat "$WORK/output/logical-differences.md"
          df -h /

      - name: Write hashes and clear, safe flash categories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          output = Path(os.environ["WORK"]) / "output"
          images = sorted(output.rglob("*.img"))
          if not images:
              raise SystemExit("No changed IMG files")
          digest_file = output / "SHA256SUMS"
          with digest_file.open("w") as f:
              for path in images:
                  sha = hashlib.sha256()
                  with path.open("rb") as reader:
                      for piece in iter(lambda: reader.read(8 * 1024 * 1024), b""):
                          sha.update(piece)
                  f.write(sha.hexdigest() + "  " + path.relative_to(output).as_posix() + "\n")
          lines = [
            "# HyperMOS EU #170 -> #176: changed images only",
            "",
            "Both source ZIPs were the actual previously built ROMs, not Xiaomi.eu stock.",
            "",
            "## Logical partitions (fastbootd; slot-aware)",
            *["- " + p.name for p in images if p.parent == output],
            "",
            "## Firmware partitions (bootloader fastboot; different flashing rules)",
            *["- " + p.name for p in images if p.parent == output / "firmware"],
            "",
            "product_a.img is INCLUDED, as are MiCTS, ColorOS and debloat changes inside it.",
            "No full super.img was added. Original system images are included, not delta patches.",
            "Check logical-differences.json and firmware-differences.json for exact changes.",
            "Device, active slot, dynamic partition metadata/space, AVB and rollback",
            "must be checked BEFORE manually flashing. No boot/flash tests were run.",
            "Never flash firmware with a blanket script based only on these hash differences.",
            ""
          ]
          (output / "README.md").write_text("\n".join(lines))
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a") as f:
                  f.write("\n".join(lines) + "\n")
          print("[READY] Changed IMG files:",*[str(p.relative_to(output)) for p in images],sep="\n - ")
          PY
          ls -lh "$WORK/output" "$WORK/output/firmware" || true

      - name: Upload changed images only
        uses: actions/upload-artifact@v4
        with:
          name: hypermos-eu-170-to-176-upgrade-img
          path: ${{ env.WORK }}/output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 4

      - name: Diagnostic on failure
        if: failure()
        shell: bash
        run: |
          echo "::error::Extraction incomplete; do not flash any partial output."
          df -h /
          ls -lh "$WORK/output" 2>/dev/null || true
