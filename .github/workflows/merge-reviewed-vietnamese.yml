name: Merge reviewed Vietnamese into existing overlays

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-reviewed-vietnamese.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: merge-reviewed-vi-main
  cancel-in-progress: false

jobs:
  merge-in-place:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout ROM sources and original overlay APK
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
          fetch-depth: 1

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y aapt zipalign > /dev/null
          command -v aapt
          command -v zipalign

      - name: Download matching stock English resource audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock-english-audit"
          gh run download 37764405522 \
            --repo "$GITHUB_REPOSITORY" \
            --name vietnamese-translation-audit \
            --dir "$RUNNER_TEMP/stock-english-audit"
          test -s "$RUNNER_TEMP/stock-english-audit/english-vietnamese-review.csv"

      - name: Self-test merge and verify translations against stock English
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/modfile/UpdateFile/MultiLang/merge_owned_vi.py
          python3 bin/modfile/UpdateFile/MultiLang/merge_owned_vi.py --self-test
          python3 bin/modfile/UpdateFile/MultiLang/merge_owned_vi.py \
            --original bin/modfile/UpdateFile/MultiLang/updatesource/Nothings.Settings.apk \
            --patch bin/modfile/UpdateFile/MultiLang/owned-additions/Nothings.Settings.xml \
            --english-review "$RUNNER_TEMP/stock-english-audit/english-vietnamese-review.csv" \
            --output "$RUNNER_TEMP/updated-vi" \
            --apktool bin/apktool/apktool.jar \
            --apksigner-jar bin/apktool/apksigner.jar \
            --aapt "$(command -v aapt)" \
            --zipalign "$(command -v zipalign)" \
            --key bin/package/DISABLE_AVB/HMATools/aosp/security/testkey.pk8 \
            --cert bin/package/DISABLE_AVB/HMATools/aosp/security/testkey.x509.pem
          cat "$RUNNER_TEMP/updated-vi/patch-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the same original overlay APK filename and commit
        shell: bash
        run: |
          set -euo pipefail
          apk=bin/modfile/UpdateFile/MultiLang/updatesource/Nothings.Settings.apk
          test -s "$RUNNER_TEMP/updated-vi/Nothings.Settings.apk"
          cp "$RUNNER_TEMP/updated-vi/Nothings.Settings.apk" "$apk"
          git add "$apk"
          if git diff --cached --quiet; then
            echo "[VI-MERGE] No binary changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m "l10n(vi): add original Language and region strings to existing Settings overlay"
          git push origin HEAD:main

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-vietnamese-additive-merge-report
          path: |
            ${{ runner.temp }}/updated-vi/patch-report.json
            ${{ runner.temp }}/updated-vi/patch.log
          retention-days: 14
          if-no-files-found: warn
