name: Prebuild OS4 Vietnamese Overlays

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'China HyperOS4 Android17 OTA ZIP (reference ROM; overlays shared by ROM version, NOT device)'
        type: string
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.0.17.XOBCNXM/haotian-ota_full-OS4.0.0.17.XOBCNXM-user-17.0-052b694294.zip'
  push:
    paths:
      - '.github/workflows/prebuild-os4-vi.yml'

permissions:
  contents: write

concurrency:
  group: prebuild-os4-vi-main
  cancel-in-progress: false

jobs:
  prebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HYPERMOS_OS4_VI_PREBUILD: '1'
      INPUT_URL: ${{ inputs.input_url || 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.0.17.XOBCNXM/haotian-ota_full-OS4.0.0.17.XOBCNXM-user-17.0-052b694294.zip' }}

    steps:
      - name: Checkout main and LFS
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          persist-credentials: true

      - name: Prepare extraction and Android APK tooling
        shell: bash
        run: |
          set -euo pipefail
          : > build_action.log
          if [[ -z "${JAVA_HOME_17_X64:-}" || ! -x "${JAVA_HOME_17_X64}/bin/java" ]]; then
            echo "::error::JDK 17 missing"
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          FREE_GB=$(df -BG / | awk 'NR==2{gsub("G","",$4); print $4}')
          if (( FREE_GB < 60 )); then
            sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules || true
            df -h /
          fi
          sudo apt-get -o Acquire::Retries=3 update -qq >>build_action.log 2>&1
          sudo apt-get -o Acquire::Retries=3 install -y -qq \
            aria2 jq rclone sshpass lz4 python-is-python3 wget python3 xz-utils zlib1g-dev \
            gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip \
            erofs-utils unzip p7zip-full 7zip 7zip-standalone zipalign zstd bc \
            android-sdk-libsparse-utils xmlstarlet secilc binutils >>build_action.log 2>&1 || {
              tail -n 80 build_action.log
              exit 1
            }
          sudo pip3 install -q ConfigObj telebot setuptools requests google-auth lz4 \
            google-auth-oauthlib google-auth-httplib2 google-api-python-client \
            fonttools pillow >>build_action.log 2>&1 || {
              tail -n 80 build_action.log
              exit 1
            }
          sudo chmod -R a+rwX .
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/apksigner"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Extract China OS4 base ROM only (NO ROM mods / NO repack)
        shell: bash
        run: |
          set -euo pipefail
          sudo -E bash build.sh "$INPUT_URL" "$GITHUB_REPOSITORY" xiaomi "" \
            2>&1 | tee -a build_action.log
          [[ "$(tr -d '\r\n' < bin/ddevice/rom_os.txt)" == "OS4" ]]
          [[ "$(tr -d '\r\n' < bin/ddevice/androidver.txt)" == "17" ]]
          [[ "$(tr -d '\r\n' < bin/ddevice/rom_source.txt)" == "china" ]]

      - name: Compile, sign and package shared overlays by ROM version
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/modfile/UpdateFile/MultiLang/OS4/package_prebuilt.py \
            build/baserom/images bin/ddevice/base_rom_code.txt \
            2>&1 | tee -a build_action.log
          VERSION="$(python3 bin/modfile/UpdateFile/MultiLang/OS4/rom_version.py)"
          DEST="bin/modfile/UpdateFile/MultiLang/OS4/updatesource/$VERSION"
          test -s "$DEST/manifest.json"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### OS4 Vietnamese shared overlays" >> "$GITHUB_STEP_SUMMARY"
          echo "- ROM version: **$VERSION** (no codename)" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$DEST/manifest.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          m=json.load(open(sys.argv[1],encoding="utf-8"))
          print(f"- Signed prebuilt RRO APKs: **{len(m['overlays'])}**")
          PY
          echo "- Destination: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit prebuilt APKs to main, like OS3 overlay source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.bundle.outputs.version }}"
          DEST="bin/modfile/UpdateFile/MultiLang/OS4/updatesource/$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f "$DEST"
          if git diff --cached --quiet; then
            echo "[OK] Version $VERSION already has identical prebuilt overlays"
            exit 0
          fi
          git commit -m "build(multilang): prebuild shared Vietnamese overlays for $VERSION"
          git push origin HEAD:main

      - name: Upload additional copy of prebuilt APKs
        uses: actions/upload-artifact@v4
        with:
          name: os4-vi-overlays-${{ steps.bundle.outputs.version }}
          path: bin/modfile/UpdateFile/MultiLang/OS4/updatesource/${{ steps.bundle.outputs.version }}/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Failure diagnostics
        if: failure()
        run: |
          tail -n 100 build_action.log || true
