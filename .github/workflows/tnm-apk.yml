name: Build TNM APK

on:
  workflow_dispatch:
  push:
    branches:
      - tnm-app
    paths:
      - 'TNM/**'
      - '.github/workflows/tnm-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        working-directory: TNM
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp TNM/app/build/outputs/apk/debug/app-debug.apk TNM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TNM-debug-apk
          path: TNM-debug.apk
          if-no-files-found: error
