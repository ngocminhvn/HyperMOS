name: Build TNM APK

on:
  workflow_dispatch:
  push:
    branches:
      - tnm-app
    paths:
      - 'TNM/**'
      - '.github/workflows/tnm-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build signed debug APK
        working-directory: TNM
        env:
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_CLOUD_PROJECT_NUMBER }}
          PLAY_INTEGRITY_BACKEND_URL: ${{ secrets.PLAY_INTEGRITY_BACKEND_URL }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp TNM/app/build/outputs/apk/debug/app-debug.apk TNM-signed-debug.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs TNM-signed-debug.apk
          "$ZIPALIGN" -c -v 4 TNM-signed-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TNM-signed-debug-apk
          path: TNM-signed-debug.apk
          if-no-files-found: error
