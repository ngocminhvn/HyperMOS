name: Extract RYUOS ProjectRYU Apps + Permissions

on:
  workflow_dispatch:
  push:
    branches:
      - test-ryu-performance-haotian
    paths:
      - '.github/workflows/ryu-extract-projectryu-apps.yml'

permissions:
  contents: read

concurrency:
  group: ryu-projectryu-app-extraction
  cancel-in-progress: false

env:
  RYU_FILE: ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip

jobs:
  extract-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout test branch scripts
        uses: actions/checkout@v4

      - name: Free disk and install read-only extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 curl unzip zip file jq aapt erofs-utils e2fsprogs \
            android-sdk-libsparse-utils
          df -h /tmp

      - name: Fail-fast test - APK/package and XML filtering
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            bin/audit/download_ryu_fast.py \
            bin/audit/extract_ryu_apps.py \
            bin/audit/ryu_super_partitions.py
          root="$(mktemp -d)"
          mkdir -p "$root/input/priv-app/ProjectRYU" \
            "$root/input/app/Unrelated" "$root/input/etc/permissions"
          printf 'dummy apk\n' > "$root/input/priv-app/ProjectRYU/base.apk"
          printf 'other apk\n' > "$root/input/app/Unrelated/base.apk"
          printf '%s\n' '<permissions><privapp-permissions package="com.projectryu.app"/></permissions>' \
            > "$root/input/etc/permissions/custom.xml"
          printf '%s\n' '<permissions><privapp-permissions package="com.other.app"/></permissions>' \
            > "$root/input/etc/permissions/other.xml"
          python3 bin/audit/extract_ryu_apps.py --scan \
            --root "$root/input" --partition product --output "$root/output"
          python3 bin/audit/extract_ryu_apps.py --finish \
            --output "$root/output" --source fixture
          python3 - "$root/output" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = [x["path"] for x in json.loads((root / "manifest.json").read_text())["files"]]
          assert any(x.endswith("ProjectRYU/base.apk") for x in files), files
          assert any(x.endswith("permissions/custom.xml") for x in files), files
          assert not any("Unrelated" in x or "other.xml" in x for x in files), files
          print("[PASS] ProjectRYU app and related grants only")
          PY
          rm -rf "$root"

      - name: Download original RYUOS - benchmark mirrors and fall back automatically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ryu-apps/output /tmp/ryu-apps/results
          python3 bin/audit/download_ryu_fast.py \
            --file "$RYU_FILE" \
            --output /tmp/ryu-apps/ryu-rom.zip \
            --report /tmp/ryu-apps/output/mirror-report.json
          ls -lh /tmp/ryu-apps/ryu-rom.zip
          df -h /tmp

      - name: Collect any extra ProjectRYU files packaged outside super.img
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath
          output = Path("/tmp/ryu-apps/outer-zip")
          output.mkdir(parents=True, exist_ok=True)
          count = 0
          with zipfile.ZipFile("/tmp/ryu-apps/ryu-rom.zip") as archive:
              for item in archive.infolist():
                  p = PurePosixPath(item.filename)
                  if (item.is_dir() or p.is_absolute() or
                      any(part in ("", ".", "..") for part in p.parts)):
                      continue
                  lower = p.as_posix().lower()
                  app = lower.endswith(".apk") and "ryu" in lower and item.file_size < 350 * 1024 * 1024
                  config = (
                      lower.endswith((".xml", ".rc", ".prop", ".json"))
                      and item.file_size < 8 * 1024 * 1024
                      and ("ryu" in lower or any(x in lower for x in (
                          "/etc/permissions/", "/etc/sysconfig/",
                          "/etc/default-permissions/"
                      )))
                  )
                  if not (app or config):
                      continue
                  dest = output.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(item) as src, dest.open("wb") as dst:
                      shutil.copyfileobj(src, dst, 1024 * 1024)
                  count += 1
          print(f"[RYU-APP] Directly packaged ZIP members selected: {count}")
          PY
          python3 bin/audit/extract_ryu_apps.py --scan \
            --root /tmp/ryu-apps/outer-zip --partition romzip \
            --output /tmp/ryu-apps/output
          rm -rf /tmp/ryu-apps/outer-zip

      - name: Stream only super.img out of ROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          archive = "/tmp/ryu-apps/ryu-rom.zip"
          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist()
                       if n.endswith("/super.img") or n == "super.img"]
              if len(names) != 1:
                  raise SystemExit(f"Expected one super.img, got: {names}")
              with z.open(names[0]) as src, open("/tmp/ryu-apps/super.img", "wb") as dst:
                  shutil.copyfileobj(src, dst, length=16 * 1024 * 1024)
          PY
          rm -f /tmp/ryu-apps/ryu-rom.zip
          if python3 - <<'PY'
          from pathlib import Path
          import struct
          with Path("/tmp/ryu-apps/super.img").open("rb") as f:
              magic = struct.unpack("<I", f.read(4))[0]
          raise SystemExit(0 if magic == 0xED26FF3A else 1)
          PY
          then
            simg2img /tmp/ryu-apps/super.img /tmp/ryu-apps/super.raw
            mv -f /tmp/ryu-apps/super.raw /tmp/ryu-apps/super.img
          fi
          python3 bin/audit/ryu_super_partitions.py \
            --super /tmp/ryu-apps/super.img \
            --json /tmp/ryu-apps/output/partition-info.json \
            --names /tmp/ryu-apps/partition-names.txt
          df -h /tmp

      - name: Extract RYU apps and permission references, one partition at a time
        shell: bash
        run: |
          set -euo pipefail
          for base in product system_ext system mi_ext vendor odm; do
            choice=""
            if grep -Fxq "${base}_a" /tmp/ryu-apps/partition-names.txt; then
              choice="${base}_a"
            elif grep -Fxq "$base" /tmp/ryu-apps/partition-names.txt; then
              choice="$base"
            else
              echo "::notice::No $base partition"
              continue
            fi

            echo "::group::Scanning $choice"
            rm -rf /tmp/ryu-apps/partition /tmp/ryu-apps/fs
            mkdir -p /tmp/ryu-apps/partition /tmp/ryu-apps/fs
            python3 bin/lpunpack.py -p "$choice" \
              /tmp/ryu-apps/super.img /tmp/ryu-apps/partition
            img="/tmp/ryu-apps/partition/${choice}.img"
            test -s "$img"
            kind="$(file -b "$img")"
            echo "Filesystem: $kind"

            mounted=0
            if grep -qi erofs <<<"$kind"; then
              fsck.erofs --extract=/tmp/ryu-apps/fs "$img"
            elif grep -Eqi 'ext[234] filesystem' <<<"$kind"; then
              if sudo mount -t ext4 -o loop,ro,noload "$img" /tmp/ryu-apps/fs; then
                mounted=1
              else
                echo "::warning::Loop mount denied; trying debugfs read-only extraction"
                for p in /app /priv-app /etc/permissions /etc/sysconfig \
                         /etc/default-permissions /etc/init /system/app \
                         /system/priv-app /system/etc/permissions /system/etc/sysconfig; do
                  mkdir -p "/tmp/ryu-apps/fs$p"
                  debugfs -R "rdump $p /tmp/ryu-apps/fs$p" "$img" \
                    >> /tmp/ryu-apps/debugfs.log 2>&1 || true
                done
              fi
            else
              echo "::error::Unsupported filesystem: $kind"
              exit 1
            fi

            python3 bin/audit/extract_ryu_apps.py --scan \
              --root /tmp/ryu-apps/fs --partition "$base" \
              --output /tmp/ryu-apps/output
            if [[ "$mounted" == 1 ]]; then sudo umount /tmp/ryu-apps/fs; fi
            rm -rf /tmp/ryu-apps/partition /tmp/ryu-apps/fs
            df -h /tmp
            echo "::endgroup::"
          done
          rm -f /tmp/ryu-apps/super.img

      - name: Validate collected packages, matching permissions and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/extract_ryu_apps.py --finish \
            --output /tmp/ryu-apps/output --source "$RYU_FILE"
          cd /tmp/ryu-apps/output
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import json
          m = json.load(open("manifest.json"))
          print(f"Matched APKs: {len(m['apps'])}")
          print(f"Permission/config files: {len(m['related_config_paths'])}")
          for apk in m["apps"]:
              print(apk["partition"], apk["source_apk"], apk["package"])
          PY

      - name: Pack small shareable ZIP; split only if it exceeds 400 MiB
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ryu-apps/output
          zip -q -r -1 /tmp/ryu-apps/results/RYUOS-ProjectRYU-Apps.zip \
            files manifest.json SHA256SUMS.txt README.txt \
            mirror-report.json partition-info.json
          cd /tmp/ryu-apps/results
          if (( $(stat -c '%s' RYUOS-ProjectRYU-Apps.zip) > 419430400 )); then
            split -b 400M -d -a 2 \
              RYUOS-ProjectRYU-Apps.zip RYUOS-ProjectRYU-Apps.zip.part
            rm -f RYUOS-ProjectRYU-Apps.zip
            printf 'Join parts in order with: cat RYUOS-ProjectRYU-Apps.zip.part* > RYUOS-ProjectRYU-Apps.zip\n' \
              > REASSEMBLE.txt
          fi
          ls -lh /tmp/ryu-apps/results/*

      - name: Upload targeted original app and permission archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RYUOS-ProjectRYU-Apps-Permissions
          path: /tmp/ryu-apps/results/*
          retention-days: 14
          if-no-files-found: error
