name: Import KouseiPatcher once

on:
  push:
    paths:
      - '.github/workflows/import-kousei-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HyperMOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch KouseiPatcher from HalcyonOS
        run: |
          set -euo pipefail
          rm -rf /tmp/halcyon
          git clone --depth=1 --filter=blob:none --sparse https://github.com/hpbzareth/HalcyonOS.git /tmp/halcyon
          git -C /tmp/halcyon sparse-checkout set bin/package/KouseiPatcher
          rm -rf bin/package/KouseiPatcher
          cp -a /tmp/halcyon/bin/package/KouseiPatcher bin/package/KouseiPatcher

      - name: Commit imported package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/package/KouseiPatcher
          if git diff --cached --quiet; then
            echo "KouseiPatcher is already up to date."
            exit 0
          fi
          git commit -m "Import KouseiPatcher from HalcyonOS"
          git push origin HEAD:main
