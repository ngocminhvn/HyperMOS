name: MiCTS hook smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'bin/package/MICTS/**'
      - '.github/workflows/test-micts-hook.yml'
  pull_request:
    paths:
      - 'bin/package/MICTS/**'
      - '.github/workflows/test-micts-hook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate shell and Python syntax
        shell: bash
        run: |
          bash -n bin/package/MICTS/update.sh
          python3 -m py_compile bin/package/MICTS/patch.py bin/package/MICTS/test_patch.py bin/package/MICTS/dex_audit.py bin/package/MICTS/test_compile.py
      - name: Test strict CSService hook behavior and failure checks
        shell: bash
        run: |
          python3 -m unittest discover -v -s bin/package/MICTS -p 'test_patch.py'
      - name: Assemble patched mock JAR DEX with smali and audit
        shell: bash
        run: |
          python3 bin/package/MICTS/test_compile.py

      - name: Build experimental MiCTS v2.6 QS tile APK
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --branch v2.6 --depth 1 https://github.com/parallelcc/MiCTS.git "$RUNNER_TEMP/micts-test-src"
          python3 bin/package/MICTS/patch_tile_test.py --source "$RUNNER_TEMP/micts-test-src"
          cd "$RUNNER_TEMP/micts-test-src"
          chmod +x gradlew
          ./gradlew :app:assembleMiCTSDebug :app:assembleVISTriggerDebug --no-daemon --stacktrace
          find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\\n'
          mkdir -p "$GITHUB_WORKSPACE/micts-apk"
          find app/build/outputs/apk -name '*MiCTS*debug*.apk' -type f -exec cp {} "$GITHUB_WORKSPACE/micts-apk/MiCTS_2.6_TileFix_TEST.apk" \;
          test -s "$GITHUB_WORKSPACE/micts-apk/MiCTS_2.6_TileFix_TEST.apk"
          find app/build/outputs/apk/VISTrigger/debug -name '*.apk' -type f -exec cp {} "$GITHUB_WORKSPACE/micts-apk/MiCTS_2.6_TileFix_Companion_TEST.apk" \;
          test -s "$GITHUB_WORKSPACE/micts-apk/MiCTS_2.6_TileFix_Companion_TEST.apk"

      - name: Upload unsigned-upstream-identity signed debug MiCTS test APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCTS-2.6-TileFix-TEST-debug-signed
          path: micts-apk/*.apk
          if-no-files-found: error
          retention-days: 7
