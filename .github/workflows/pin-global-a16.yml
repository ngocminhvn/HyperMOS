name: Pin Global A16 PowerKeeper donor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pin-global-a16.yml
      - bin/package/GLOBAL_A16/fetch_donor.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Fetch and pin SHA256-verified Global303 PowerKeeper DEX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/package/GLOBAL_A16/fetch_donor.py
          python3 bin/package/GLOBAL_A16/fetch_donor.py "$RUNNER_TEMP/global.dex"
          zstd -q -19 -f "$RUNNER_TEMP/global.dex" -o bin/package/GLOBAL_A16/global-powerkeeper.dex.zst
          zstd -q -d -c bin/package/GLOBAL_A16/global-powerkeeper.dex.zst | sha256sum | grep -q '^21c20b3ddbaab981276bab60ab6c2a0f62587ea6d87b84bc54aa33def6df25bf '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/package/GLOBAL_A16/global-powerkeeper.dex.zst
          if ! git diff --cached --quiet; then
            git commit -m 'chore(global-a16): pin verified Global303 PowerKeeper DEX'
            git push origin HEAD:main
          fi
