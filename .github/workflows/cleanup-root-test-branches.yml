name: One-time cleanup of merged root test branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-root-test-branches.yml

permissions:
  contents: write

jobs:
  remove-merged-tests:
    if: github.repository == 'ngocminhvn/HyperMOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify KernelSU Next was integrated into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/bin/root/patch_init_boot.sh?ref=main" \
            --jq '.path' | grep -Fxq 'bin/root/patch_init_boot.sh'
          gh api "repos/$GITHUB_REPOSITORY/contents/bin/root/detect_kernel_kmi.py?ref=main" \
            --jq '.path' | grep -Fxq 'bin/root/detect_kernel_kmi.py'
      - name: Remove only the two obsolete root test branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in test-root-ksu-haotian test-root-main-haotian; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" \
              --jq '.ref' > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "[CLEANUP] Removed $branch"
            else
              echo "[CLEANUP] Already absent: $branch"
            fi
          done
