name: Restore ZK304 raw DEX (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-zk-dex-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore original ZK304 port using raw classes DEX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,subprocess,tempfile,zipfile
          from pathlib import Path
          REV="e3efdf7a42cfa65cc17a4b9250e498b898cb7bf7"
          root=Path("bin/package/NOTIFICATION_FIX/A16")
          eu=root/"EU"
          cls=eu/"class"
          js=cls/"miui-services"
          pk=cls/"powerkeeper"
          js.mkdir(parents=True,exist_ok=True)
          pk.mkdir(parents=True,exist_ok=True)
          def show(file):
              return subprocess.check_output(["git","show",f"{REV}:{file}"])
          def text(file):
              return show(file).decode("utf-8")
          old=json.loads(text(eu/"ZK304/manifest.json"))
          with tempfile.TemporaryDirectory(prefix="zk304-dex-") as folder:
              d=Path(folder)
              (d/"jar.zst").write_bytes(show(eu/"ZK304/zk304-miui-services.jar.zst"))
              (d/"apk.zst").write_bytes(show(eu/"ZK304/zk304-powerkeeper.dex.zst"))
              subprocess.run(["zstd","-d","-q",str(d/"jar.zst"),"-o",str(d/"services.jar")],check=True)
              subprocess.run(["zstd","-d","-q",str(d/"apk.zst"),"-o",str(d/"classes.dex")],check=True)
              h=lambda b:hashlib.sha256(b).hexdigest()
              if h((d/"services.jar").read_bytes())!=old["files"]["miui-services.jar"]:
                  raise ValueError("Donor JAR hash failed")
              if h((d/"classes.dex").read_bytes())!=old["files"]["classes.dex"]:
                  raise ValueError("Donor PowerKeeper DEX hash failed")
              hashes={}
              with zipfile.ZipFile(d/"services.jar") as z:
                  names=[n for n in z.namelist() if re.fullmatch(r"classes\d*\.dex",n)]
                  if not names or len(names)!=len(set(names)):
                      raise ValueError("Missing or duplicate donor DEX")
                  for n in names:
                      data=z.read(n)
                      if not data.startswith(b"dex\n"):raise ValueError("Invalid DEX header")
                      (js/n).write_bytes(data)
                      hashes["miui-services/"+n]=h(data)
              pd=(d/"classes.dex").read_bytes()
              if not pd.startswith(b"dex\n"):raise ValueError("Invalid PowerKeeper DEX")
              (pk/"classes.dex").write_bytes(pd)
              hashes["powerkeeper/classes.dex"]=h(pd)
          (cls/"manifest.json").write_text(json.dumps({
              "rom":old["rom"],
              "source_workflow_run_id":old["source_workflow_run_id"],
              "source_artifact_name":old["source_artifact_name"],
              "files":hashes,
              "original_sha256":old["files"]
          },indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          scripts=["contentcatcher_eu_a16.py","verify_broadcast_greeze_a16.py",
                   "donor_notification_policy_a16.py","donor_greeze_policy_port_a16.py",
                   "donor_powerkeeper_port_a16.py","eu_powerkeeper_keep_metadata.py"]
          for filename in scripts:
              (eu/filename).write_text(text(eu/filename),encoding="utf-8")
          orig=subprocess.check_output(["git","show","9cc0e98c17d8c343364d9be0dc4596e3f921c4b7:bin/package/NOTIFICATION_FIX/A16/patch.sh"]).decode("utf-8")
          a=orig.index("  zk_dir=")
          b=orig.index('  for dex in "$zk_tmp/decoded"/classes*.dex; do',a)
          repl="""  zk_dir="$base/EU/class/miui-services"
          zk_manifest="$base/EU/class/manifest.json"
          [[ -s "$zk_manifest" ]] || { error "ZK304 class manifest missing"; exit 1; }
          mkdir -p "$zk_tmp/decoded"
          python3 - "$zk_dir" "$zk_manifest" "$zk_tmp/decoded" <<'PYZKSHA'
          import hashlib,json,re,sys
          from pathlib import Path
          src,manifest,out=(Path(p) for p in sys.argv[1:])
          expected=json.loads(manifest.read_text(encoding="utf-8"))["files"]
          files={p.name for p in src.glob("classes*.dex") if re.fullmatch(r"classes\\d*\\.dex",p.name)}
          names={k.removeprefix("miui-services/") for k in expected if k.startswith("miui-services/")}
          if not names or names!=files:raise SystemExit("Donor DEX list changed")
          for n in sorted(names):
              data=(src/n).read_bytes()
              if hashlib.sha256(data).hexdigest()!=expected["miui-services/"+n]:
                  raise SystemExit("Donor DEX SHA mismatch: "+n)
              (out/n).write_bytes(data)
          PYZKSHA
          """
          orig=orig[:a]+repl+orig[b:]
          if "zstd" in orig or ".zst" in orig:
              raise ValueError("Zstd reference remains in EU driver")
          (eu/"patch.sh").write_text(orig,encoding="utf-8")
          keeper=text(eu/"PowerKeeper_donor.sh")
          replacements={
              'archive="$d/ZK304/zk304-powerkeeper.dex.zst"':'archive="$d/class/powerkeeper/classes.dex"',
              'manifest="$d/ZK304/manifest.json"':'manifest="$d/class/manifest.json"',
              'for c in python3 zstd unzip zipalign aapt java;':'for c in python3 unzip zipalign aapt java;',
              'zstd -d -q -f "$archive" -o "$tmp/zk.dex"':'cp -f "$archive" "$tmp/zk.dex"',
              '["files"]["classes.dex"]':'["files"]["powerkeeper/classes.dex"]'
          }
          for frm,to in replacements.items():
              if frm not in keeper:raise ValueError("PowerKeeper route unexpected: "+frm)
              keeper=keeper.replace(frm,to)
          if "zstd" in keeper or ".zst" in keeper:raise ValueError("Zstd remains in PowerKeeper")
          (eu/"PowerKeeper_donor.sh").write_text(keeper,encoding="utf-8")
          dispatch=root/"patch.sh"
          current=dispatch.read_text(encoding="utf-8")
          a=current.index('if [[ "$rom_source" == xiaomi_eu ]]; then')
          b=current.index("\nfi",a)+len("\nfi")
          if "zk_patch.py" not in current[a:b]:raise ValueError("EU route unexpectedly changed")
          branch='''if [[ "$rom_source" == xiaomi_eu ]]; then
            info "[EU A16] Original ZK304 donor port with class/*.dex"
            bash "$base/EU/patch.sh" || exit 1
            exit 0
          fi'''
          dispatch.write_text(current[:a]+branch+current[b:],encoding="utf-8")
          for filename in ("zk_patch.py","zk_methods.json"):
              (eu/filename).unlink()
          (eu/"README.md").write_text(
              "# EU ZK304 raw DEX source\n\n"
              "The original ZIP-backed method-level policy is restored. "
              "Donor raw classes*.dex are stored under class/miui-services/ "
              "and class/powerkeeper/. class/manifest.json verifies them.\n\n"
              "No donor ZIP, .zst, backup workflow, daemon or runtime fetch. "
              "China policy remains unchanged. The altered PowerKeeper DEX "
              "invalidates the original Xiaomi APK signature. "
              "Full ROM boot and push/battery behavior require device testing.\n",
              encoding="utf-8")
          print("Donor raw DEX:",[(str(p),p.stat().st_size) for p in cls.rglob("*.dex")])
          PY
          bash -n bin/package/NOTIFICATION_FIX/A16/patch.sh
          bash -n bin/package/NOTIFICATION_FIX/A16/EU/patch.sh
          bash -n bin/package/NOTIFICATION_FIX/A16/EU/PowerKeeper_donor.sh
          python3 -m py_compile bin/package/NOTIFICATION_FIX/A16/EU/*.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("bin/package/NOTIFICATION_FIX/A16/EU")
          m=json.loads((d/"class/manifest.json").read_text())
          for rel,expected in m["files"].items():
              assert hashlib.sha256((d/"class"/rel).read_bytes()).hexdigest()==expected,rel
          assert '.zst' not in (d/"patch.sh").read_text()
          assert '.zst' not in (d/"PowerKeeper_donor.sh").read_text()
          print("PASS: Python syntax, shell syntax and original donor raw DEX hashes")
          PY
      - name: Commit restored ZK source and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-zk-dex-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- bin/package/NOTIFICATION_FIX/A16/patch.sh \
            bin/package/NOTIFICATION_FIX/A16/EU \
            .github/workflows/restore-zk-dex-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(eu): restore original ZK method port with class/*.dex donors"
          git push origin HEAD:main
