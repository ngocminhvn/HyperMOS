name: TNMFramework ROM Contract

on:
  push:
    branches:
      - main
      - test-ryu-performance-haotian
      - test-tnm-ryu-haotian
    paths:
      - 'bin/modfile/UpdateFile/TNM/**'
      - 'bin/modfile/UpdateFile/RYUPerfProfile/**'
      - 'bin/package/NOTIFICATION_FIX/A16/test_ryu_thermalctl.py'
      - 'bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh'
      - 'bin/package/NOTIFICATION_FIX/A16/ryu_full_powerkeeper_a16.py'
      - 'bin/package/NOTIFICATION_FIX/A16/test_ryu_full_powerkeeper_a16.py'
      - 'bin/package/COREPATCH/**'
      - '.github/workflows/tnm-framework-check.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate root-only on-demand interface and safe controls
        shell: bash
        run: |
          set -euo pipefail
          sh -n bin/modfile/UpdateFile/TNM/tnm-frameworkctl
          bash -n bin/modfile/UpdateFile/TNM/update.sh
          python3 bin/modfile/UpdateFile/TNM/test_tnm_framework.py
          python3 bin/modfile/UpdateFile/TNM/test_tnm_branch.py
          python3 -m unittest discover -s bin/package/NOTIFICATION_FIX/A16 -p test_ryu_thermalctl.py
      - name: Validate full RYU PowerKeeper DEX port
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh
          python3 -m unittest discover -s bin/package/NOTIFICATION_FIX/A16 -p test_ryu_full_powerkeeper_a16.py -v
      - name: Validate audited RYU gates and retained CorePatch stack
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/package/COREPATCH/jar_patcher_a16.sh
          bash -n bin/package/COREPATCH/update.sh
          python3 bin/package/COREPATCH/test_ryu_framework_gates_a16.py
          python3 bin/package/COREPATCH/test_ryu_policy_a16.py
          python3 bin/package/COREPATCH/test_ryu_doze_a16.py
