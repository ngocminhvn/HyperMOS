name: HyperMOS FastbootD Partitions

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Base ROM ZIP URL (default: Xiaomi.eu HAOTIAN EU309)'
        required: true
        type: string
        default: 'https://sourceforge.net/projects/xiaomi-eu-multilang-miui-roms/files/xiaomi.eu/HyperOS-STABLE-RELEASES/HyperOS3.0/xiaomi.eu_HAOTIAN_OS3.0.309.0.WOBCNXM_16_f5fba57993.zip/download'
      export_system:
        description: 'Export system.img'
        required: true
        type: boolean
        default: true
      export_system_ext:
        description: 'Export system_ext.img (FCM/notification fixes)'
        required: true
        type: boolean
        default: true
      export_product:
        description: 'Export product.img'
        required: true
        type: boolean
        default: true
      export_mi_ext:
        description: 'Export mi_ext.img'
        required: true
        type: boolean
        default: true
      export_vendor:
        description: 'Export vendor.img (SELinux precompiled policy cache)'
        required: true
        type: boolean
        default: false
      export_odm:
        description: 'Export odm.img (SELinux precompiled policy cache)'
        required: true
        type: boolean
        default: false
      builder_id:
        description: 'Optional builder ID (same as standard HyperMOS build)'
        required: false
        type: string
        default: ''
      upload_workers:
        description: 'Parallel Pixeldrain image uploads (1-6)'
        required: true
        type: number
        default: 4

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HYPERMOS_FASTBOOTD_ONLY: '1'
      INPUT_URL: ${{ inputs.input_url }}
      BUILDER_ID: ${{ inputs.builder_id }}
      ROOT_MODE: stock

    steps:
      - name: Check runner space
        id: diskcheck
        shell: bash
        run: |
          set -euo pipefail
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "[INFO] Runner free space: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 60 ]; then
            echo "need_cleanup=true" >> "$GITHUB_OUTPUT"
            docker rmi $(docker images -q) >/dev/null 2>&1 || true
            sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
            sudo apt-get -y purge azure-cli 'ghc*' 'zulu*' 'hhvm*' 'llvm*' firefox 'google*' 'dotnet*' powershell 'mysql*' 'php*' >/dev/null 2>&1 || true
            sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
            sudo apt-get clean
          else
            echo "need_cleanup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Pixeldrain upload credentials
        shell: bash
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [[ -z "${PIXELDRAIN_API_KEY:-}" ]]; then
            echo "::error::Set PIXELDRAIN_API_KEY in repository Actions secrets before building"
            exit 1
          fi

      - name: Validate selected partitions
        shell: bash
        env:
          EXPORT_SYSTEM: ${{ inputs.export_system }}
          EXPORT_SYSTEM_EXT: ${{ inputs.export_system_ext }}
          EXPORT_PRODUCT: ${{ inputs.export_product }}
          EXPORT_MI_EXT: ${{ inputs.export_mi_ext }}
          EXPORT_VENDOR: ${{ inputs.export_vendor }}
          EXPORT_ODM: ${{ inputs.export_odm }}
        run: |
          set -euo pipefail
          python3 bin/fastbootd/export.py --self-test
          chosen=()
          [[ "$EXPORT_SYSTEM" == true ]] && chosen+=(system) || true
          [[ "$EXPORT_SYSTEM_EXT" == true ]] && chosen+=(system_ext) || true
          [[ "$EXPORT_PRODUCT" == true ]] && chosen+=(product) || true
          [[ "$EXPORT_MI_EXT" == true ]] && chosen+=(mi_ext) || true
          [[ "$EXPORT_VENDOR" == true ]] && chosen+=(vendor) || true
          [[ "$EXPORT_ODM" == true ]] && chosen+=(odm) || true
          (( ${#chosen[@]} > 0 )) || { echo "::error::Select at least one partition"; exit 1; }
          FASTBOOTD_PARTITIONS="$(IFS=,; printf '%s' "${chosen[*]}")"
          python3 bin/fastbootd/export.py --select "$FASTBOOTD_PARTITIONS"
          echo "FASTBOOTD_PARTITIONS=$FASTBOOTD_PARTITIONS" >> "$GITHUB_ENV"
          echo "[FASTBOOTD] Selected: $FASTBOOTD_PARTITIONS"

      - name: Prepare HyperMOS build tools
        shell: bash
        run: |
          set -euo pipefail
          : > build_action.log
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "${JAVA_HOME_17_X64}/bin/java" ]; then
            echo "::error::Java 17 unavailable on ubuntu-24.04"
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test >>build_action.log 2>&1
          sudo apt-get -o Acquire::Retries=3 update -qq >>build_action.log 2>&1
          sudo apt-get purge -y device-tree-compiler >>build_action.log 2>&1 || true
          sudo apt-get -o Acquire::Retries=3 install -y -qq \
            aria2 jq rclone sshpass lz4 python-is-python3 wget python3 xz-utils zlib1g-dev \
            gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip \
            erofs-utils unzip p7zip-full 7zip 7zip-standalone zipalign zstd bc \
            android-sdk-libsparse-utils xmlstarlet secilc binutils >>build_action.log 2>&1 || {
            tail -n 70 build_action.log
            exit 1
          }
          sudo pip3 install -q ConfigObj telebot setuptools requests google-auth lz4 \
            google-auth-oauthlib google-auth-httplib2 google-api-python-client \
            fonttools pillow >>build_action.log 2>&1 || {
            tail -n 70 build_action.log
            exit 1
          }
          sudo chmod -R a+rwX .
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true

      - name: Build ROM tree with all HyperMOS main modifications
        shell: bash
        run: |
          set -euo pipefail
          echo "[PHASE] Build ROM tree" | tee -a build_action.log
          sudo -E bash build.sh "$INPUT_URL" "$GITHUB_REPOSITORY" xiaomi "$BUILDER_ID" \
            2>&1 | tee -a build_action.log

      - name: Repack selected dynamic partition images
        id: repack
        shell: bash
        run: |
          set -euo pipefail
          echo "[PHASE] Pack FastbootD partition images" | tee -a build_action.log
          sudo -E bash bin/package/TNM/patch.sh --check-lock 2>&1 | tee -a build_action.log
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log
          # packROM.sh runs as root; the following Python uploader runs as the runner.
          # Transfer ownership of staged FastbootD outputs so it can write its
          # verified Pixeldrain JSON, link list and SHA-256 metadata beside the IMG files.
          sudo chown -R "$(id -u):$(id -g)" out/fastbootd
          test -w out/fastbootd
          test -s out/fastbootd/manifest.json
          echo "[FASTBOOTD] Images ready for Pixeldrain: ${FASTBOOTD_PARTITIONS}"
          echo "[FASTBOOTD] Run number: ${GITHUB_RUN_NUMBER}"

      # One Pixeldrain PUT per IMG. Files upload concurrently, not in a giant
      # GitHub artifact ZIP. Verify server-side SHA256 and publish checksums.
      - name: Upload partition IMG files to Pixeldrain in parallel
        shell: bash
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          PIXELDRAIN_WORKERS: ${{ inputs.upload_workers }}
        run: |
          set -euo pipefail
          python3 bin/fastbootd/pixeldrain_upload.py \
            --dir out/fastbootd \
            --workers "$PIXELDRAIN_WORKERS"

      - name: Build errors
        if: failure()
        shell: bash
        run: |
          echo "::group::Build failure context"
          if [ -f build_action.log ]; then tail -n 70 build_action.log; fi
          echo "::endgroup::"
