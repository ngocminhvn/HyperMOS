name: Extract RYUOS Control APKs for REA
# v3: sample fastest available SourceForge mirror, create exactly two ChatGPT-ready artifact ZIPs.

on:
  workflow_dispatch:
  push:
    branches:
      - test-ryu-performance-haotian
    paths:
      - .github/workflows/ryu-extract-control-apps.yml

permissions:
  contents: read

concurrency:
  group: ryu-control-apks-readonly
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/test-ryu-performance-haotian'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      RYU_ROM_URL: https://downloads.sourceforge.net/project/projectzk/ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip
      RYU_SHA256: 42dc542c9024c478e6b45af8e6fef6ba133176fe8201a14cf59496954516ba28
    steps:
      - name: Checkout RYU audit tools only
        uses: actions/checkout@v4

      - name: Preflight audit scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/audit/collect_ryu_control_apps.py bin/audit/ryu_super_partitions.py bin/lpunpack.py bin/audit/ryu_fast_mirror.py bin/audit/pack_ryu_chatgpt.py
          python3 bin/audit/pack_ryu_chatgpt.py --self-test
          df -h /tmp

      - name: Free disk and install read-only extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends erofs-utils e2fsprogs android-sdk-libsparse-utils unzip file curl
          df -h /tmp

      - name: Benchmark current SourceForge mirrors with 1 MiB HTTP range probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ryu-control
          python3 bin/audit/ryu_fast_mirror.py \
            --url "$RYU_ROM_URL" \
            --urls /tmp/ryu-mirror-candidates.txt \
            --report /tmp/ryu-control/mirror-benchmark.json
          cat /tmp/ryu-mirror-candidates.txt | sed -E 's/[?].*/?[mirror-selection]/' | nl -ba

      - name: Download pinned RYUOS from fastest validated mirror, fallback on error or wrong SHA
        shell: bash
        run: |
          set -euo pipefail
          success=0
          attempt=0
          while IFS= read -r candidate; do
            test -n "$candidate" || continue
            attempt=$(( attempt + 1 ))
            echo "::group::ROM mirror candidate $attempt"
            rm -f /tmp/ryu-rom.zip
            if curl --fail --location --retry 1 --retry-all-errors \
              --connect-timeout 25 --max-time 1500 \
              --speed-time 50 --speed-limit 65536 \
              --output /tmp/ryu-rom.zip "$candidate"; then
              if echo "$RYU_SHA256  /tmp/ryu-rom.zip" | sha256sum -c -; then
                success=1
                echo "Verified ROM SHA-256 using mirror candidate $attempt"
                echo "::endgroup::"
                break
              fi
              echo "::warning::Mirror candidate $attempt had wrong SHA-256; discarding"
            else
              echo "::warning::Mirror candidate $attempt failed or was too slow; trying next"
            fi
            echo "::endgroup::"
          done < /tmp/ryu-mirror-candidates.txt
          if [ "$success" -ne 1 ]; then
            echo "::error::No mirror downloaded the pinned SHA-256 ROM successfully"
            exit 1
          fi
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/ryu-rom.zip') as archive:
              matches = [x for x in archive.infolist() if x.filename.endswith('/super.img')]
              assert len(matches) == 1 and matches[0].file_size > 1024**3, 'Expected exactly one full super.img'
              print('Verified:', matches[0].filename, matches[0].file_size)
          PY

      - name: Unpack only super image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          with zipfile.ZipFile('/tmp/ryu-rom.zip') as archive:
              name = next(x.filename for x in archive.infolist() if x.filename.endswith('/super.img'))
              with archive.open(name) as src, open('/tmp/ryu-super.img', 'wb') as dst:
                  shutil.copyfileobj(src, dst, length=16*1024*1024)
          PY
          rm -f /tmp/ryu-rom.zip
          if python3 - <<'PY'
          from pathlib import Path
          raise SystemExit(0 if Path('/tmp/ryu-super.img').open('rb').read(4) == b'\x3a\xff\x26\xed' else 1)
          PY
          then
            simg2img /tmp/ryu-super.img /tmp/ryu-super.raw.img
            mv -f /tmp/ryu-super.raw.img /tmp/ryu-super.img
          fi
          mkdir -p /tmp/ryu-control
          python3 bin/audit/ryu_super_partitions.py --super /tmp/ryu-super.img --json /tmp/ryu-control/partition-info.json --names /tmp/ryu-control/partitions.txt
          df -h /tmp

      - name: Collect selected APK/JAR, inventory all apps
        shell: bash
        run: |
          set -euo pipefail
          for part in system system_ext product mi_ext vendor odm; do
            choice=''
            if grep -Fxq "$part"_a /tmp/ryu-control/partitions.txt; then choice="$part"_a;
            elif grep -Fxq "$part" /tmp/ryu-control/partitions.txt; then choice="$part"; fi
            if [ -z "$choice" ]; then echo "No $part logical partition"; continue; fi
            echo "::group::Extract $choice"
            rm -rf /tmp/ryu-parts /tmp/ryu-part-fs
            mkdir -p /tmp/ryu-parts /tmp/ryu-part-fs
            python3 bin/lpunpack.py -p "$choice" /tmp/ryu-super.img /tmp/ryu-parts
            img="/tmp/ryu-parts/$choice.img"
            test -s "$img"
            if file -b "$img" | grep -qi 'erofs'; then
              fsck.erofs --extract=/tmp/ryu-part-fs "$img"
            elif file -b "$img" | grep -Eqi 'ext[234] filesystem'; then
              for folder in app priv-app framework system/app system/priv-app system/framework; do
                debugfs -R "rdump /$folder /tmp/ryu-part-fs" "$img" >/dev/null 2>&1 || true
              done
            else
              echo "::error::Unsupported filesystem in $choice"
              exit 1
            fi
            python3 bin/audit/collect_ryu_control_apps.py --root /tmp/ryu-part-fs --partition "$part" --output /tmp/ryu-control
            rm -rf /tmp/ryu-parts /tmp/ryu-part-fs
            df -h /tmp
            echo '::endgroup::'
          done
          python3 bin/audit/collect_ryu_control_apps.py --output /tmp/ryu-control --finalize
          {
            echo '### Extracted RYUOS APK / JAR files'
            echo ''
            echo 'ROM: RYUOS HAOTIAN 3.0.309; read-only; SHA256-verified'
            echo ''
            echo 'Upload both artifact ZIPs: RYUOS-REA-ChatGPT-Part-1 and RYUOS-REA-ChatGPT-Part-2'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/ryu-super.img

      - name: Stage and verify exactly 2 ChatGPT-sized ZIP payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/pack_ryu_chatgpt.py \
            --source /tmp/ryu-control --out /tmp/ryu-chatgpt
          test -f /tmp/ryu-chatgpt/part-1/part-selection.json
          test -f /tmp/ryu-chatgpt/part-2/part-selection.json

      - name: Upload first ChatGPT-ready ZIP (under 512 MB)
        uses: actions/upload-artifact@v4
        with:
          name: RYUOS-REA-ChatGPT-Part-1
          path: /tmp/ryu-chatgpt/part-1/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload second ChatGPT-ready ZIP (under 512 MB)
        uses: actions/upload-artifact@v4
        with:
          name: RYUOS-REA-ChatGPT-Part-2
          path: /tmp/ryu-chatgpt/part-2/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
