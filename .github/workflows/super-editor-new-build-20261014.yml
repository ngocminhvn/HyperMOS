name: Super IMG Editor - New Build 2026-10-14

# Fresh build: only Kashi OS3 mods; no legacy local system APK bundle.
# Validate HAOTIAN from original vendor EROFS before root patch; no build.prop rewrites.
# SourceForge mirror selection does not use expiring signed ts/r parameters.
# Only a modification to this exact launcher file triggers a push build.
on:
  push:
    branches:
      - super-img-editor
    paths:
      - '.github/workflows/super-editor-new-build-20261014.yml'

permissions:
  contents: read

jobs:
  new-build:
    uses: ngocminhvn/HyperMOS/.github/workflows/super-editor.yml@super-img-editor
    with:
      input_url: 'https://downloads.sourceforge.net/project/projectzk/ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip?use_mirror=onboardcloud'
      root_mode: root
      upload_method: drive
    secrets: inherit
