name: Stock ROM Identity Audit

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Stock OTA URL'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip'

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner space
        shell: bash
        run: |
          set -euo pipefail
          docker rmi $(docker images -q) >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /opt/ghc || true
          sudo apt-get clean
          df -h /

      - name: Checkout stock audit branch
        uses: actions/checkout@v4
        with:
          ref: stock-rom-audit
          lfs: true

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 unzip erofs-utils python3 p7zip-full android-sdk-libsparse-utils
          chmod +x tools/stock_rom_audit.sh
          chmod +x bin/magiskboot bin/Linux/x86_64/* 2>/dev/null || true

      - name: Audit stock ROM
        shell: bash
        run: |
          set -euo pipefail
          bash tools/stock_rom_audit.sh "${{ inputs.input_url }}"

      - name: Upload stock identity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-rom-identity-audit
          path: stock-audit/report
          if-no-files-found: error
          retention-days: 14
