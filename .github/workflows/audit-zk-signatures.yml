name: ZKOS 304 309 PowerKeeper Signing Proof
on:
  workflow_dispatch:
  push:
    branches: [test-ryu-performance-haotian]
    paths: ['.github/workflows/audit-zk-signatures.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DRIVE_ID: '15tzXbZvcSwP23bnbeGlMjT9Eh4KOD275'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Tools and workspace
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends erofs-utils e2fsprogs unzip python3-venv
          python3 -m venv /tmp/zk-env
          /tmp/zk-env/bin/pip -q install gdown==5.2.0
          python3 -m py_compile bin/audit/dex_signature_inspect.py
          mkdir -p reports/zk-signatures
          df -h /tmp
      - name: Download Google Drive ZIP of both ZKOS releases
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            /tmp/zk-env/bin/gdown "https://drive.google.com/uc?id=$DRIVE_ID" \
              -O /tmp/zk-haotian.zip --continue --fuzzy && break
            sleep 20
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('/tmp/zk-haotian.zip')
          assert p.stat().st_size==16515592696, 'Drive ZIP size mismatch'
          with ZipFile(p) as z:
              names=[x.filename for x in z.infolist() if x.filename.endswith('/images/super.img')]
          for v in ['3.0.309.0','3.0.304.0']:
              assert len([x for x in names if 'OS'+v+'.' in x])==1, (v,names)
          Path('reports/zk-signatures/super-images.txt').write_text('\n'.join(names)+'\n')
          print(names,flush=True)
          PY
      - name: Extract each ZKOS PowerKeeper and framework read-only
        shell: bash
        run: |
          set -euo pipefail
          for version in 3.0.309.0 3.0.304.0; do
            echo "::group::ZKOS $version"
            export VERSION="$version"
            mkdir -p "reports/zk-signatures/$version" /tmp/zk-selected
            rm -f /tmp/zk-super.img
            python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os,shutil
          v=os.environ['VERSION']
          with ZipFile('/tmp/zk-haotian.zip') as z:
              selected=[x for x in z.infolist() if x.filename.endswith('/images/super.img') and 'OS'+v+'.' in x.filename]
              assert len(selected)==1
              item=selected[0]
              assert shutil.disk_usage('/tmp').free > item.file_size + 2147483648, 'Insufficient disk for super'
              with z.open(item) as src, open('/tmp/zk-super.img','wb') as dst:
                  shutil.copyfileobj(src,dst,length=16*1024*1024)
              print('Extracted:',item.filename,flush=True)
          PY
            if [[ "$(od -An -tx4 -N4 /tmp/zk-super.img | tr -d ' \n')" == ed26ff3a ]]; then
              simg2img /tmp/zk-super.img /tmp/zk-super.raw
              mv /tmp/zk-super.raw /tmp/zk-super.img
            fi
            python3 bin/audit/ryu_super_partitions.py --super /tmp/zk-super.img \
              --json "reports/zk-signatures/$version/partitions.json" \
              --names "/tmp/zk-$version-partition-names.txt"
            for part in system_ext system; do
              rm -rf /tmp/zk-part /tmp/zk-fs
              mkdir -p /tmp/zk-part /tmp/zk-fs
              name="$part"
              if grep -Fxq "$part"_a "/tmp/zk-$version-partition-names.txt"; then
                name="$part"_a
              elif ! grep -Fxq "$part" "/tmp/zk-$version-partition-names.txt"; then
                echo "No $part partition"
                continue
              fi
              python3 bin/lpunpack.py -p "$name" /tmp/zk-super.img /tmp/zk-part
              img=$(find /tmp/zk-part -maxdepth 1 -type f -name '*.img' -print -quit)
              test -s "$img"
              if file -b "$img" | grep -qi erofs; then
                fsck.erofs --extract=/tmp/zk-fs "$img"
              elif file -b "$img" | grep -Eqi 'ext[234] filesystem'; then
                for sub in /app /priv-app /framework /system; do
                  debugfs -R "rdump $sub /tmp/zk-fs" "$img" >/dev/null 2>&1 || true
                done
              else
                echo "::error::Unsupported partition FS in $name"; exit 1
              fi
              if [[ "$part" == system_ext ]]; then
                x=$(find /tmp/zk-fs -type f -name PowerKeeper.apk -print -quit)
                test -s "$x"
                cp "$x" "/tmp/zk-selected/$version-PowerKeeper.apk"
              else
                x=$(find /tmp/zk-fs -type f -name framework.jar -print -quit)
                test -s "$x"
                cp "$x" "/tmp/zk-selected/$version-framework.jar"
              fi
            done
            mkdir -p "reports/zk-signatures/$version"
            out="reports/zk-signatures/$version"
            apk="/tmp/zk-selected/$version-PowerKeeper.apk"
            framework="/tmp/zk-selected/$version-framework.jar"
            sha256sum "$apk" "$framework" > "$out/SHA256SUMS.txt"
            unzip -tq "$apk" > "$out/zip-validation.txt"
            if unzip -Z -1 "$apk" | grep -Fxq META-INF/CERT.RSA; then
              unzip -p "$apk" META-INF/CERT.RSA > /tmp/zk-cert.rsa
              openssl pkcs7 -inform DER -in /tmp/zk-cert.rsa -print_certs \
                | openssl x509 -noout -subject -issuer -fingerprint -sha256 \
                > "$out/v1-certificate.txt" || true
            else
              echo 'No META-INF/CERT.RSA' > "$out/v1-certificate.txt"
            fi
            if jarsigner -verify -verbose "$apk" > "$out/jarsigner.txt" 2>&1; then
              echo 'v1_verified=true' > "$out/signing-summary.txt"
            else
              echo 'v1_verified=false' > "$out/signing-summary.txt"
            fi
            if java -jar bin/apktool/apksigner.jar verify --verbose --print-certs \
                --min-sdk-version 36 "$apk" > "$out/apksigner-android16.txt" 2>&1; then
              echo 'android16_verified=true' >> "$out/signing-summary.txt"
            else
              echo 'android16_verified=false' >> "$out/signing-summary.txt"
            fi
            python3 - "$apk" "$out" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          with (Path(sys.argv[2])/'signing-summary.txt').open('a') as out:
              out.write('apk_v2_v3_block_present='+str(b'APK Sig Block 42' in p.read_bytes())+'\n')
          PY
            python3 bin/audit/dex_signature_inspect.py \
              "$framework" "$out/framework-signature-methods.json" > "$out/framework-methods.log"
            echo "::endgroup::"
          done
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZKOS-304-309-PowerKeeper-Signing-Evidence
          path: reports/zk-signatures/
          retention-days: 14
          if-no-files-found: warn
