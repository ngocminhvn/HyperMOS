name: Audit RYUOS HAOTIAN Boot Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - test-ryu-performance-haotian
    paths:
      - .github/workflows/ryu-boot-metadata-audit.yml

permissions:
  contents: read

concurrency:
  group: ryu-boot-metadata-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      RYU_ROM_URL: https://downloads.sourceforge.net/project/projectzk/ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip
      RYU_SHA256: 42dc542c9024c478e6b45af8e6fef6ba133176fe8201a14cf59496954516ba28
    steps:
      - name: Reclaim disk space and check capacity
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift || true
          mkdir -p /tmp/ryu-audit
          df -h /tmp

      - name: Download original RYUOS HAOTIAN release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 15 \
            --retry-all-errors --connect-timeout 30 \
            --speed-time 180 --speed-limit 1024 \
            --output /tmp/ryu-rom.zip "$RYU_ROM_URL"
          echo "$RYU_SHA256  /tmp/ryu-rom.zip" | sha256sum --check --status
          echo "Source archive SHA-256 verified."
          ls -lh /tmp/ryu-rom.zip

      - name: Inventory archive and inspect boot image headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import struct
          import zipfile

          source = Path('/tmp/ryu-rom.zip')
          output = Path('/tmp/ryu-audit')
          output.mkdir(parents=True, exist_ok=True)
          relevant = {
              'boot.img', 'init_boot.img', 'vendor_boot.img',
              'recovery.img', 'dtbo.img', 'vbmeta.img',
              'vbmeta_system.img', 'vbmeta_vendor.img',
          }
          max_image_size = 512 * 1024 * 1024
          records = []
          listing = ['path\tsize_bytes\tcompressed_bytes\tcrc32']
          with zipfile.ZipFile(source) as archive:
              bad_member = archive.testzip() if len(archive.infolist()) < 60 else None
              if bad_member:
                  raise RuntimeError('Corrupt ZIP member: ' + bad_member)
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  listing.append(
                      f'{item.filename}\t{item.file_size}\t'
                      f'{item.compress_size}\t{item.CRC:08x}'
                  )
                  path_parts = item.filename.split('/')
                  base = path_parts[-1]
                  if base not in relevant:
                      continue
                  if any(part in ('', '.', '..') for part in path_parts):
                      raise RuntimeError('Unsafe path in archive: ' + item.filename)
                  if item.file_size > max_image_size:
                      records.append({
                          'path': item.filename,
                          'size_bytes': item.file_size,
                          'status': 'skipped_size_limit',
                      })
                      continue
                  digest = hashlib.sha256()
                  first = bytearray()
                  total = 0
                  with archive.open(item, 'r') as inp:
                      while True:
                          chunk = inp.read(4 * 1024 * 1024)
                          if not chunk:
                              break
                          digest.update(chunk)
                          if len(first) < 256:
                              first.extend(chunk[:256 - len(first)])
                          total += len(chunk)
                  if total != item.file_size:
                      raise RuntimeError('Unexpected image length: ' + item.filename)
                  header = {'type': 'unknown'}
                  if first.startswith(b'AVB0') and len(first) >= 256:
                      flags = struct.unpack_from('>I', first, 120)[0]
                      header = {
                          'type': 'avb_vbmeta',
                          'required_libavb_major': struct.unpack_from('>I', first, 4)[0],
                          'required_libavb_minor': struct.unpack_from('>I', first, 8)[0],
                          'algorithm_type': struct.unpack_from('>I', first, 28)[0],
                          'rollback_index': struct.unpack_from('>Q', first, 112)[0],
                          'rollback_index_location': struct.unpack_from('>I', first, 124)[0],
                          'flags': flags,
                          'hashtree_disabled_flag': bool(flags & 1),
                          'verification_disabled_flag': bool(flags & 2),
                      }
                  elif first.startswith(b'ANDROID!'):
                      header = {'type': 'android_boot_image'}
                  elif first.startswith(b'VNDRBOOT'):
                      header = {'type': 'android_vendor_boot_image'}
                  records.append({
                      'path': item.filename,
                      'size_bytes': total,
                      'sha256': digest.hexdigest(),
                      'status': 'inspected',
                      'header': header,
                  })

          (output / 'archive-members.tsv').write_text(
              '\n'.join(listing) + '\n', encoding='utf-8'
          )
          manifest = {
              'source_filename': 'RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip',
              'source_sha256': os.environ['RYU_SHA256'],
              'mode': 'read_only_boot_metadata_audit',
              'images': records,
          }
          (output / 'boot-inventory.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          lines = [
              '# RYUOS HAOTIAN boot metadata audit',
              '',
              'Source archive SHA-256: ' + os.environ['RYU_SHA256'],
              '',
              'This read-only audit inventories ROM ZIP members and inspects '
              'boot-image headers. It does not patch, flash, decompile or '
              'reproduce bootloader status spoofing.',
              '',
              '| Image | Size (MiB) | Header | SHA-256 / status |',
              '|---|---:|---|---|',
          ]
          for record in records:
              header = record.get('header', {}).get('type', 'n/a')
              value = record.get('sha256', record['status'])
              lines.append(
                  f"| {record['path']} | {record['size_bytes'] / 1048576:.1f} "
                  f"| {header} | {value} |"
              )
          if not records:
              lines.append('| No standalone boot images found | - | - | - |')
          lines.extend([
              '',
              'AVB flags are values from stored image headers; they do not '
              'prove the device accepted those images or establish runtime '
              'bootloader lock state.',
              '',
              'Files: boot-inventory.json and archive-members.tsv.',
          ])
          (output / 'README.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          print('\n'.join(lines))
          PY
          cat /tmp/ryu-audit/README.md >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/ryu-rom.zip
          df -h /tmp

      - name: Upload RYU boot metadata report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RYUOS-HAOTIAN-Boot-Metadata-Audit
          path: /tmp/ryu-audit/
          retention-days: 14
          if-no-files-found: error
