name: Extract RYU-EU Updater Installer Toolbox Thermal

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'RYU-EU fastboot ROM ZIP on ProjectRYU SourceForge'
        required: true
        type: string
        default: 'https://sourceforge.net/projects/projectzk/files/ProjectRYU/RYU-EU/RYUOS3/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_EU261003.zip/download#'

permissions:
  contents: read

jobs:
  extract:
    name: Extract 3 original APKs, inspect Toolbox thermal, package ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK: /tmp/hypermos-ryu-thermal-${{ github.run_id }}
      ROM_URL: ${{ inputs.rom_url }}
    steps:
      - name: Checkout extraction scripts
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Validate RYU-EU SourceForge URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/output"
          python3 - <<'PY'
          import os
          from bin.dump.sourceforge_download import normalize
          url = os.environ["ROM_URL"].strip()
          source = normalize(url)
          if source is None or len(url) > 4096:
              raise SystemExit("Expected a SourceForge RYU-EU ZIP URL")
          canonical, project, relative = source
          if project.lower() != "projectzk" or not relative.lower().startswith("projectryu/ryu-eu/"):
              raise SystemExit("Only ProjectRYU RYU-EU ROM is accepted")
          if not relative.lower().endswith(".zip"):
              raise SystemExit("Expected a RYU-EU ZIP")
          print("[SOURCE]", canonical)
          PY

      - name: Free disk space and install read-only tools
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl unzip android-sdk-libsparse-utils \
            e2fsprogs erofs-utils aapt default-jre-headless
          command -v aapt
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          java -jar bin/apktool/apktool.jar --version
          python3 -m py_compile \
            bin/audit/extract_ryu_eu_toolbox.py \
            bin/audit/audit_xiaomi_eu_apps.py \
            bin/audit/ryu_mirror_plan.py \
            bin/dump/sourceforge_download.py \
            bin/lpunpack.py
          df -h /

      - name: Benchmark SourceForge mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/ryu_mirror_plan.py \
            --url "$ROM_URL" \
            --output "$WORK/output/mirror-plan.json"

      - name: Download RYU-EU original ROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/dump/sourceforge_download.py \
            --url "$ROM_URL" \
            --output "$WORK/ryu-eu-original.zip" \
            --report "$WORK/output/mirror-report.json" \
            --mirror-plan "$WORK/output/mirror-plan.json" \
            --parallel-mirrors 3 \
            --connections 16 \
            --attempt-timeout-seconds 1200 \
            --max-mirror-attempts 6
          test -s "$WORK/ryu-eu-original.zip"
          df -h /

      - name: Extract APK by manifest and audit Toolbox thermal
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/extract_ryu_eu_toolbox.py \
            "$WORK/ryu-eu-original.zip" "$WORK" "bin/lpunpack.py"
          test -s "$WORK/output/ryu-eu-updater-installer-toolbox-thermal.zip"
          test -s "$WORK/output/manifest.json"
          test -s "$WORK/output/report.md"
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          archive = Path(os.environ["WORK"]) / "output/ryu-eu-updater-installer-toolbox-thermal.zip"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "Corrupt ZIP member"
              names = set(z.namelist())
              assert {"manifest.json", "report.md", "SHA256SUMS.txt"} <= names
              assert any(p.startswith("apks/") for p in names), "No APKs included"
              print("[ZIP VERIFIED]", len(names), "members")
          PY
          {
            echo "## RYU-EU APK and thermal extraction"
            echo ""
            head -n 100 "$WORK/output/report.md"
            echo ""
            echo "Full results, original files, and thermal analysis are inside the ZIP artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "## RYU-EU Toolbox extraction error"
            echo "Inspect the failed step and any partial artifact."
            if [ -s "$WORK/output/report.md" ]; then
              head -n 100 "$WORK/output/report.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP, manifest, thermal report and mirror diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryu-eu-updater-installer-toolbox-thermal-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/output/ryu-eu-updater-installer-toolbox-thermal.zip
            ${{ env.WORK }}/output/manifest.json
            ${{ env.WORK }}/output/report.md
            ${{ env.WORK }}/output/SHA256SUMS.txt
            ${{ env.WORK }}/output/mirror-plan.json
            ${{ env.WORK }}/output/mirror-report.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
