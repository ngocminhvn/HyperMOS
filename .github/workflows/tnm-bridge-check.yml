name: TNM Bridge Contract

on:
  push:
    paths:
      - 'bin/modfile/UpdateFile/TNM/**'
      - '.github/workflows/tnm-bridge-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify ROM bridge syntax and install contract
        shell: bash
        run: |
          set -euo pipefail
          sh -n bin/modfile/UpdateFile/TNM/tnm-bridge.sh
          bash -n bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'BACKEND=/data/adb/tnm/bin/tnmctl' bin/modfile/UpdateFile/TNM/tnm-bridge.sh
          grep -Fq 'install -m 0755 "$src_bridge" "$bridge_dst"' bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'exec "$BACKEND" "$@"' bin/modfile/UpdateFile/TNM/tnm-bridge.sh
          echo 'TNM ROM bridge static contract: PASS'
