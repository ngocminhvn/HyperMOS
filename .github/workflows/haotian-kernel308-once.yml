name: "HAOTIAN .308 kernel lab (one-shot)"
on:
  workflow_dispatch:
    inputs:
      remove_workflow_on_success:
        description: "Delete workflow after artifact upload"
        type: boolean
        required: true
        default: true
permissions:
  contents: write
concurrency:
  group: haotian-308-kernel-lab
  cancel-in-progress: false
jobs:
  extract-and-mod:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Extract matching .308 images directly from Recovery OTA payload.bin
        env:
          OTA_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/haotian-308-result"
          mkdir -p "$out/stock"
          printf '%s\n' "$OTA_URL" > "$out/stock/source-ota-url.txt"

          # Read 4 bytes only and fail fast if the OTA host doesn't offer HTTP ranges.
          # Without HTTP ranges a large OTA could exhaust the runner's disk/traffic.
          python3 - <<'PY'
          import os
          from urllib.request import Request, urlopen
          u = os.environ['OTA_URL']
          req = Request(u, headers={'Range': 'bytes=0-3', 'User-Agent': 'HyperMOS-OTA-Kernel-Lab/1.0'})
          with urlopen(req, timeout=45) as response:
              data = response.read(4)
              status = response.status
              cr = response.headers.get('Content-Range', '')
          if status != 206 or not cr.startswith('bytes 0-3/'):
              raise SystemExit(f"HTTP byte ranges unavailable (status={status}, Content-Range={cr!r})")
          if data != b'PK\\x03\\x04':
              raise SystemExit(f"URL does not begin with ZIP magic: {data!r}")
          print("Recovery OTA ZIP detected; HTTP Range supported")
          PY

          # This Python CLI supports direct HTTP-range extraction of specific
          # partitions inside a remote full-OTA payload.bin.
          python3 -m venv "$RUNNER_TEMP/payload-venv"
          "$RUNNER_TEMP/payload-venv/bin/pip" install --disable-pip-version-check android-payload-dumper
          dumper="$RUNNER_TEMP/payload-venv/bin/payload-dumper"
          "$dumper" "$OTA_URL" -l --json > "$out/stock/payload-partitions.json"
          python3 - "$out/stock/payload-partitions.json" <<'PY'
          import pathlib, sys
          t = pathlib.Path(sys.argv[1]).read_text()
          if not ('boot' in t and 'vendor_boot' in t):
              raise SystemExit('Full OTA is missing boot or vendor_boot partitions')
          PY
          "$dumper" "$OTA_URL" -p boot vendor_boot -o "$out/stock" -j 4
          for image in boot vendor_boot; do
            test -s "$out/stock/$image.img" || {
              echo "::error::Missing extracted $image.img"; exit 1;
            }
          done
          (cd "$out/stock" && sha256sum boot.img vendor_boot.img > image-sha256.txt)
          echo "Source OTA: $OTA_URL"
      - name: Extract kernel binary from stock boot image
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/haotian-308-result"
          git clone -q --depth=1 -b android-16.0.0_r1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/aosp-mkbootimg"
          mkdir -p "$out/unpacked"
          python3 "$RUNNER_TEMP/aosp-mkbootimg/unpack_bootimg.py" \
            --boot_img "$out/stock/boot.img" --out "$out/unpacked" \
            > "$out/stock/boot-metadata.txt"
          test -s "$out/unpacked/kernel"
          (cd "$out/unpacked" && sha256sum kernel > kernel-sha256.txt)

      - name: Create conservative kernel-source patch and runtime modes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/haotian-308-result"
          mkdir -p "$out/source-patch" "$out/runtime"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/dada-v-oss/kernel/workqueue.c \
            -o "$RUNNER_TEMP/workqueue.c"
          python3 - "$RUNNER_TEMP/workqueue.c" "$out/source-patch/0001-efficient-workqueues.patch" <<'PY'
          import difflib, pathlib, sys
          original = pathlib.Path(sys.argv[1]).read_text()
          old = "static bool wq_power_efficient = IS_ENABLED(CONFIG_WQ_POWER_EFFICIENT_DEFAULT);"
          new = "static bool wq_power_efficient = true;"
          if original.count(old) != 1:
              raise SystemExit("MiCode source changed; patch not applicable")
          patched = original.replace(old, new)
          diff = difflib.unified_diff(original.splitlines(True), patched.splitlines(True),
              fromfile="a/kernel/workqueue.c", tofile="b/kernel/workqueue.c")
          pathlib.Path(sys.argv[2]).write_text(''.join(diff))
          PY
          mkdir -p "$RUNNER_TEMP/patchcheck/kernel"
          cp "$RUNNER_TEMP/workqueue.c" "$RUNNER_TEMP/patchcheck/kernel/workqueue.c"
          (cd "$RUNNER_TEMP/patchcheck" && patch --dry-run -p1 \
            < "$out/source-patch/0001-efficient-workqueues.patch")
          cat > "$out/runtime/kernel-tune.sh" <<'SH'
          #!/system/bin/sh
          # Runtime CPU max-frequency tuning for the STOCK kernel; not a flashable image.
          set -u
          mode="${1:-}"
          case "$mode" in eco) pct=92;; balanced) pct=97;; stock) pct=100;;
            *) echo "Usage: sh kernel-tune.sh eco|balanced|stock"; exit 2;; esac
          [ "$(id -u)" = 0 ] || { echo "Root required"; exit 1; }
          state="/data/local/tmp/haotian308-tune"
          mkdir -p "$state" || exit 1
          chmod 700 "$state"
          boot="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unknown)"
          oldboot="$(cat "$state/boot-id" 2>/dev/null || echo missing)"
          if [ "$boot" != "$oldboot" ]; then
            rm -f "$state"/policy*.max
            echo "$boot" > "$state/boot-id"
          fi
          count=0
          for targetfile in /sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq; do
            [ -f "$targetfile" ] || continue
            dir="${targetfile%/*}"
            policy="${dir##*/}"
            backup="$state/$policy.max"
            [ -f "$backup" ] || cat "$targetfile" > "$backup"
            ref="$(cat "$backup")"
            case "$ref" in ''|*[!0-9]*) continue;; esac
            if [ "$mode" = stock ]; then
              target="$ref"
            else
              freqs="$dir/scaling_available_frequencies"
              [ -r "$freqs" ] || { echo "$policy: no frequency table, skipped"; continue; }
              target="$(awk -v top="$ref" -v pct="$pct" '
                BEGIN { cap=int(top*pct/100); best=0 }
                { for(i=1;i<=NF;i++) if($i<=cap && $i>best) best=$i }
                END { if(best>0) print best }' "$freqs")"
              [ -n "$target" ] || continue
              min="$(cat "$dir/scaling_min_freq" 2>/dev/null || echo 0)"
              [ "$target" -ge "$min" ] 2>/dev/null || continue
            fi
            if echo "$target" > "$targetfile" 2>/dev/null; then
              echo "$policy max: $target (initial: $ref)"
              count=$((count+1))
            else
              echo "$policy: blocked by vendor policy" >&2
            fi
          done
          echo "Profile $mode; policies changed: $count"
          echo "Thermal protections untouched; reboot restores stock kernel defaults."
          SH
          chmod +x "$out/runtime/kernel-tune.sh"
          cat > "$out/README.md" <<'MD'
          # Xiaomi 15 Pro HAOTIAN OS3.0.308.0.WOBCNXM kernel lab

          This bundle is NOT a flashable custom kernel. DO NOT FLASH its boot images.

          stock/: boot and vendor_boot extracted from the user's Recovery OTA\n          using HTTP-range access and checked against payload partition hashes.
          unpacked/kernel: exact stock binary from boot.img.
          source-patch/: real source-level efficiency modification against MiCode
          dada-v-oss (Android 15), NOT compiled for current Android 16.
          runtime/kernel-tune.sh: reversible stock-kernel CPU frequency profiles;
          requires root, supports eco/balanced/stock, does not disable thermal safety.

          Xiaomi has not published a verified complete Android 16 kernel source,
          matching defconfig/device tree and KMI-compatible module set for this ROM.
          Compiling and flashing the older patch as a new kernel is unsafe until
          those compatibility issues are solved.
          MD
          python3 - "$out" <<'PY'
          import pathlib, re, hashlib, sys
          p = pathlib.Path(sys.argv[1])
          b = (p / "unpacked/kernel").read_bytes()
          m = re.search(rb"Linux version [^\x00\n]{4,200}", b)
          ver = m.group().decode('utf-8','replace') if m else "not found"
          with (p / "README.md").open("a") as f:
              f.write("\nDetected stock kernel: " + ver + "\n")
              f.write("Stock kernel SHA256: " + hashlib.sha256(b).hexdigest() + "\n")
          print("Detected stock kernel:", ver)
          PY

      - name: Upload custom profile, kernel and patch
        uses: actions/upload-artifact@v4
        with:
          name: HAOTIAN-OS3.0.308.0-kernel-lab
          path: ${{ runner.temp }}/haotian-308-result/
          retention-days: 14
          compression-level: 1
          if-no-files-found: error

      - name: Remove temporary dependencies and extraction files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/payload-venv" "$RUNNER_TEMP/aosp-mkbootimg" \
            "$RUNNER_TEMP/patchcheck" "$RUNNER_TEMP/workqueue.c"

      - name: Self-delete one-time workflow only after successful upload
        if: ${{ success() && inputs.remove_workflow_on_success }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=".github/workflows/haotian-kernel308-once.yml"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$workflow?ref=$GITHUB_REF_NAME" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$workflow" \
            -f message="chore: remove completed HAOTIAN one-shot kernel workflow" \
            -f sha="$sha" -f branch="$GITHUB_REF_NAME"
          echo "One-time workflow deleted from $GITHUB_REF_NAME"
