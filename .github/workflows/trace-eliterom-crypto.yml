name: Trace EliteRom installer crypto (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trace-eliterom-crypto.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          persist-credentials: false

      - name: Check static ELF parser against synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/dump/trace_eliterom_crypto.py bin/dump/inspect_eliterom_loader.py
          python3 -m unittest discover -s bin/dump -p 'test_trace_eliterom_crypto.py' -v
          python3 -m unittest discover -s bin/dump -p 'test_inspect_eliterom_loader.py' -v

      - name: Download existing EliteRom installer artifact (not 7.5 GiB ROM)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eliterom-audit"
          gh run download 38856269819 \
            --repo "$GITHUB_REPOSITORY" \
            --name EliteRomLite-HAOTIAN-installer-analysis \
            --dir "$RUNNER_TEMP/eliterom-audit"
          test -s "$RUNNER_TEMP/eliterom-audit/installer/linux_mac_fastboot_install_or_update.sh"

      - name: Verify source and statically inspect OpenSSL call linkages
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/eliterom-audit/installer/linux_mac_fastboot_install_or_update.sh"
          expected=1d5f605b89f04716eb1dbcb716e2e12dd3851693e058bc5e4aaa3dbe553548bc
          actual="$(sha256sum "$installer" | cut -d' ' -f1)"
          test "$expected" = "$actual" || { echo "::error::Unexpected installer hash"; exit 1; }
          python3 bin/dump/trace_eliterom_crypto.py \
            --installer "$installer" \
            --output "$RUNNER_TEMP/eliterom-crypto-trace"
          cat "$RUNNER_TEMP/eliterom-crypto-trace/crypto-trace.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze loader structure and installer capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/dump/inspect_eliterom_loader.py \
            --linux "$RUNNER_TEMP/eliterom-audit/installer/linux_mac_fastboot_install_or_update.sh" \
            --windows "$RUNNER_TEMP/eliterom-audit/installer/windows_fastboot_install_or_update.exe" \
            --output "$RUNNER_TEMP/eliterom-crypto-trace"
          cat "$RUNNER_TEMP/eliterom-crypto-trace/loader-analysis.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static crypto trace and loader analysis
        uses: actions/upload-artifact@v4
        with:
          name: EliteRomLite-HAOTIAN-crypto-trace
          path: |
            ${{ runner.temp }}/eliterom-crypto-trace/crypto-trace.json
            ${{ runner.temp }}/eliterom-crypto-trace/crypto-trace.md
            ${{ runner.temp }}/eliterom-crypto-trace/loader-analysis.json
            ${{ runner.temp }}/eliterom-crypto-trace/loader-analysis.md
          if-no-files-found: error
          retention-days: 7
