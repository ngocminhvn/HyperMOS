name: ZK donor to JSON (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zk-json-consolidate-once.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Derive exact ZK304 Smali methods from preserved donor
        shell: bash
        run: |
          set -euo pipefail
          DONOR=e3efdf7a42cfa65cc17a4b9250e498b898cb7bf7
          D=bin/package/NOTIFICATION_FIX/A16/EU
          mkdir -p /tmp/zk-donor/raw /tmp/zk-donor/services /tmp/zk-donor/power
          git show "$DONOR:$D/ZK304/zk304-miui-services.jar.zst" >/tmp/zk-donor/raw/services.zst
          git show "$DONOR:$D/ZK304/zk304-powerkeeper.dex.zst" >/tmp/zk-donor/raw/power.zst
          zstd -q -d -f /tmp/zk-donor/raw/services.zst -o /tmp/zk-donor/raw/miui-services.jar
          zstd -q -d -f /tmp/zk-donor/raw/power.zst -o /tmp/zk-donor/raw/classes.dex
          echo '1c29f7a2be1853d973d4998c2598e3baf5fd6cd5861a281deec321bd4caeda8e  /tmp/zk-donor/raw/miui-services.jar' | sha256sum -c -
          echo '439ed4b5fe3dfaa8d0c539bdbc90c54b049e9cf5143fe5664aee1e1becd6b2bf  /tmp/zk-donor/raw/classes.dex' | sha256sum -c -
          unzip -q /tmp/zk-donor/raw/miui-services.jar 'classes*.dex' -d /tmp/zk-donor/services
          for dex in /tmp/zk-donor/services/classes*.dex; do
            java -jar bin/apktool/baksmaliv2.jar d --api 36 "$dex" -o "/tmp/zk-donor/services/$(basename "$dex" .dex)"
          done
          java -jar bin/apktool/baksmaliv2.jar d --api 36 /tmp/zk-donor/raw/classes.dex -o /tmp/zk-donor/power/smali
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('/tmp/zk-donor')
          services={
            "BroadcastQueueModernStubImpl": ["isInternationalSpecialAction","updateBlockBroadcast","checkApplicationAutoStart","checkReceiverAppDealBroadcast"],
            "GreezeManagerService":["updateDynamicIsLandInfo","freezeAction","freezeUids","isAllowBroadcast"],
            "InternationalPolicyManager":["updateDeviceIdleApps","getImportantApps"],
            "DeviceIdleControllerStubImpl":["<clinit>","isLowPowerDozeEnable"],
            "NotificationManagerServiceImpl":["<clinit>","checkFullScreenIntent"],
            "ProcessManagerService":["notifyProcessStarted","isForceStopEnable"],
            "ProcessPolicy":["updateContentCatcherWhitelist","systemReady"]
          }
          powers=["GmsObserver","DeviceIdleController","DeviceIdleController$1","DeviceIdleController$2","ActiveStateController","KillProcessController"]
          rx=re.compile(r"(?ms)^\.method[^\n]*\n.*?^\.end method[ \t]*$")
          owner_rx=re.compile(r"(?m)^\.class[^\n]*\s+(L[^;\s]+;)[ \t]*$")
          result={"format":"hypermos_zk304_method_source_v1","source":{
             "rom":"ZKOS_HAOTIAN_OS3.0.304.0.WOBCNXM_EU260623",
             "workflow_run_id":39751679932,
             "miui_services_sha256":"1c29f7a2be1853d973d4998c2598e3baf5fd6cd5861a281deec321bd4caeda8e",
             "powerkeeper_apk_sha256":"1407fc5a5595b1acf011289a65cb8e4055831c1be2b70e56a18ee7130ab50a47"
             },"note":"Audited original ZK304 Smali method bodies. EU ABI checked during build, reference file is not executable.","donors":{}}
          for family,selection in (("services",services),("power",powers)):
            result["donors"][family]={}
            for name in selection:
              found=list((src/family).rglob(name+".smali"))
              if len(found)!=1:raise RuntimeError(f"{family}.{name}: class count {len(found)}")
              body=found[0].read_text(encoding="utf-8")
              owner=owner_rx.search(body)
              if not owner:raise RuntimeError("No class descriptor for "+name)
              hits={}
              for m in rx.finditer(body):
                signature=m.group().splitlines()[0].split()[-1]
                if family=="power" or signature.split("(",1)[0] in selection[name]:
                  if signature in hits: raise RuntimeError("Duplicate "+signature)
                  hits[signature]=m.group()
              expected=len(selection[name]) if family=="services" else None
              if expected is not None and len(hits)!=expected:
                raise RuntimeError(f"{name}: {len(hits)} methods, expected {expected}")
              result["donors"][family][owner.group(1)]={
                "path":found[0].name,
                "fields":[line for line in body.splitlines() if line.startswith(".field ")],
                "methods":hits
              }
          total=sum(len(c["methods"]) for fam in result["donors"].values() for c in fam.values())
          if total!=177:raise RuntimeError("Reference method count unexpected: "+str(total))
          output=Path("bin/package/NOTIFICATION_FIX/A16/EU/zk_methods.json")
          output.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(f"OK: {total} ZK304 donor methods, {output.stat().st_size} bytes")
          PY
          python3 -m py_compile "$D/zk_patch.py"
          python3 "$D/zk_patch.py" --check-reference-only
      - name: Publish source JSON and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zk-json-consolidate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- bin/package/NOTIFICATION_FIX/A16/EU/zk_methods.json .github/workflows/zk-json-consolidate-once.yml
          git diff --cached --stat
          git commit -m "refactor(eu): preserve 177 original ZK304 Smali methods as JSON, no zst"
          git push origin HEAD:main
