name: RYU A16 Framework Method Inspection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ryu-a16-inspect-methods.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: RYUOS_HAOTIAN_3_framework_JARs
          run-id: 37912511684
          repository: ngocminhvn/HyperMOS
          github-token: ${{ github.token }}
          path: /tmp/jar-input
      - name: Extract RYU smali methods for safe audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/jar-inspect
          cd /tmp/jar-inspect
          unzip -j /tmp/jar-input/miui-services.jar 'classes*.dex'
          for dex in classes*.dex; do
            n="${dex%.dex}"
            [[ "$n" == "classes" ]] && name=smali || name="smali_$n"
            java -jar "$GITHUB_WORKSPACE/bin/apktool/baksmaliv2.jar" d --api 36 "$dex" -o "$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          base=Path("/tmp/jar-inspect")
          targets=[
            ("BroadcastQueueModernStubImpl", "checkApplicationAutoStart(", 390),
            ("BroadcastQueueModernStubImpl", "updateBlockBroadcast()", 90),
            ("ProcessSceneCleaner", "killAppForHasOtherTask(", 170),
          ]
          report=[]
          for cls,method,limit in targets:
            paths=list(base.glob(f"smali*/com/android/server/am/{cls}.smali"))
            assert len(paths)==1,(cls,paths)
            ls=paths[0].read_text().splitlines()
            idx=next(i for i,line in enumerate(ls) if line.startswith(".method ") and method in line)
            end=next(i for i in range(idx+1,len(ls)) if ls[i].strip()==".end method")
            lines=ls[idx:min(end+1,idx+limit)]
            report.append(f"==== {cls}.{method} range={idx+1}-{end+1}, printing={len(lines)} ====")
            report += [f"{idx+i+1:04d} {line}" for i,line in enumerate(lines)]
          Path("/tmp/ryu-a16-methods.txt").write_text("\n".join(report)+"\n")
          print("\n".join(report)[:28000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RYU-A16-Method-Snippets
          path: /tmp/ryu-a16-methods.txt
          retention-days: 7
