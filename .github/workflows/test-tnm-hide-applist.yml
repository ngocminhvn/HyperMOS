name: Verify TNM Hide App List

on:
  push:
    branches: [main]
    paths:
      - "bin/package/TNM/**"
      - "bin/package/patchpackage.sh"
      - ".github/workflows/test-tnm-hide-applist.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python + Smali + synthetic Android 16 hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patcher and shell syntax
        run: |
          python3 -m py_compile bin/package/TNM/patch_hide_app_list.py
          bash -n bin/package/TNM/patch.sh bin/package/patchpackage.sh
          test -s bin/apktool/smaliv2.jar
          test -s bin/apktool/baksmaliv2.jar
      - name: Assemble TNM helper and instrument synthetic APM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tnm-smali/android/app
          cp bin/package/TNM/TnmHideAppList.smali /tmp/tnm-smali/android/app/
          cat > /tmp/tnm-smali/android/app/ApplicationPackageManager.smali <<'SMALI'
          .class public Landroid/app/ApplicationPackageManager;
          .super Ljava/lang/Object;
          .field private mContext:Landroid/app/ContextImpl;

          .method public getInstalledApplicationsAsUser(Landroid/content/pm/PackageManager$ApplicationInfoFlags;I)Ljava/util/List;
              .registers 4
              const/4 v0, 0x0
              return-object v0
          .end method

          .method public getInstalledPackagesAsUser(Landroid/content/pm/PackageManager$PackageInfoFlags;I)Ljava/util/List;
              .registers 4
              const/4 v0, 0x0
              return-object v0
          .end method

          .method public getApplicationInfoAsUser(Ljava/lang/String;Landroid/content/pm/PackageManager$ApplicationInfoFlags;I)Landroid/content/pm/ApplicationInfo;
              .registers 5
              const/4 v0, 0x0
              return-object v0
          .end method

          .method public getPackageInfoAsUser(Ljava/lang/String;Landroid/content/pm/PackageManager$PackageInfoFlags;I)Landroid/content/pm/PackageInfo;
              .registers 5
              const/4 v0, 0x0
              return-object v0
          .end method

          .method public getPackageUidAsUser(Ljava/lang/String;Landroid/content/pm/PackageManager$PackageInfoFlags;I)I
              .registers 5
              const/4 v0, 0x0
              return v0
          .end method

          .method public getPackageGids(Ljava/lang/String;Landroid/content/pm/PackageManager$PackageInfoFlags;)[I
              .registers 4
              const/4 v0, 0x0
              return-object v0
          .end method
          SMALI
          python3 bin/package/TNM/patch_hide_app_list.py /tmp/tnm-smali/android/app/ApplicationPackageManager.smali
          java -jar bin/apktool/smaliv2.jar a -a 36 /tmp/tnm-smali -o /tmp/tnm-tested.dex
          test -s /tmp/tnm-tested.dex
          mkdir -p /tmp/tnm-disasm
          java -jar bin/apktool/baksmaliv2.jar d -a 36 /tmp/tnm-tested.dex -o /tmp/tnm-disasm
          grep -q 'TnmHideAppList;->shouldHide' /tmp/tnm-disasm/android/app/ApplicationPackageManager.smali
          grep -q 'TnmHideAppList;->filterPackageInfoList' /tmp/tnm-disasm/android/app/ApplicationPackageManager.smali
          grep -q 'projectryu_hide_applist' /tmp/tnm-disasm/android/app/TnmHideAppList.smali
