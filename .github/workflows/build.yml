name: NothingsVN Xiaomi ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Builder name'
        required: false
      builder_id:
        description: 'Builder ID'
        required: false

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean unused files and applications
        run: |
          docker rmi `docker images -q` || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/sudo apt/sources.list.d || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt -y autoremove --purge || true
          sudo apt -y autoclean || true
          sudo apt clean || true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Send start notification
        run: |
          pip install requests
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Set timezone
        run: |
          echo "Setting Vietnam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install tools
        run: |
          set -e
          set -o pipefail
          echo "[STEP] Install tools" | tee -a build_action.log
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test 2>&1 | tee -a build_action.log
          sudo apt-get update 2>&1 | tee -a build_action.log
          sudo apt purge device-tree-compiler 2>&1 | tee -a build_action.log
          sudo apt-get install -y aria2 jq rclone sshpass lz4 python-is-python3 wget python3 lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip erofs-utils unzip p7zip-full zipalign zstd bc android-sdk-libsparse-utils xmlstarlet 2>&1 | tee -a build_action.log
          sudo pip3 install ConfigObj 2>&1 | tee -a build_action.log
          sudo pip3 install telebot 2>&1 | tee -a build_action.log
          sudo pip3 install setuptools 2>&1 | tee -a build_action.log
          sudo pip3 install google-auth lz4 google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>&1 | tee -a build_action.log

      - name: Grant file permissions
        run: |
          sudo chmod 777 -R *

      - name: Build ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          set -e
          set -o pipefail
          echo "[STEP] Build ROM" | tee -a build_action.log
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" 2>&1 | tee -a build_action.log

      - name: Pack ROM
        run: |
          set -e
          set -o pipefail
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          echo "[STEP] Pack ROM" | tee -a build_action.log
          sudo bash packROM.sh 2>&1 | tee -a build_action.log

      - name: Set up Rclone
        env:
          RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
        run: |
          set -e
          set -o pipefail
          echo "[STEP] Set up Rclone" | tee -a build_action.log
          sudo -E bash uploadROM.sh setup "${{ secrets.GH_TOKEN }}" "${{ secrets.GH_REPO }}" "${{ secrets.RCLONE_TOKEN_PATH }}" 2>&1 | tee -a build_action.log          
      
      - name: Upload ROM to cloud
        env:
          RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
        run: |
          set -e
          set -o pipefail
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          echo "[STEP] Upload ROM to cloud" | tee -a build_action.log
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log

