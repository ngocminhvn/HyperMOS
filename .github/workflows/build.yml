name: HyperMOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Xiaomi 15 Pro HAOTIAN stock OS3.0.308.0 (Android 16)'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip'
      builder_id:
        description: 'Builder ID'
        required: false
      debug:
        description: 'Debug build'
        required: false
        default: false
        type: boolean
      root_mode:
        description: 'KernelSU Next root mode (latest stable; auto-detect KMI)'
        required: true
        type: choice
        default: 'root'
        options:
          - root
          - stock
      upload_method:
        description: 'Upload ROM to'
        required: true
        default: 'drive'
        type: choice
        options:
          - drive
          - pixeldrain

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Runner space
        id: diskcheck
        shell: bash
        run: |
          set -euo pipefail
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "[INFO] - Runner free space: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 60 ]; then
            echo "need_cleanup=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] - Low space: cleaning large preinstalled packages"
            docker rmi $(docker images -q) >/dev/null 2>&1 || true
            sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
            sudo apt-get -y purge azure-cli 'ghc*' 'zulu*' 'hhvm*' 'llvm*' firefox 'google*' 'dotnet*' powershell 'mysql*' 'php*' >/dev/null 2>&1 || true
            sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
            sudo apt-get clean
          else
            echo "need_cleanup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          : > build_action.log
          echo "[PHASE] - Prepare build environment"

          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test >>build_action.log 2>&1
          sudo apt-get update -qq >>build_action.log 2>&1
          sudo apt-get purge -y device-tree-compiler >>build_action.log 2>&1 || true

          if ! sudo apt-get install -y -qq \
            aria2 jq rclone sshpass lz4 python-is-python3 wget python3 xz-utils zlib1g-dev \
            gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip \
            erofs-utils unzip p7zip-full 7zip 7zip-standalone zipalign zstd bc \
            android-sdk-libsparse-utils xmlstarlet secilc binutils >>build_action.log 2>&1; then
            echo "[ERROR] - Package installation failed"
            tail -n 120 build_action.log
            exit 1
          fi

          if ! sudo pip3 install -q ConfigObj telebot setuptools requests google-auth lz4 \
            google-auth-oauthlib google-auth-httplib2 google-api-python-client fonttools pillow >>build_action.log 2>&1; then
            echo "[ERROR] - Python dependency installation failed"
            tail -n 120 build_action.log
            exit 1
          fi

          # Check the LOCK entrypoint before downloading ROM.
          bash -n bin/package/LOCK/update.sh
          # Fast-fail the full ZKOS PowerKeeper + TNM per-app hook port.
          bash -n bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh
          # Lightweight source sanity check; no version-locked DEX hashes.
          python3 - <<'PYDEX'
          from pathlib import Path
          for rel in (
              "bin/package/NOTIFICATION_FIX/A16/classes.dex",
              "bin/package/NOTIFICATION_FIX/A16/tnm-perfhook-source.dex",
          ):
              data = Path(rel).read_bytes()
              if len(data) < 112 or not data.startswith(b"dex\n") or int.from_bytes(data[32:36], "little") != len(data):
                  raise SystemExit(f"Invalid bundled DEX: {rel}")
          PYDEX
          python3 -m py_compile \
            bin/package/NOTIFICATION_FIX/A16/zk_full_powerkeeper_a16.py \
            bin/package/NOTIFICATION_FIX/A16/ryu_killprocess_a16.py \
            bin/package/NOTIFICATION_FIX/A16/powerkeeper.py \
            bin/package/NOTIFICATION_FIX/A16/preserve_powerkeeper_identity.py \
            bin/package/NOTIFICATION_FIX/A16/rebuild_powerkeeper_dex.py
          python3 bin/package/NOTIFICATION_FIX/A16/test_ryu_killprocess_a16.py

          # Thermal source is already versioned in the repository (no remote artifact).
          thermal_zip="TNM-HAOTIAN-Thermal-Configs (1).zip"
          test -s "$thermal_zip"
          thermal_ref="$RUNNER_TEMP/power-profiles"
          mkdir -p "$thermal_ref"
          unzip -oq "$thermal_zip" -d "$thermal_ref"
          test -s "$thermal_ref/manifest.json"
          echo "TNM_REF_DIR=$thermal_ref" >> "$GITHUB_ENV"

          # Validate Android 16 GMS XML and protect existing FCM exemptions.
          # Pure preflight: no Doze, PowerKeeper or notification settings changed.
          python3 bin/modfile/Universal/gmsservices16/validate-sysconfig.py

          # The Android 16 SystemUI notification-defaults patch has been retired.
          bash -n bin/package/NOTIFICATION_FIX/notificationFIX.sh

          # Fast-fail invalid font integration before unpacking the base ROM.
          python3 -m py_compile bin/modfile/UpdateFile/Fonts/font_utils.py
          bash -n bin/modfile/UpdateFile/Fonts/update.sh

          # Replace standalone font and TNM checks in the main ROM workflow.
          bash -n bin/modfile/UpdateFile/Fonts/install-emoji.sh
          test -s bin/modfile/UpdateFile/Fonts/Shared/NotoColorEmoji.ttf
          test ! -e bin/modfile/UpdateFile/Fonts/HyperOS/NotoColorEmoji.ttf
          test -s bin/modfile/UpdateFile/Fonts/HyperOS/NotoSans-VF.ttf
          test -s bin/modfile/UpdateFile/Fonts/HyperOS/OpenSans-VF.ttf
          test ! -e bin/modfile/UpdateFile/Fonts/HyperOS/SF-Pro.ttf
          # Font verification and catalog staging are offline: no downloads.
          python3 bin/modfile/UpdateFile/Fonts/font_utils.py prepare \
            bin/modfile/UpdateFile/Fonts/HyperOS "$RUNNER_TEMP/hypermos-font-preflight/sources"
          python3 bin/modfile/UpdateFile/Fonts/font_utils.py catalog \
            "$RUNNER_TEMP/hypermos-font-preflight/sources" "$RUNNER_TEMP/hypermos-font-preflight"
          test -s "$RUNNER_TEMP/hypermos-font-preflight/catalog.tsv"
          python3 - "$RUNNER_TEMP/hypermos-font-preflight/catalog.json" <<'PYFONT'
          import json
          import sys
          names = {item["title"] for item in json.load(open(sys.argv[1], encoding="utf-8"))}
          assert {"Roboto", "Noto Sans", "Open Sans"} <= names, names
          assert "SF Pro" not in names, names
          print("[FONT-CATALOG] Required fonts present; SF Pro retired")
          PYFONT
          sh -n bin/modfile/UpdateFile/TNM/tnm-frameworkctl
          sh -n bin/modfile/UpdateFile/TNM/tnm-bridge
          bash -n bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'BACKEND=/data/adb/tnm/bin/tnmctl' bin/modfile/UpdateFile/TNM/tnm-bridge
          grep -Fq 'install -m 0755 "$src_bridge" "$bridge_dst"' bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'exec "$BACKEND" "$@"' bin/modfile/UpdateFile/TNM/tnm-bridge
          echo "[OK] - Font catalog, shared emoji and TNM bridge preflight passed"
          # KernelSU Next integration: verify scripts and auto-KMI logic
          # before downloading a large stock ROM.
          bash -n bin/root/patch_init_boot.sh
          sh -n bin/root/stage_root_manager.sh
          bash -n bin/modfile/Universal/downloadapp/update.sh
          python3 -m py_compile bin/root/detect_kernel_kmi.py
          python3 bin/root/detect_kernel_kmi.py --self-test
          grep -Fq 'KernelSU-Next/KernelSU-Next' bin/root/patch_init_boot.sh
          grep -Fq 'skip competing/preinstalled root manager' bin/modfile/Universal/downloadapp/update.sh
          grep -Fq 'KernelSU-Next_v' bin/root/stage_root_manager.sh
          test -s bin/root/stage_root_manager.rc
          echo "[ROOT] KernelSU Next patch and manager staging preflight passed"



          sudo chmod -R a+rwX .
          chmod +x bin/magiskboot 2>/dev/null || true
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true

          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_id }}" || echo "[WARN] - Start notification failed"

          if [ "${{ inputs.upload_method }}" = "drive" ]; then
            echo "[INFO] - Validate Drive upload config"
            sudo -E bash uploadROM.sh setup "${{ secrets.RCLONE_TOKEN_PATH }}" 2>&1 | tee -a build_action.log
          fi

          echo "[OK] - Build environment ready"

      - name: Build ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
          ROOT_MODE: ${{ inputs.root_mode }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[PHASE] - Build ROM" | tee -a build_action.log
          # Preserve the full build log while making long phases collapsible.
          if sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" \
              "${{ inputs.builder_id }}" 2>&1 | tee -a build_action.log | awk '
                /^\[PHASE\] - [123]\/4 / {
                  if (opened) print "::endgroup::"
                  title = $0
                  sub(/^\[PHASE\] - /, "", title)
                  print "::group::" title
                  opened = 1
                }
                { print; fflush() }
                END { if (opened) print "::endgroup::" }
              '; then
            {
              echo "### Build ROM"
              echo "- ✅ 1/4 Download and inspect base ROM"
              echo "- ✅ 2/4 Extract base ROM"
              echo "- ✅ 3/4 Apply HyperMOS modifications"
              echo "- ⏳ 4/4 Repack is handled by the separate Pack ROM step"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Build ROM failed::Check the grouped download, extraction and modification logs."
            {
              echo "### Build ROM"
              echo "**Failed.** Inspect the Build ROM groups and the last log lines."
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 35 build_action.log || true
            exit 1
          fi

      - name: Patch KernelSU Next into init_boot
        if: ${{ inputs.root_mode == 'root' }}
        shell: bash
        env:
          ROOT_MODE: ${{ inputs.root_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prevent an unintended preinstalled root-manager APK.
          target="build/baserom/images/product/data-app"
          if [ -d "$target" ] && find "$target" -type f \
              \( -iname 'SukiSU*.apk' -o -iname 'KernelSU*.apk' -o -iname 'KSU*.apk' \) \
              -print -quit | grep -q .; then
            echo "::error::Root manager unexpectedly preinstalled in product/data-app"
            exit 1
          fi
          # build.sh extracts read-only partition trees with sudo.
          sudo -E env PATH="$PATH" ROOT_MODE="$ROOT_MODE" GH_TOKEN="$GH_TOKEN" \
            bash bin/root/patch_init_boot.sh 2>&1 | tee -a build_action.log

      - name: Pack ROM
        shell: bash
        run: |
          set -euo pipefail
          # Check the final LOCK staging within Pack ROM; no separate Actions step.
          echo "::group::LOCK pre-pack sanity check"
          if ! sudo -E bash bin/package/LOCK/update.sh --check 2>&1 | tee -a build_action.log; then
            echo "::endgroup::"
            echo "::error title=LOCK validation failed::Refusing to package inconsistent LOCK staging."
            exit 1
          fi
          echo "::endgroup::"
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_id }}" || true
          echo "[PHASE] - Pack ROM" | tee -a build_action.log
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log

      - name: Package and upload ROM
        shell: bash
        env:
          UPLOAD_METHOD: ${{ inputs.upload_method }}
          ROOT_MODE: ${{ inputs.root_mode }}
          DEBUG_BUILD: ${{ inputs.debug }}
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_id }}" || true

          echo "[PHASE] - Package and upload via ${UPLOAD_METHOD}" | tee -a build_action.log
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log

          if [ "$UPLOAD_METHOD" != "pixeldrain" ]; then
            exit 0
          fi

          FILE=$(cat bin/ddevice/output_file.txt 2>/dev/null || true)
          [ -n "$FILE" ] && [ -f "$FILE" ] || {
            echo "[ERROR] - ROM ZIP not found for Pixeldrain"
            exit 1
          }

          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((9 * 1024 * 1024 * 1024))

          upload_one() {
            local src="$1"
            local response id
            echo "[UPLOADING] - $(basename "$src")" >&2
            response=$(curl -fsS -u ":$PD_API_KEY" -F "file=@$src" https://pixeldrain.com/api/file)
            id=$(printf '%s' "$response" | jq -r '.id // empty')
            [ -n "$id" ] || {
              echo "[ERROR] - Pixeldrain response: $response" >&2
              return 1
            }
            printf 'https://pixeldrain.com/u/%s\n' "$id"
          }

          FIRST_URL=""
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "[INFO] - ROM exceeds 9 GiB; splitting without recompression"
            7zz a -t7z -mx=0 -v9g "${FILE}.7z" "$FILE" >/dev/null
            for part in "${FILE}.7z".*; do
              [ -e "$part" ] || continue
              url=$(upload_one "$part")
              [ -n "$FIRST_URL" ] || FIRST_URL="$url"
            done
          else
            FIRST_URL=$(upload_one "$FILE")
          fi

          if [ -n "$FIRST_URL" ]; then
            echo "NOTIFY_DOWNLOAD_URL=$FIRST_URL" >> "$GITHUB_ENV"
          fi
          echo "[OK] - Pixeldrain upload completed"

      - name: Notify result
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          NOTIFY_WORKFLOW_CONCLUSION: ${{ job.status }}
          NOTIFY_UPLOAD_METHOD: ${{ inputs.upload_method }}
          NOTIFY_ERROR_LOG: build_action.log
        run: |
          set +e
          case "$JOB_STATUS" in
            success)
              if [ -z "${NOTIFY_DOWNLOAD_URL:-}" ] && [ -n "${RCLONE_DOWNLOAD_URL:-}" ]; then
                export NOTIFY_DOWNLOAD_URL="$RCLONE_DOWNLOAD_URL"
              fi
              python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_id }}"
              ;;
            cancelled)
              export NOTIFY_ERROR_REASON="Workflow was cancelled before completion."
              python notify.py cancelled "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_id }}"
              ;;
            *)
              python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_id }}"
              ;;
          esac
          exit 0
