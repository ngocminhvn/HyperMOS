name: HyperMOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Builder name'
        required: false
      builder_id:
        description: 'Builder ID'
        required: false
      debug:
        description: 'Debug build'
        required: false
        default: false
        type: boolean
      upload_method:
        description: 'Upload ROM to'
        required: true
        default: 'drive'
        type: choice
        options:
          - drive
          - pixeldrain

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Runner space
        id: diskcheck
        shell: bash
        run: |
          set -euo pipefail
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "[INFO] - Runner free space: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 60 ]; then
            echo "need_cleanup=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] - Low space: cleaning large preinstalled packages"
            docker rmi $(docker images -q) >/dev/null 2>&1 || true
            sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
            sudo apt-get -y purge azure-cli 'ghc*' 'zulu*' 'hhvm*' 'llvm*' firefox 'google*' 'dotnet*' powershell 'mysql*' 'php*' >/dev/null 2>&1 || true
            sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
            sudo apt-get clean
          else
            echo "need_cleanup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          : > build_action.log
          echo "[PHASE] - Prepare build environment"

          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test >>build_action.log 2>&1
          sudo apt-get update -qq >>build_action.log 2>&1
          sudo apt-get purge -y device-tree-compiler >>build_action.log 2>&1 || true

          if ! sudo apt-get install -y -qq \
            aria2 jq rclone sshpass lz4 python-is-python3 wget python3 xz-utils zlib1g-dev \
            gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip \
            erofs-utils unzip p7zip-full 7zip 7zip-standalone zipalign zstd bc \
            android-sdk-libsparse-utils xmlstarlet secilc >>build_action.log 2>&1; then
            echo "[ERROR] - Package installation failed"
            tail -n 120 build_action.log
            exit 1
          fi

          if ! sudo pip3 install -q ConfigObj telebot setuptools requests google-auth lz4 \
            google-auth-oauthlib google-auth-httplib2 google-api-python-client fonttools pillow >>build_action.log 2>&1; then
            echo "[ERROR] - Python dependency installation failed"
            tail -n 120 build_action.log
            exit 1
          fi

          # The Android 16 SystemUI notification-defaults patch has been retired.
          bash -n bin/package/NOTIFICATION_FIX/notificationFIX.sh

          # Fast-fail invalid font integration before unpacking the base ROM.
          python3 -m py_compile bin/modfile/UpdateFile/Fonts/font_utils.py
          bash -n bin/modfile/UpdateFile/Fonts/update.sh

          # Replace standalone font and TNM checks in the main ROM workflow.
          bash -n bin/modfile/UpdateFile/Fonts/install-emoji.sh
          test -s bin/modfile/UpdateFile/Fonts/Shared/NotoColorEmoji.ttf
          test ! -e bin/modfile/UpdateFile/Fonts/HyperOS/NotoColorEmoji.ttf
          python3 bin/modfile/UpdateFile/Fonts/font_utils.py prepare \
            bin/modfile/UpdateFile/Fonts/HyperOS "$RUNNER_TEMP/hypermos-font-preflight/sources"
          python3 bin/modfile/UpdateFile/Fonts/font_utils.py catalog \
            "$RUNNER_TEMP/hypermos-font-preflight/sources" "$RUNNER_TEMP/hypermos-font-preflight"
          test -s "$RUNNER_TEMP/hypermos-font-preflight/catalog.tsv"
          python3 - "$RUNNER_TEMP/hypermos-font-preflight/catalog.json" <<'PYFONT'
          import json
          import sys
          names = {item["title"] for item in json.load(open(sys.argv[1], encoding="utf-8"))}
          assert {"Roboto", "Noto Sans", "Open Sans"} <= names, names
          assert "SF Pro" not in names, names
          print("[FONT-CATALOG] Required fonts present; SF Pro retired")
          PYFONT
          sh -n bin/modfile/UpdateFile/TNM/tnm-bridge
          bash -n bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'BACKEND=/data/adb/tnm/bin/tnmctl' bin/modfile/UpdateFile/TNM/tnm-bridge
          grep -Fq 'install -m 0755 "$src_bridge" "$bridge_dst"' bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'exec "$BACKEND" "$@"' bin/modfile/UpdateFile/TNM/tnm-bridge
          echo "[OK] - Font catalog, shared emoji and TNM bridge preflight passed"

          sudo chmod -R a+rwX .
          chmod +x bin/magiskboot 2>/dev/null || true
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true

          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || echo "[WARN] - Start notification failed"

          if [ "${{ inputs.upload_method }}" = "drive" ]; then
            echo "[INFO] - Validate Drive upload config"
            sudo -E bash uploadROM.sh setup "${{ secrets.RCLONE_TOKEN_PATH }}" 2>&1 | tee -a build_action.log
          fi

          echo "[OK] - Build environment ready"

      - name: Build ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[PHASE] - Build ROM" | tee -a build_action.log
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" \
            "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" 2>&1 | tee -a build_action.log

      - name: Pack ROM
        shell: bash
        run: |
          set -euo pipefail
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
          echo "[PHASE] - Pack ROM" | tee -a build_action.log
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log

      - name: Package and upload ROM
        shell: bash
        env:
          UPLOAD_METHOD: ${{ inputs.upload_method }}
          DEBUG_BUILD: ${{ inputs.debug }}
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true

          echo "[PHASE] - Package and upload via ${UPLOAD_METHOD}" | tee -a build_action.log
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log

          if [ "$UPLOAD_METHOD" != "pixeldrain" ]; then
            exit 0
          fi

          FILE=$(cat bin/ddevice/output_file.txt 2>/dev/null || true)
          [ -n "$FILE" ] && [ -f "$FILE" ] || {
            echo "[ERROR] - ROM ZIP not found for Pixeldrain"
            exit 1
          }

          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((9 * 1024 * 1024 * 1024))

          upload_one() {
            local src="$1"
            local response id
            echo "[UPLOADING] - $(basename "$src")" >&2
            response=$(curl -fsS -u ":$PD_API_KEY" -F "file=@$src" https://pixeldrain.com/api/file)
            id=$(printf '%s' "$response" | jq -r '.id // empty')
            [ -n "$id" ] || {
              echo "[ERROR] - Pixeldrain response: $response" >&2
              return 1
            }
            printf 'https://pixeldrain.com/u/%s\n' "$id"
          }

          FIRST_URL=""
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "[INFO] - ROM exceeds 9 GiB; splitting without recompression"
            7zz a -t7z -mx=0 -v9g "${FILE}.7z" "$FILE" >/dev/null
            for part in "${FILE}.7z".*; do
              [ -e "$part" ] || continue
              url=$(upload_one "$part")
              [ -n "$FIRST_URL" ] || FIRST_URL="$url"
            done
          else
            FIRST_URL=$(upload_one "$FILE")
          fi

          if [ -n "$FIRST_URL" ]; then
            echo "NOTIFY_DOWNLOAD_URL=$FIRST_URL" >> "$GITHUB_ENV"
          fi
          echo "[OK] - Pixeldrain upload completed"

      - name: Notify result
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          NOTIFY_WORKFLOW_CONCLUSION: ${{ job.status }}
          NOTIFY_UPLOAD_METHOD: ${{ inputs.upload_method }}
          NOTIFY_ERROR_LOG: build_action.log
        run: |
          set +e
          case "$JOB_STATUS" in
            success)
              if [ -z "${NOTIFY_DOWNLOAD_URL:-}" ] && [ -n "${RCLONE_DOWNLOAD_URL:-}" ]; then
                export NOTIFY_DOWNLOAD_URL="$RCLONE_DOWNLOAD_URL"
              fi
              python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
              ;;
            cancelled)
              export NOTIFY_ERROR_REASON="Workflow was cancelled before completion."
              python notify.py cancelled "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
              ;;
            *)
              python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
              ;;
          esac
          exit 0
