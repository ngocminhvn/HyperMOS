name: NothingsVN Xiaomi ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Builder name'
        required: false
      builder_id:
        description: 'Builder ID'
        required: false
      debug:
        description: 'Debug build'
        required: false
        default: false
        type: boolean
      upload_method:
        description: 'Upload ROM to'
        required: true
        default: 'drive'
        type: choice
        options:
          - drive
          - pixeldrain

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - name: Check free disk space
        id: diskcheck
        shell: bash
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free disk space: ${FREE_GB}GB"
          if [ "$FREE_GB" -lt 60 ]; then
            echo "need_cleanup=true" >> "$GITHUB_OUTPUT"
            echo "Low disk space; cleanup/maximize will run."
          else
            echo "need_cleanup=false" >> "$GITHUB_OUTPUT"
            echo "Enough disk space; skipping cleanup/maximize."
          fi

      - name: Maximize build space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean unused files and applications
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        run: |
          docker rmi `docker images -q` || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/sudo apt/sources.list.d || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt -y autoremove --purge || true
          sudo apt -y autoclean || true
          sudo apt clean || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Send start notification
        run: |
          pip install requests
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Set timezone
        run: |
          echo "Setting Vietnam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install tools
        run: |
          set -e
          set -o pipefail
          echo "[STEP] Install tools" | tee -a build_action.log
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test 2>&1 | tee -a build_action.log
          sudo apt-get update 2>&1 | tee -a build_action.log
          sudo apt purge device-tree-compiler 2>&1 | tee -a build_action.log
          sudo apt-get install -y aria2 jq rclone sshpass lz4 python-is-python3 wget python3 lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip erofs-utils unzip p7zip-full 7zip 7zip-standalone zipalign zstd bc android-sdk-libsparse-utils xmlstarlet secilc 2>&1 | tee -a build_action.log
          sudo pip3 install ConfigObj 2>&1 | tee -a build_action.log
          sudo pip3 install telebot 2>&1 | tee -a build_action.log
          sudo pip3 install setuptools 2>&1 | tee -a build_action.log
          sudo pip3 install google-auth lz4 google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>&1 | tee -a build_action.log

      - name: Grant file permissions
        run: |
          sudo chmod 777 -R *

      - name: Validate Rclone config
        if: ${{ inputs.upload_method == 'drive' }}
        run: |
          set -e
          set -o pipefail
          echo "[STEP] Validate Rclone config" | tee -a build_action.log
          sudo -E bash uploadROM.sh setup "${{ secrets.RCLONE_TOKEN_PATH }}" 2>&1 | tee -a build_action.log

      - name: Build ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          set -e
          set -o pipefail
          echo "[STEP] Build ROM" | tee -a build_action.log
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" 2>&1 | tee -a build_action.log

      - name: Pack ROM
        run: |
          set -e
          set -o pipefail
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          echo "[STEP] Pack ROM" | tee -a build_action.log
          sudo bash packROM.sh 2>&1 | tee -a build_action.log

      - name: Prepare ROM and selected upload
        env:
          UPLOAD_METHOD: ${{ inputs.upload_method }}
          DEBUG_BUILD: ${{ inputs.debug }}
        run: |
          set -e
          set -o pipefail
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          echo "[STEP] Upload method: ${UPLOAD_METHOD}" | tee -a build_action.log
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log

      - name: Split Large File
        if: ${{ inputs.upload_method == 'pixeldrain' }}
        id: split
        shell: bash
        run: |
          FILE=$(find out -maxdepth 1 -name "*.zip" | head -n1)

          if [ -z "$FILE" ]; then
          echo "No ROM zip found!"
          exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((9 * 1024 * 1024 * 1024))

          if [ "$SIZE" -gt "$LIMIT" ]; then
          echo "Splitting ROM..."
          7z a -t7z -mx=0 -v9g "${FILE}.7z" "$FILE"
          echo "split=true" >> "$GITHUB_OUTPUT"
          else
          echo "split=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Pixeldrain
        if: ${{ inputs.upload_method == 'pixeldrain' }}
        id: pd
        shell: bash
        env:
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          FILE="${{ steps.split.outputs.file }}"

          if [[ "${{ steps.split.outputs.split }}" == "true" ]]; then
          LINKS=""
          COUNT=1

          for PART in "${FILE}.7z".*; do
          [ -e "$PART" ] || continue

          echo "Uploading $PART"

          RESPONSE=$(curl -s \
          -u ":$PD_API_KEY" \
          -F "file=@${PART}" \
          https://pixeldrain.com/api/file)

          ID=$(echo "$RESPONSE" | jq -r '.id')

          if [[ -z "$ID" || "$ID" == "null" ]]; then
          echo "Upload failed for $PART. Response:"
          echo "$RESPONSE"
          exit 1
          fi

          URL="https://pixeldrain.com/u/$ID"

          if [[ -z "$LINKS" ]]; then
          LINKS="<a href='$URL'>Part $COUNT</a>"
          else
          LINKS="$LINKS | <a href='$URL'>Part $COUNT</a>"
          fi

          COUNT=$((COUNT + 1))
          done
          else
          echo "Uploading $FILE"

          RESPONSE=$(curl -s \
          -u ":$PD_API_KEY" \
          -F "file=@${FILE}" \
          https://pixeldrain.com/api/file)

          ID=$(echo "$RESPONSE" | jq -r '.id')

          if [[ -z "$ID" || "$ID" == "null" ]]; then
          echo "Upload failed. Response:"
          echo "$RESPONSE"
          exit 1
          fi

          LINKS="<a href='https://pixeldrain.com/u/$ID'>Download</a>"
          fi

          echo "links=$LINKS" >> "$GITHUB_OUTPUT"

      - name: Send success notification
        if: success()
        env:
          NOTIFY_WORKFLOW_CONCLUSION: success
          NOTIFY_UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          DOWNLOAD_URL=""
          if [ "${{ inputs.upload_method }}" = "drive" ]; then
            DOWNLOAD_URL="${RCLONE_DOWNLOAD_URL:-}"
          else
            RAW_LINKS='${{ steps.pd.outputs.links }}'
            DOWNLOAD_URL=$(echo "$RAW_LINKS" | grep -oP 'https?://[^\s">]+' | head -n1 || true)
          fi
          if [ -n "$DOWNLOAD_URL" ]; then
            echo "NOTIFY_DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
            export NOTIFY_DOWNLOAD_URL="$DOWNLOAD_URL"
          fi
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Send failure notification
        if: failure()
        env:
          NOTIFY_WORKFLOW_CONCLUSION: failure
          NOTIFY_ERROR_LOG: build_action.log
        run: |
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Send cancellation notification
        if: cancelled()
        env:
          NOTIFY_WORKFLOW_CONCLUSION: cancelled
          NOTIFY_ERROR_LOG: build_action.log
          NOTIFY_ERROR_REASON: Workflow run was cancelled before completion.
        run: |
          python notify.py cancelled "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
