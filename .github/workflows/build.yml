name: HyperMOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Xiaomi 15 Pro HAOTIAN stock OS3.0.308.0 (Android 16)'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WOBCNXM/haotian-ota_full-OS3.0.308.0.WOBCNXM-user-16.0-9aea0c2b20.zip'
      builder_id:
        description: 'Builder ID'
        required: false
      debug:
        description: 'Debug build'
        required: false
        default: false
        type: boolean
      root_mode:
        description: 'SukiSU Ultra v4.2.1 root (stock KMI, manager preinstalled)'
        required: true
        type: choice
        default: 'root'
        options:
          - root
          - stock
      upload_method:
        description: 'Upload ROM to'
        required: true
        default: 'drive'
        type: choice
        options:
          - drive
          - pixeldrain

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Runner space
        id: diskcheck
        shell: bash
        run: |
          set -euo pipefail
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "[INFO] - Runner free space: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 60 ]; then
            echo "need_cleanup=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] - Low space: cleaning large preinstalled packages"
            docker rmi $(docker images -q) >/dev/null 2>&1 || true
            sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
            sudo apt-get -y purge azure-cli 'ghc*' 'zulu*' 'hhvm*' 'llvm*' firefox 'google*' 'dotnet*' powershell 'mysql*' 'php*' >/dev/null 2>&1 || true
            sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
            sudo apt-get clean
          else
            echo "need_cleanup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Validate local Python patchers before apt/pip and ROM download.
      # Persist diagnostics so Telegram does not mistake a pip warning for an error.
      - name: Python and PowerKeeper source preflight
        shell: bash
        run: |
          set -euo pipefail
          : > build_action.log
          {
            echo "[PHASE] - Python and PowerKeeper source preflight"
            python3 -m py_compile \
              bin/package/NOTIFICATION_FIX/A16/zk_full_powerkeeper_a16.py \
              bin/package/NOTIFICATION_FIX/A16/ryu_killprocess_a16.py \
              bin/package/NOTIFICATION_FIX/A16/restore_uid_policy_abi_a16.py \
              bin/package/NOTIFICATION_FIX/A16/guard_gms_uid_kill_a16.py \
              bin/package/NOTIFICATION_FIX/A16/powerkeeper.py \
              bin/package/NOTIFICATION_FIX/A16/preserve_powerkeeper_identity.py \
              bin/package/NOTIFICATION_FIX/A16/rebuild_powerkeeper_dex.py \
              bin/package/NOTIFICATION_FIX/A16/test_restore_uid_policy_abi_a16.py \
              bin/package/NOTIFICATION_FIX/A16/test_guard_gms_uid_kill_a16.py \
              bin/package/NOTIFICATION_FIX/A16/test_actual_dex_a16.py \
              bin/package/COREPATCH/tnm_zk_power_a16.py
            python3 bin/package/NOTIFICATION_FIX/A16/test_restore_uid_policy_abi_a16.py
            python3 bin/package/NOTIFICATION_FIX/A16/test_guard_gms_uid_kill_a16.py
            echo "[OK] - PowerKeeper source syntax and synthetic tests passed"
          } 2>&1 | tee -a build_action.log

      # Compile the actual pinned ZKOS + RYU PowerKeeper DEX before installing
      # dependencies or downloading a multi-GB ROM. Synthetic tests alone
      # missed the #148 adjacency mismatch in KillProcessController.
      - name: Pinned PowerKeeper DEX preflight
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/powerkeeper-dex-preflight.json"
          log="$RUNNER_TEMP/powerkeeper-dex-preflight.log"
          if ! python3 bin/package/NOTIFICATION_FIX/A16/test_actual_dex_a16.py \
            --zk bin/package/NOTIFICATION_FIX/A16/classes.dex \
            --ryu bin/package/NOTIFICATION_FIX/A16/tnm-perfhook-source.dex \
            --report "$report" > "$log" 2>&1; then
            echo "[ERROR] - Real PowerKeeper DEX preflight failed" | tee -a build_action.log
            tail -n 100 "$log" | tee -a build_action.log
            exit 1
          fi
          echo "[OK] - Actual PowerKeeper DEX compiled with GMS policy guard" | tee -a build_action.log
          python3 - "$report" <<'PYDEXREPORT'
          import json
          import sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          print("[POWERKEEPER DEX]", "classes=" + str(record.get("compiled_class_count")),
                "bytes=" + str(record.get("compiled_dex_bytes")),
                "new_lookup=" + str(record.get("gms_guard_extra_uid_lookup")))
          PYDEXREPORT

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          : > build_action.log
          echo "[PHASE] - Prepare build environment"

          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test >>build_action.log 2>&1
          sudo apt-get update -qq >>build_action.log 2>&1
          sudo apt-get purge -y device-tree-compiler >>build_action.log 2>&1 || true

          if ! sudo apt-get install -y -qq \
            aria2 jq rclone sshpass lz4 python-is-python3 wget python3 xz-utils zlib1g-dev \
            gcc g++ libc6 libstdc++6 python3-pip dialog libgtk-3-dev aapt busybox zip \
            erofs-utils unzip p7zip-full 7zip 7zip-standalone zipalign zstd bc \
            android-sdk-libsparse-utils xmlstarlet secilc binutils >>build_action.log 2>&1; then
            echo "[ERROR] - Package installation failed"
            tail -n 120 build_action.log
            exit 1
          fi

          if ! sudo pip3 install -q ConfigObj telebot setuptools requests google-auth lz4 \
            google-auth-oauthlib google-auth-httplib2 google-api-python-client fonttools pillow >>build_action.log 2>&1; then
            echo "[ERROR] - Python dependency installation failed"
            tail -n 120 build_action.log
            exit 1
          fi

          # Check the LOCK entrypoint before downloading ROM.
          bash -n bin/package/LOCK/update.sh
          # Fast fail pinned PowerKeeper sources, guarded UID port and scoped JAR port.
          bash -n bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh
          bash -n bin/package/COREPATCH/jar_patcher_a16.sh
          bash -n bin/package/COREPATCH/update.sh
          # Check fixed OS3 app snapshots before downloading/extracting the ROM.
          bash -n bin/modfile/OS3/_common.sh
          bash -n bin/modfile/OS3/kashimod.sh
          bash -n bin/modfile/OS3/system/update.sh
          bash -n bin/modfile/OS3/insmod.sh
          python3 - <<'PYOS3'
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          base = Path("bin/modfile/OS3")
          snapshots = [
              ("FreeStyle_CC_mod_", "files/OS3/MIUISystemUIPlugin.apk", "miui.systemui.plugin"),
              ("HyperOS_Screenshot", "files/MIUIScreenshot.apk", "com.miui.screenshot"),
          ]
          with tempfile.TemporaryDirectory(prefix="os3-mod-preflight-") as tmp:
              for prefix, member, expected_package in snapshots:
                  matches = list((base / "kashi").glob(prefix + "*.zip"))
                  if len(matches) != 1:
                      raise SystemExit(f"[OS3] Need exactly one {prefix}*.zip; got {len(matches)}")
                  with zipfile.ZipFile(matches[0]) as archive:
                      if archive.namelist().count(member) != 1:
                          raise SystemExit(f"[OS3] Missing/duplicate member {member} in {matches[0]}")
                      apk = Path(tmp) / (prefix + ".apk")
                      apk.write_bytes(archive.read(member))
                  if not apk.stat().st_size:
                      raise SystemExit(f"[OS3] Empty APK: {member}")
                  result = subprocess.run(["aapt", "dump", "badging", str(apk)],
                                          capture_output=True, text=True, check=True).stdout
                  match = re.search(r"^package: name='([^']+)'", result, re.MULTILINE)
                  if match is None or match.group(1) != expected_package:
                      raise SystemExit(f"[OS3] Wrong APK package in {member}")
                  print(f"[OS3] OK: {matches[0].name} -> {member} ({expected_package})")
          gallery = base / "system/MIUIGallery.apk"
          if not gallery.is_file() or gallery.stat().st_size < 1024:
              raise SystemExit("[OS3] Gallery APK is absent or Git LFS pointer was not hydrated")
          print("[OS3] Kashi and Gallery snapshot preflight passed")
          PYOS3
          sh -n bin/modfile/UpdateFile/TNM/tnm-cpuctl
          bash -n bin/modfile/UpdateFile/TNM/update.sh
          python3 bin/modfile/UpdateFile/TNM/test_cpu_percent.py
          bash -n bin/modfile/UpdateFile/TNMPerfProfile/update.sh
          python3 - <<'PYDEX'
          from pathlib import Path
          import subprocess
          for rel, expected in (
              (Path("bin/package/NOTIFICATION_FIX/A16/classes.dex"),
               "f229fb0a5c67d41a55310a119ef64b18a86d6c04"),
              (Path("bin/package/NOTIFICATION_FIX/A16/tnm-perfhook-source.dex"),
               "1b5a46ea3f9ead44a5467584e15dddd7ba4b0555"),
          ):
              data = rel.read_bytes()
              if len(data) < 112 or not data.startswith(b"dex\n") or int.from_bytes(data[32:36], "little") != len(data):
                  raise SystemExit(f"Invalid bundled PowerKeeper/PerfHook DEX: {rel}")
              blob = subprocess.check_output(["git", "hash-object", str(rel)], text=True).strip()
              if blob != expected:
                  raise SystemExit(f"Pinned donor DEX hash mismatch: {rel}")
          print("PASS: pinned ZKOS DEX + RYU conditional UID/PerfHook source")
          PYDEX
          python3 -m py_compile \
            bin/package/NOTIFICATION_FIX/A16/zk_full_powerkeeper_a16.py \
            bin/package/NOTIFICATION_FIX/A16/ryu_killprocess_a16.py \
            bin/package/NOTIFICATION_FIX/A16/restore_uid_policy_abi_a16.py \
            bin/package/NOTIFICATION_FIX/A16/guard_gms_uid_kill_a16.py \
            bin/package/NOTIFICATION_FIX/A16/powerkeeper.py \
            bin/package/NOTIFICATION_FIX/A16/preserve_powerkeeper_identity.py \
            bin/package/NOTIFICATION_FIX/A16/rebuild_powerkeeper_dex.py \
            bin/package/COREPATCH/tnm_zk_power_a16.py
          python3 bin/package/COREPATCH/test_tnm_zk_power_a16.py
          python3 bin/package/NOTIFICATION_FIX/A16/test_ryu_killprocess_a16.py
          python3 bin/package/NOTIFICATION_FIX/A16/test_restore_uid_policy_abi_a16.py
          python3 bin/package/NOTIFICATION_FIX/A16/test_guard_gms_uid_kill_a16.py
          python3 bin/package/NOTIFICATION_FIX/A16/test_perfhook_passive_init.py

          # ZKOS-parity main retains the base Xiaomi thermal/CPU/powerhint XML.
          # The old TNM/RYU thermal archive is deliberately not imported.

          # Validate Android 16 GMS XML and protect existing FCM exemptions.
          # Pure preflight: no Doze, PowerKeeper or notification settings changed.
          python3 bin/modfile/Universal/gmsservices16/validate-sysconfig.py

          # The Android 16 SystemUI notification-defaults patch has been retired.
          bash -n bin/package/NOTIFICATION_FIX/notificationFIX.sh

          # Fast-fail invalid font integration before unpacking the base ROM.
          python3 -m py_compile bin/modfile/UpdateFile/Fonts/font_utils.py
          bash -n bin/modfile/UpdateFile/Fonts/update.sh

          # Replace standalone font and TNM checks in the main ROM workflow.
          bash -n bin/modfile/UpdateFile/Fonts/install-emoji.sh
          test -s bin/modfile/UpdateFile/Fonts/Shared/NotoColorEmoji.ttf
          test ! -e bin/modfile/UpdateFile/Fonts/HyperOS/NotoColorEmoji.ttf
          test -s bin/modfile/UpdateFile/Fonts/HyperOS/NotoSans-VF.ttf
          test -s bin/modfile/UpdateFile/Fonts/HyperOS/OpenSans-VF.ttf
          test ! -e bin/modfile/UpdateFile/Fonts/HyperOS/SF-Pro.ttf
          # Font verification and catalog staging are offline: no downloads.
          python3 bin/modfile/UpdateFile/Fonts/font_utils.py prepare \
            bin/modfile/UpdateFile/Fonts/HyperOS "$RUNNER_TEMP/hypermos-font-preflight/sources"
          python3 bin/modfile/UpdateFile/Fonts/font_utils.py catalog \
            "$RUNNER_TEMP/hypermos-font-preflight/sources" "$RUNNER_TEMP/hypermos-font-preflight"
          test -s "$RUNNER_TEMP/hypermos-font-preflight/catalog.tsv"
          python3 - "$RUNNER_TEMP/hypermos-font-preflight/catalog.json" <<'PYFONT'
          import json
          import sys
          names = {item["title"] for item in json.load(open(sys.argv[1], encoding="utf-8"))}
          assert {"Roboto", "Noto Sans", "Open Sans"} <= names, names
          assert "SF Pro" not in names, names
          print("[FONT-CATALOG] Required fonts present; SF Pro retired")
          PYFONT
          sh -n bin/modfile/UpdateFile/TNM/tnm-frameworkctl
          sh -n bin/modfile/UpdateFile/TNM/tnm-bridge
          bash -n bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'BACKEND=/data/adb/tnm/bin/tnmctl' bin/modfile/UpdateFile/TNM/tnm-bridge
          grep -Fq 'install -m 0755 "$src_bridge" "$bridge_dst"' bin/modfile/UpdateFile/TNM/update.sh
          grep -Fq 'exec "$BACKEND" "$@"' bin/modfile/UpdateFile/TNM/tnm-bridge
          echo "[OK] - Font catalog, shared emoji and TNM bridge preflight passed"
          # SukiSU Ultra v4.2.1 integration: validate prep, patch and stock-KMI logic.
          bash -n bin/root/prepare_sukisu.sh
          bash -n bin/root/patch_init_boot.sh
          sh -n bin/root/stage_user_manager.sh
          sh -n bin/root/install_user_manager.sh
          test -s bin/root/stage_user_manager.rc
          bash -n bin/modfile/Universal/downloadapp/update.sh
          python3 -m py_compile bin/root/detect_kernel_kmi.py
          python3 bin/root/detect_kernel_kmi.py --self-test
          grep -Fq 'SukiSU-Ultra/SukiSU-Ultra.git' bin/root/prepare_sukisu.sh
          grep -Fq 'SukiSU_v4.2.1_40994-release.apk' bin/root/patch_init_boot.sh
          grep -Fq 'payload="$system_ext/etc/hypermos-root"' bin/root/patch_init_boot.sh
          grep -Fq 'test ! -e "$images/product/app/SukiSUUltra"' bin/root/patch_init_boot.sh
          grep -Fq 'on post-fs-data' bin/root/stage_user_manager.rc
          grep -Fq 'boot-completed.d' bin/root/stage_user_manager.sh
          grep -Fq 'cmd package install --user 0 -r' bin/root/install_user_manager.sh
          grep -Fq 'skip competing/preinstalled root manager' bin/modfile/Universal/downloadapp/update.sh
          echo "[ROOT] SukiSU Ultra v4.2.1 user-app installer preflight passed"



          sudo chmod -R a+rwX .
          chmod +x bin/magiskboot 2>/dev/null || true
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true

          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_id }}" || echo "[WARN] - Start notification failed"

          if [ "${{ inputs.upload_method }}" = "drive" ]; then
            echo "[INFO] - Validate Drive upload config"
            sudo -E bash uploadROM.sh setup "${{ secrets.RCLONE_TOKEN_PATH }}" 2>&1 | tee -a build_action.log
          fi

          echo "[OK] - Build environment ready"

      - name: Build ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
          ROOT_MODE: ${{ inputs.root_mode }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[PHASE] - Build ROM" | tee -a build_action.log
          # Preserve the full build log while making long phases collapsible.
          if sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" \
              "${{ inputs.builder_id }}" 2>&1 | tee -a build_action.log | awk '
                /^\[PHASE\] - [123]\/4 / {
                  if (opened) print "::endgroup::"
                  title = $0
                  sub(/^\[PHASE\] - /, "", title)
                  print "::group::" title
                  opened = 1
                }
                { print; fflush() }
                END { if (opened) print "::endgroup::" }
              '; then
            {
              echo "### Build ROM"
              echo "- ✅ 1/4 Download and inspect base ROM"
              echo "- ✅ 2/4 Extract base ROM"
              echo "- ✅ 3/4 Apply HyperMOS modifications"
              echo "- ⏳ 4/4 Repack is handled by the separate Pack ROM step"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Build ROM failed::Check the grouped build logs and the failure diagnostics."
            {
              echo "### Build ROM"
              echo "**Failed.** Inspect the grouped Build ROM logs and failure diagnostics."
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 25 build_action.log || true
            exit 1
          fi

      - name: Set up SukiSU Android NDK
        if: ${{ inputs.root_mode == 'root' }}
        id: sukisu_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Prepare SukiSU Ultra v4.2.1
        if: ${{ inputs.root_mode == 'root' }}
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.sukisu_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          bash bin/root/prepare_sukisu.sh 2>&1 | tee -a build_action.log

      - name: Patch SukiSU Ultra into init_boot
        if: ${{ inputs.root_mode == 'root' }}
        shell: bash
        env:
          ROOT_MODE: ${{ inputs.root_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reject competing APK preloads; SukiSU manager must be user-installed.
          target="build/baserom/images/product/data-app"
          if [ -d "$target" ] && find "$target" -type f \
              \( -iname 'SukiSU*.apk' -o -iname 'KernelSU*.apk' -o -iname 'KSU*.apk' \) \
              -print -quit | grep -q .; then
            echo "::error::Competing root manager already preinstalled in product/data-app"
            exit 1
          fi
          # build.sh extracts read-only partition trees with sudo.
          sudo -E env PATH="$PATH" ROOT_MODE="$ROOT_MODE" GH_TOKEN="$GH_TOKEN" \
            bash bin/root/patch_init_boot.sh 2>&1 | tee -a build_action.log

      - name: Pack ROM
        shell: bash
        run: |
          set -euo pipefail
          # Check the final LOCK staging within Pack ROM; no separate Actions step.
          echo "::group::LOCK pre-pack sanity check"
          if ! sudo -E bash bin/package/LOCK/update.sh --check 2>&1 | tee -a build_action.log; then
            echo "::endgroup::"
            echo "::error title=LOCK validation failed::Refusing to package inconsistent LOCK staging."
            exit 1
          fi
          echo "::endgroup::"
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_id }}" || true
          echo "[PHASE] - Pack ROM" | tee -a build_action.log
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log

      - name: Package and upload ROM
        shell: bash
        env:
          UPLOAD_METHOD: ${{ inputs.upload_method }}
          ROOT_MODE: ${{ inputs.root_mode }}
          DEBUG_BUILD: ${{ inputs.debug }}
          PD_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
            "${{ inputs.builder_id }}" || true

          echo "[PHASE] - Package and upload via ${UPLOAD_METHOD}" | tee -a build_action.log
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log

          # A Drive upload with no share URL must fall back to Pixeldrain.
          if [ "$UPLOAD_METHOD" = "drive" ]; then
            if [ -s bin/ddevice/download_url.txt ]; then
              echo "[OK] - Google Drive share link generated"
              exit 0
            fi
            echo "[WARN] - Google Drive link unavailable; retrying upload with Pixeldrain"
          fi
          if [ -z "${PD_API_KEY:-}" ]; then
            echo "::error title=Pixeldrain API key missing::Configure PIXELDRAIN_API_KEY to enable direct upload or Drive-link fallback."
            exit 1
          fi

          FILE=$(cat bin/ddevice/output_file.txt 2>/dev/null || true)
          [ -n "$FILE" ] && [ -f "$FILE" ] || {
            echo "[ERROR] - ROM ZIP not found for Pixeldrain"
            exit 1
          }

          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((9 * 1024 * 1024 * 1024))

          upload_one() {
            local src="$1"
            local response id
            echo "[UPLOADING] - $(basename "$src")" >&2
            response=$(curl -fsS -u ":$PD_API_KEY" -F "file=@$src" https://pixeldrain.com/api/file)
            id=$(printf '%s' "$response" | jq -r '.id // empty')
            [[ "$id" =~ ^[A-Za-z0-9]+$ ]] || {
              echo "[ERROR] - Pixeldrain did not return a valid file ID" >&2
              return 1
            }
            printf 'https://pixeldrain.com/u/%s\n' "$id"
          }

          DOWNLOAD_URL=""
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "[INFO] - ROM exceeds 9 GiB; splitting without recompression"
            7zz a -t7z -mx=0 -v9g "${FILE}.7z" "$FILE" >/dev/null
            manifest="${FILE}.parts.txt"
            : > "$manifest"
            file_ids='[]'
            for part in "${FILE}.7z".*; do
              [ -e "$part" ] || continue
              url=$(upload_one "$part")
              printf '%s %s\n' "$(basename "$part")" "$url" >> "$manifest"
              file_ids=$(jq -cn --argjson ids "$file_ids" --arg id "${url##*/}" '$ids + [{id: $id}]')
            done
            [ -s "$manifest" ] || { echo "[ERROR] - No ROM parts uploaded"; exit 1; }
            # One album link gives access to every archive part, not only part 1.
            payload=$(jq -cn --arg title "$(basename "$FILE")" --argjson files "$file_ids" \
              '{title: $title, anonymous: false, files: $files}')
            list_response=$(curl -fsS --retry 2 -u ":$PD_API_KEY" \
              -H 'Content-Type: application/json' -d "$payload" \
              https://pixeldrain.com/api/list 2>/dev/null || true)
            list_id=$(printf '%s' "$list_response" | jq -r '.id // empty' 2>/dev/null || true)
            if [[ "$list_id" =~ ^[A-Za-z0-9]+$ ]]; then
              DOWNLOAD_URL="https://pixeldrain.com/l/$list_id"
            else
              echo "[WARN] - Pixeldrain album unavailable; sharing a manifest of all part links"
              DOWNLOAD_URL=$(upload_one "$manifest")
            fi
          else
            DOWNLOAD_URL=$(upload_one "$FILE")
          fi

          [[ "$DOWNLOAD_URL" =~ ^https://pixeldrain.com/(u|l)/[A-Za-z0-9]+$ ]] || {
            echo "[ERROR] - Pixeldrain did not produce a valid download URL"
            exit 1
          }
          echo "$DOWNLOAD_URL" > bin/ddevice/download_url.txt
          echo "NOTIFY_DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "[OK] - Pixeldrain upload completed: $DOWNLOAD_URL"

      - name: Notify result
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          NOTIFY_WORKFLOW_CONCLUSION: ${{ job.status }}
          NOTIFY_UPLOAD_METHOD: ${{ inputs.upload_method }}
          NOTIFY_ERROR_LOG: build_action.log
        run: |
          set +e
          case "$JOB_STATUS" in
            success)
              if [ -z "${NOTIFY_DOWNLOAD_URL:-}" ] && [ -n "${RCLONE_DOWNLOAD_URL:-}" ]; then
                export NOTIFY_DOWNLOAD_URL="$RCLONE_DOWNLOAD_URL"
              fi
              python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_id }}"
              ;;
            cancelled)
              export NOTIFY_ERROR_REASON="Workflow was cancelled before completion."
              python notify.py cancelled "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_id }}"
              ;;
            *)
              python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" \
                "${{ inputs.builder_id }}"
              ;;
          esac
          exit 0

      # Avoid publishing an unredacted raw log artifact from this public repo:
      # build_action.log may contain private URLs or other sensitive parameters.
      - name: Failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::group::Recent build errors and context"
          if [ -f build_action.log ]; then
            tail -n 60 build_action.log
            {
              echo "### Failure diagnostics"
              echo "Recent error context was printed in the Failure diagnostics step."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "[WARN] No build log was created before the failure."
          fi
          echo "::endgroup::"

      # Full unfiltered line coverage on failure; redact credentials before
      # publishing an artifact in this public repository.
      - name: Prepare full failure log
        if: ${{ failure() }}
        shell: bash
        env:
          RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p failure-diagnostics
          python3 - <<'PYLOG'
          import os
          import re
          from pathlib import Path

          source = Path("build_action.log")
          content = source.read_text(encoding="utf-8", errors="replace") if source.is_file() else "Build log was not created before failure.\n"
          for name in ("RCLONE_TOKEN_PATH", "PIXELDRAIN_API_KEY", "TELEGRAM_BOT_TOKEN"):
              secret = os.environ.get(name, "")
              if secret:
                  content = content.replace(secret, "[REDACTED]")
          content = re.sub(r"(?i)([?&](?:token|key|api_key|secret|password|sig|signature|auth|access_token|refresh_token)=)[^&#\s]+", r"\1[REDACTED]", content)
          content = re.sub(r"(?i)(https?://)[^\s/@:]+:[^\s/@]+@", r"\1[REDACTED]@", content)
          content = re.sub(r"(?i)(\b(?:Authorization|password|api_key|secret|access_token|refresh_token)\s*[:=]\s*)[^\s,;]+", r"\1[REDACTED]", content)
          Path("failure-diagnostics/build_action.log").write_text(content, encoding="utf-8")
          print(f"[OK] Full failure log prepared ({len(content.splitlines())} lines; sensitive values redacted)")
          PYLOG

      - name: Upload full failure log artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: hypermos-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: failure-diagnostics/build_action.log
          if-no-files-found: warn
          retention-days: 7
