name: Extract ZKOS HAOTIAN OS3.0.304.0 reference files

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive ID of zk_haotian.zip (contains ZKOS_HAOTIAN_OS3.0.304.0.WOBCNXM_EU260623 folder)'
        type: string
        required: true
        default: '15tzXbZvcSwP23bnbeGlMjT9Eh4KOD275'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DRIVE_ID: ${{ inputs.drive_file_id }}
      WORK: /tmp/zk-haotian-${{ github.run_id }}
    steps:
      - name: Checkout extraction scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      - name: Prepare environment and disk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/output"
          [[ "$DRIVE_ID" =~ ^[A-Za-z0-9_-]{10,128}$ ]] || exit 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc \
            /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs erofs-utils python3-venv
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install --quiet 'gdown==5.2.0'
          python3 -m py_compile bin/lpunpack.py bin/audit/audit_xiaomi_eu_apps.py bin/audit/extract_ryu_eu_reference.py bin/audit/select_zk_haotian_304.py
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          df -h /
          free=$(df -PB1 "$WORK" | awk 'NR==2 {print $4}')
          if (( free < 28 * 1024 * 1024 * 1024 )); then
            echo "::error::Requires at least 28 GiB free for combined ROM archive processing"
            exit 1
          fi

      - name: Download outer Google Drive archive (16.5 GB)
        shell: bash
        run: |
          set -euo pipefail
          archive="$WORK/zk_haotian-outer.zip"
          for attempt in 1 2 3; do
            if "$WORK/venv/bin/gdown" "$DRIVE_ID" --output "$archive" --continue 2>&1 | tee "$WORK/output/download.log"; then
              if python3 - "$archive" <<'PY'
          import sys, zipfile
          p = sys.argv[1]
          target = 'ZKOS_HAOTIAN_OS3.0.304.0.WOBCNXM_EU260623'
          if not zipfile.is_zipfile(p):
              raise SystemExit('Invalid combined archive: not a ZIP')
          with zipfile.ZipFile(p) as z:
              paths = [x.filename for x in z.infolist()]
              if not any(target.lower() in x.lower().split('/') for x in paths):
                  raise SystemExit('Required 304 ROM folder not found in outer ZIP')
              print(f'[ARCHIVE] {len(paths)} members; required 304 folder detected')
          PY
              then
                echo '[DOWNLOAD] Outer ZIP valid'
                exit 0
              fi
            fi
            if grep -Eiq 'quota exceeded|too many users have viewed|permission denied' "$WORK/output/download.log"; then
              echo '::error::Google Drive quota/permissions blocked this download'
              exit 1
            fi
            (( attempt < 3 )) || exit 1
            sleep 10
          done

      - name: Select exact OS3.0.304.0 folder and extract five original files
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/select_zk_haotian_304.py \
            "$WORK/zk_haotian-outer.zip" \
            "$WORK/selected-rom.zip" \
            "$WORK/output/selected-rom.json"
          rm -f "$WORK/zk_haotian-outer.zip"
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          work = Path(os.environ['WORK'])
          out = work / 'output'
          nested = work / 'selected-rom.zip'
          selection = json.loads((out / 'selected-rom.json').read_text(encoding='utf-8'))
          if selection['selected_version'] != '3.0.304.0':
              raise RuntimeError('Refusing to extract a ROM other than OS3.0.304.0')

          sys.path.insert(0, str(Path('bin/audit').resolve()))
          import extract_ryu_eu_reference as extractor
          extractor.PARTITIONS = ('product', 'system', 'system_ext', 'mi_ext', 'mi_product')
          extractor.FRAMEWORK = {k: v for k, v in extractor.FRAMEWORK.items()
                                  if k in ('framework.jar', 'services.jar', 'miui-framework.jar', 'miui-services.jar')}
          extractor.APPS = {'PowerKeeper': 'powerkeeper.apk'}
          extractor.APP_DIRS = {'PowerKeeper': ('PowerKeeper', 'MIUIPowerKeeper', 'PowerKeeperT')}
          entries = []
          scanned = extractor.extract_fastboot(nested, work, out, Path('bin/lpunpack.py').resolve(), entries)
          wanted = ('framework.jar', 'services.jar', 'miui-framework.jar', 'miui-services.jar', 'PowerKeeper.apk')
          files = {}
          for name in wanted:
              found = [e for e in entries if e['category'] in ('framework', 'apps')
                       and Path(e['file']).name.lower() == name.lower()]
              if len(found) != 1:
                  raise RuntimeError(f'{name}: expected one original file, found {len(found)}')
              item = found[0]
              target = out / name
              shutil.copyfile(out / item['file'], target)
              files[name] = {'source': item['partition'] + ':' + item['original_path'],
                             'bytes': item['bytes'], 'sha256': item['sha256']}
          for folder in ('apps', 'framework', 'build-props'):
              shutil.rmtree(out / folder, ignore_errors=True)
          (out / 'SHA256SUMS.txt').write_text(''.join(
              f"{files[n]['sha256']}  {n}\n" for n in wanted))
          (out / 'manifest.json').write_text(json.dumps(
              {'selection': selection, 'scanned_partitions': scanned,
               'unaltered_and_unsigned_by_extractor': True, 'files': files}, indent=2) + '\n')
          lines = ['# ZKOS HAOTIAN OS3.0.304.0 ROM references', '',
                   f"Selected ROM folder: `{selection['selected_folder']}` (OS {selection['selected_version']})", '',
                   '| File | Source partition:path | SHA-256 |', '| --- | --- | --- |']
          lines += [f"| `{n}` | `{files[n]['source']}` | `{files[n]['sha256']}` |" for n in wanted]
          lines += ['', 'Files were copied unchanged; no APK patch or re-signing.']
          (out / 'report.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines), flush=True)
          PY
          (cd "$WORK/output" && sha256sum -c SHA256SUMS.txt)
          cat "$WORK/output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Include extraction diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '## ZK archive extraction failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check the job logs; the selector requires the exact ZKOS HAOTIAN OS3.0.304.0 folder.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$WORK/output/selected-rom.json" ]; then
            cat "$WORK/output/selected-rom.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload five original files, hashes and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk-haotian-304-framework-powerkeeper-${{ github.run_id }}
          path: ${{ env.WORK }}/output/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
