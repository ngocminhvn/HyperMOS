name: Extract HyperOS Bootanimation

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct HyperOS ROM ZIP URL (OTA, fastboot or custom ROM)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract-bootanimation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          df -h .

      - name: Checkout HyperMOS dump tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Validate ROM link before downloading
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euo pipefail
          python3 bin/dump/preflight.py --url "$ROM_URL"

      - name: Install dump dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl unzip brotli zstd lz4 xz-utils erofs-utils android-sdk-libsparse-utils e2fsprogs
          python3 -m py_compile bin/dump/bootanimation.py bin/dump/sourceforge_download.py
          python3 -m unittest discover -s bin/dump -p 'test_bootanimation.py' -v
          bash -n bin/dump/extract.sh

      - name: Download HyperOS ROM
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hypermos-bootanimation"
          python3 bin/dump/sourceforge_download.py --url "$ROM_URL" --output "$RUNNER_TEMP/hypermos-bootanimation/source.zip" --report "$RUNNER_TEMP/hypermos-bootanimation/mirror-report.json"
          unzip -tq "$RUNNER_TEMP/hypermos-bootanimation/source.zip" >/dev/null

      - name: Extract only bootanimation.zip
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/dump/bootanimation.py --rom "$RUNNER_TEMP/hypermos-bootanimation/source.zip" --work "$RUNNER_TEMP/hypermos-bootanimation/work" --output "$RUNNER_TEMP/hypermos-bootanimation/result/bootanimation.zip"
          source_path="$(cat "$RUNNER_TEMP/hypermos-bootanimation/work/bootanimation-source.txt")"
          {
            echo "### HyperOS bootanimation"
            echo ""
            echo "- Result: bootanimation.zip"
            echo "- Original source: $source_path"
            echo "- Download: Artifacts section of this run"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$RUNNER_TEMP/hypermos-bootanimation/result/bootanimation.zip"

      - name: Upload bootanimation.zip
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-bootanimation-${{ github.run_number }}
          path: ${{ runner.temp }}/hypermos-bootanimation/result/bootanimation.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save extraction diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-bootanimation-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hypermos-bootanimation/work/entries.txt
            ${{ runner.temp }}/hypermos-bootanimation/work/zip-layout.json
            ${{ runner.temp }}/hypermos-bootanimation/work/zip-layout.txt
            ${{ runner.temp }}/hypermos-bootanimation/mirror-report.json
          if-no-files-found: ignore
          retention-days: 7
