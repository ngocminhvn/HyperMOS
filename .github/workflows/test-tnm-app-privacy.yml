name: TNM App Privacy Contract

on:
  push:
    paths:
      - 'bin/package/TNM/**'
      - 'bin/package/patchpackage.sh'
      - 'docs/RYU-HIDE-APP-LIST-ANALYSIS.md'
      - '.github/workflows/test-tnm-app-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate fail-closed patch contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/package/TNM/patch.sh bin/package/patchpackage.sh
          python3 -m py_compile bin/package/TNM/patch_app_privacy.py
          python3 bin/package/TNM/test_patch_app_privacy.py
          work="$(mktemp -d)"
          mkdir -p "$work/android/app"
          cp bin/package/TNM/TnmAppPrivacy.smali "$work/android/app/"
          java -jar bin/apktool/smaliv2.jar a -a 36 "$work" -o "$work/helper.dex"
          java -jar bin/apktool/baksmaliv2.jar list classes "$work/helper.dex" |
            grep -Fxq 'Landroid/app/TnmAppPrivacy;'
          grep -Fq 'TNM_ENABLE_APP_PRIVACY:-0' bin/package/patchpackage.sh
          echo 'TNM App Privacy contract PASS'
