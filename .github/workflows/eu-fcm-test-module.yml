name: EU FCM Test Module

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run with a dump/JAR artifact from the EXACT installed ROM'
        required: true
        type: string
        default: '39452530513'
      source_artifact:
        description: 'Artifact name containing miui-services.jar'
        required: true
        type: string
        default: 'xiaomieu-original-miui-services-39452530513'
      source_sha256:
        description: 'Optional SHA256 of JAR pulled from device, for preflight'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/eu-fcm-test-module.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-eu-fcm-module:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout HyperMOS patch tools
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original JAR / dump artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '39452530513' }}
          name: ${{ inputs.source_artifact || 'xiaomieu-original-miui-services-39452530513' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source

      - name: Select exactly one matching JAR
        env:
          EXPECTED: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, pathlib, zipfile
          root = pathlib.Path('source')
          found = []
          def take(name, raw):
              if pathlib.PurePosixPath(name).name.lower() == 'miui-services.jar':
                  found.append((name, raw))
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if p.name.lower() == 'miui-services.jar':
                  take(str(p), p.read_bytes())
              elif p.suffix.lower() == '.zip':
                  with zipfile.ZipFile(p) as z:
                      for n in z.namelist():
                          if pathlib.PurePosixPath(n).name.lower() == 'miui-services.jar':
                              take(str(p) + ':' + n, z.read(n))
          if len(found) != 1:
              raise SystemExit(f'Expected one miui-services.jar in artifact, found {len(found)}')
          path, jar = found[0]
          with zipfile.ZipFile(io.BytesIO(jar)) as z:
              if z.testzip() or 'classes.dex' not in z.namelist():
                  raise SystemExit('Invalid source JAR')
          digest = hashlib.sha256(jar).hexdigest()
          expected = os.environ.get('EXPECTED', '').lower().strip()
          if expected and digest != expected:
              raise SystemExit('Device JAR SHA mismatch: expected ' + expected + ', artifact ' + digest)
          pathlib.Path('input-miui-services.jar').write_bytes(jar)
          print(f'SOURCE: {path} ({len(jar)} bytes); SHA256: {digest}')
          PY

      - name: Patch six methods in source JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baserom/images/system_ext/framework
          cp input-miui-services.jar build/baserom/images/system_ext/framework/miui-services.jar
          mkdir -p bin/ddevice
          printf 'xiaomi_eu\n' > bin/ddevice/rom_source.txt
          printf '16\n' > bin/ddevice/androidver.txt
          bash bin/package/NOTIFICATION_FIX/A16/EU/patch.sh
          test -s build/baserom/images/system_ext/framework/miui-services.jar
          python3 - <<'PY'
          import zipfile
          p='build/baserom/images/system_ext/framework/miui-services.jar'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None and 'classes.dex' in z.namelist()
          print('Patched JAR archive validated')
          PY

      - name: Package exact-JAR systemless test module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          src=pathlib.Path('input-miui-services.jar').read_bytes()
          jar=pathlib.Path('build/baserom/images/system_ext/framework/miui-services.jar').read_bytes()
          h=lambda x: hashlib.sha256(x).hexdigest()
          if src == jar: raise SystemExit('No actual JAR modification, abort.')
          origin, changed=h(src), h(jar)
          module='HyperMOS_EU_FCM_6_TEST.zip'
          jar_path='system/system_ext/framework/miui-services.jar'
          props='\n'.join([
             'id=hypermos_eu_fcm_6_test',
             'name=HyperMOS EU FCM 6-Method Test',
             'version=1.0-test','versionCode=1','author=HyperMOS',
             'description=Stock EU power + scoped GMS FCM + three PackageManager/security fixes',
             ''])
          installer=r'''#!/system/bin/sh
          fail() { if command -v abort >/dev/null 2>&1; then abort "$1"; else echo "$1" >&2; exit 1; fi; }
          print() { if command -v ui_print >/dev/null 2>&1; then ui_print "$1"; else echo "$1"; fi; }
          [ "$(getprop ro.build.version.sdk)" = "36" ] || fail "HyperMOS EU FCM requires SDK 36"
          if [ "$(getprop ro.product.device)" != "haotian" ] && [ "$(getprop ro.product.vendor.device)" != "haotian" ]; then
              fail "HyperMOS EU FCM: HAOTIAN only"
          fi
          ROM_JAR=/system_ext/framework/miui-services.jar
          [ -f "$ROM_JAR" ] || ROM_JAR=/system/system_ext/framework/miui-services.jar
          [ -f "$ROM_JAR" ] || fail "Missing installed miui-services.jar"
          expected="$(cat "$MODPATH/source.sha256")"
          actual="$(sha256sum "$ROM_JAR" | cut -d ' ' -f 1)"
          [ "$expected" = "$actual" ] || fail "Installed JAR differs: build a module from YOUR running ROM, not EU donor"
          for f in /data/adb/modules/*/system/system_ext/framework/miui-services.jar /data/adb/modules/*/system_ext/framework/miui-services.jar; do
              [ -f "$f" ] || continue
              item="${f#/data/adb/modules/}"
              item="${item%%/*}"
              [ "$item" = "hypermos_eu_fcm_6_test" ] && continue
              [ -f "/data/adb/modules/$item/disable" ] && continue
              fail "Another module replaces miui-services.jar: $item"
          done
          target="$MODPATH/system/system_ext/framework/miui-services.jar"
          [ -s "$target" ] || fail "Module JAR missing"
          [ "$(sha256sum "$target" | cut -d ' ' -f 1)" = "$(cat "$MODPATH/patched.sha256")" ] || fail "Module JAR checksum mismatch"
          if command -v set_perm >/dev/null 2>&1; then set_perm "$target" 0 0 0644; else chmod 0644 "$target"; fi
          print "EU FCM six-method module staged; reboot to test."
          '''
          installer='\n'.join(line[10:] if line.startswith('          ') else line for line in installer.splitlines()) + '\n'
          report={'original_sha256':origin,'patched_sha256':changed,'device':'haotian','sdk':36,'methods':6,'PowerKeeper':'untouched','runtime_verified':False}
          with zipfile.ZipFile(module,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.writestr('module.prop',props)
              z.writestr('customize.sh',installer)
              z.writestr('source.sha256',origin+'\n')
              z.writestr('patched.sha256',changed+'\n')
              z.writestr('build-report.json',json.dumps(report,indent=2)+'\n')
              z.writestr('README.txt','Install with SukiSU/KernelSU/Magisk Manager only. Exact source SHA enforced. Disable module and reboot to revert. Keep recovery access. No ROM boot test has been performed.\n')
              z.writestr(jar_path,jar)
          with zipfile.ZipFile(module) as z:
              assert z.testzip() is None and z.read(jar_path)==jar
          print('MODULE:',module,'input:',origin,'patched:',changed)
          PY
          echo 'Module ZIP generated successfully.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload module for testing
        uses: actions/upload-artifact@v4
        with:
          name: HyperMOS-EU-FCM-6-TEST-${{ github.run_number }}
          path: HyperMOS_EU_FCM_6_TEST.zip
          if-no-files-found: error
          retention-days: 7
