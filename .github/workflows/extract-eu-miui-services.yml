name: Extract Xiaomi.eu miui-services.jar

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Xiaomi.eu fastboot ZIP URL on SourceForge'
        required: true
        type: string
        default: 'https://sourceforge.net/projects/xiaomi-eu-multilang-miui-roms/files/xiaomi.eu/HyperOS-STABLE-RELEASES/HyperOS3.0/xiaomi.eu_HAOTIAN_OS3.0.309.0.WOBCNXM_16_f5fba57993.zip/download#'

permissions:
  contents: read

jobs:
  extract:
    name: Extract original Xiaomi.eu system_ext/framework/miui-services.jar
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK: /tmp/hypermos-eu-miui-services-\${{ github.run_id }}
      ROM_URL: \${{ inputs.rom_url }}

    steps:
      - name: Checkout HyperMOS extraction tools
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Validate Xiaomi.eu source URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/output"
          python3 - <<'PY'
          import os
          from bin.dump.sourceforge_download import normalize

          value = os.environ["ROM_URL"].strip()
          parts = normalize(value)
          if not parts or len(value) > 4096 or not value.startswith("https://"):
              raise SystemExit("ROM URL must be a public HTTPS SourceForge ZIP")
          canonical, project, relative = parts
          filename = relative.rsplit("/", 1)[-1]
          if (project != "xiaomi-eu-multilang-miui-roms"
                  or not filename.startswith("xiaomi.eu_")
                  or not filename.lower().endswith(".zip")):
              raise SystemExit("Expected an original Xiaomi.eu ROM ZIP from SourceForge")
          print("[EU SOURCE]", canonical)
          PY

      - name: Prepare disk space and extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl unzip android-sdk-libsparse-utils e2fsprogs erofs-utils
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          python3 -m py_compile \
            bin/lpunpack.py \
            bin/audit/audit_xiaomi_eu_apps.py \
            bin/audit/extract_eu_miui_services.py \
            bin/audit/ryu_mirror_plan.py \
            bin/dump/sourceforge_download.py
          df -h /

      - name: Benchmark SourceForge mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/ryu_mirror_plan.py \
            --url "$ROM_URL" \
            --output "$WORK/output/mirror-plan.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["WORK"]) / "output/mirror-plan.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Xiaomi.eu SourceForge mirror benchmark\n\n")
              summary.write(f"- Measured fastest: {report.get('fastest_measured') or 'none (fallback)'}\n")
              summary.write(f"- Verified samples: {report['verified_speed_samples']}\n")
              summary.write(f"- Download order: {' -> '.join(report['ranked'])}\n\n")
          PY

      - name: Upload mirror benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: xiaomieu-miui-services-mirror-\${{ github.run_id }}
          path: \${{ env.WORK }}/output/mirror-plan.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Download original Xiaomi.eu ROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/dump/sourceforge_download.py \
            --url "$ROM_URL" \
            --output "$WORK/eu-source.zip" \
            --report "$WORK/output/mirror-report.json" \
            --mirror-plan "$WORK/output/mirror-plan.json" \
            --parallel-mirrors 3 \
            --connections 16 \
            --attempt-timeout-seconds 1200 \
            --max-mirror-attempts 6
          test -s "$WORK/eu-source.zip"

      - name: Extract only original miui-services.jar
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/extract_eu_miui_services.py \
            "$WORK/eu-source.zip" "$WORK" "bin/lpunpack.py"
          test -s "$WORK/output/miui-services.jar"
          test -s "$WORK/output/miui-services-manifest.json"
          test -s "$WORK/output/SHA256SUMS.txt"
          cat "$WORK/output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unmodified miui-services.jar and SHA-256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaomieu-original-miui-services-\${{ github.run_id }}
          path: \${{ env.WORK }}/output/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
