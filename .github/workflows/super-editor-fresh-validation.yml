name: Super IMG Editor - Fresh ROM Validation (EROFS resize)

on:
  push:
    branches:
      - super-img-editor
    paths:
      - .github/workflows/super-editor-fresh-validation.yml
      - scripts/super_rw.py
      - scripts/test_super_rw_fallback.py

permissions:
  contents: read

jobs:
  build-rom:
    uses: ./.github/workflows/super-editor.yml
    with:
      input_url: 'https://psychz.dl.sourceforge.net/project/projectzk/ProjectRYU/RYU-CN/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_CN261005.zip'
      root_mode: root
      upload_method: drive
    secrets: inherit

