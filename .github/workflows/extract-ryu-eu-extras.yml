name: Extract 3 RYU-EU Xiaomi.eu APKs

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'RYU-EU fastboot ZIP URL (ProjectRYU/RYU-EU on SourceForge)'
        required: true
        type: string
        default: 'https://sourceforge.net/projects/projectzk/files/ProjectRYU/RYU-EU/RYUOS3/RYUOS_HAOTIAN_OS3.0.309.0.WOBCNXM_EU261003.zip/download#'

permissions:
  contents: read

jobs:
  extract:
    name: Check and extract XiaomiEUExt XiaomiEUInject MiuiExtraPhoto
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK: /tmp/hypermos-ryu-extras-${{ github.run_id }}
      ROM_URL: ${{ inputs.rom_url }}

    steps:
      - name: Checkout read-only extractor
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Validate RYU-EU SourceForge URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/output"
          python3 - <<'PY'
          import os
          from bin.dump.sourceforge_download import normalize
          value = os.environ["ROM_URL"].strip()
          normalized = normalize(value)
          if normalized is None or len(value) > 4096:
              raise SystemExit("Expected SourceForge RYU-EU ZIP URL")
          _, project, relative = normalized
          if project.lower() != "projectzk" or not relative.lower().startswith("projectryu/ryu-eu/"):
              raise SystemExit("Expected projectzk/ProjectRYU/RYU-EU ROM ZIP")
          print("[SOURCE]", normalized[0])
          PY

      - name: Prepare tools and disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl unzip android-sdk-libsparse-utils e2fsprogs erofs-utils brotli
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          python3 -m py_compile bin/lpunpack.py bin/audit/audit_xiaomi_eu_apps.py bin/audit/extract_ryu_eu_extras.py bin/audit/ryu_mirror_plan.py bin/dump/sourceforge_download.py

      - name: Benchmark SourceForge mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/ryu_mirror_plan.py \
            --url "$ROM_URL" \
            --output "$WORK/output/mirror-plan.json"

      - name: Download and verify original RYU-EU ROM
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/dump/sourceforge_download.py \
            --url "$ROM_URL" \
            --output "$WORK/RYU-EU-source.zip" \
            --report "$WORK/output/mirror-report.json" \
            --mirror-plan "$WORK/output/mirror-plan.json" \
            --parallel-mirrors 3 \
            --connections 16 \
            --attempt-timeout-seconds 1200 \
            --max-mirror-attempts 6
          test -s "$WORK/RYU-EU-source.zip"
          df -h /

      - name: Extract only the three original auxiliary APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/audit/extract_ryu_eu_extras.py \
            "$WORK/RYU-EU-source.zip" "$WORK" "bin/lpunpack.py"
          test -s "$WORK/output/ryu-eu-extras-manifest.json"
          test -f "$WORK/output/SHA256SUMS.txt"
          test -s "$WORK/output/report.md"
          cat "$WORK/output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve partial extraction diagnostic
        if: failure()
        shell: bash
        run: |
          {
            echo "## RYU-EU extras extraction failed"
            echo "Check job logs; existing output files are included in the artifact."
            if [ -s "$WORK/output/report.md" ]; then cat "$WORK/output/report.md"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs, paths, hashes and presence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryu-eu-three-original-apks-${{ github.run_id }}
          path: ${{ env.WORK }}/output/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
