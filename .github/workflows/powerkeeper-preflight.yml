name: HAOTIAN A16 PowerKeeper Preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/powerkeeper-preflight.yml
      - bin/package/NOTIFICATION_FIX/A16/**
      - bin/package/COREPATCH/**
      - bin/package/LOCK/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haotian-a16-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install DEX tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsmali-java
          command -v baksmali
          test -s bin/apktool/smaliv2.jar

      - name: Check scripts and offline policy tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/a16-preflight
          {
            bash -n bin/package/NOTIFICATION_FIX/A16/PowerKeeper.sh
            bash -n bin/package/COREPATCH/update.sh
            bash -n bin/package/COREPATCH/jar_patcher_a16.sh
            bash -n bin/package/LOCK/update.sh
            python3 -m py_compile \
              bin/package/NOTIFICATION_FIX/A16/*.py \
              bin/package/COREPATCH/tnm_framework_gates_a16.py \
              bin/package/COREPATCH/tnm_policy_a16.py \
              bin/package/COREPATCH/tnm_doze_a16.py \
              bin/package/LOCK/integrate.py \
              bin/package/LOCK/sepolicy.py
            python3 bin/package/NOTIFICATION_FIX/A16/test_ryu_killprocess_a16.py -v
            python3 bin/package/COREPATCH/test_tnm_framework_gates_a16.py -v
            python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "bin/package/LOCK")
          import integrate
          helper = Path("bin/package/LOCK/system_ext/xbin/tnm_helper")
          assert hashlib.sha256(helper.read_bytes()).hexdigest() == integrate.HASH
          assert integrate.RUNTIME == "/system_ext/xbin/tnm_helper"
          assert integrate.CONTEXT == "u:object_r:tnm_helper_exec:s0"
          assert len(integrate.PROPERTIES) == 9
          assert integrate.INIT_BLOCK.count(b"exec u:r:init:s0") == 9
          config = json.loads(Path("bin/package/COREPATCH/tnm_framework_gates_a16.json").read_text())
          profile = config["profiles"]["hypermos-app-compat"]
          assert len(profile) == len(set(profile))
          risky = [s for s in profile if "isForceStopEnable(" in s or "checkFullScreenIntent(" in s]
          Path("reports/a16-preflight/framework-review.txt").write_text(
              "Enabled compatibility gates: " + str(len(profile)) +
              "\nSensitive gates requiring review:\n" + "\n".join(risky) + "\n"
          )
          print("[LOCK] helper SHA, init actions and SELinux labels consistent")
          if risky:
              print("::warning::Sensitive force-stop/full-screen RYU gates remain enabled on main")
          PY
          } 2>&1 | tee reports/a16-preflight/offline-tests.log

      - name: Compare and recompile real pinned ZKOS and RYU DEX
        shell: bash
        run: |
          set -euo pipefail
          zk=bin/package/NOTIFICATION_FIX/A16/classes.dex
          ryu=bin/package/NOTIFICATION_FIX/A16/tnm-perfhook-source.dex
          test -s "$zk" && test -s "$ryu"
          test "$(git hash-object "$zk")" = "f229fb0a5c67d41a55310a119ef64b18a86d6c04"
          test "$(git hash-object "$ryu")" = "1b5a46ea3f9ead44a5467584e15dddd7ba4b0555"
          python3 - "$zk" "$ryu" <<'PY'
          from pathlib import Path
          import sys
          for filename in sys.argv[1:]:
              data = Path(filename).read_bytes()
              assert len(data) > 112 and data.startswith(b"dex\n"), filename
              assert int.from_bytes(data[32:36], "little") == len(data), filename
              print("[DEX INPUT VERIFIED]", filename, len(data))
          PY
          python3 bin/package/NOTIFICATION_FIX/A16/test_actual_dex_a16.py \
            --zk "$zk" --ryu "$ryu" \
            --report reports/a16-preflight/real-dex-test.json \
            2>&1 | tee reports/a16-preflight/real-dex-test.log

      - name: Explain what this preflight cannot prove
        if: always()
        run: |
          {
            echo '## HAOTIAN A16 preflight'
            echo
            echo 'Checks: offline RYU policy unit tests, framework-gate tests, LOCK helper consistency, actual pinned ZKOS/RYU DEX transplant, full DEX rebuild and re-disassembly.'
            echo
            echo '**Not checked:** ROM repack, Xiaomi stock APK resources/signature handling, runtime framework API linkage, real-device boot, SELinux enforcement and notification or battery behavior.'
            echo
            echo 'This test does not download a ROM, flash a phone, modify boot security state or upload a ROM.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haotian-a16-preflight-${{ github.sha }}
          path: reports/a16-preflight/
          retention-days: 14
          if-no-files-found: warn
