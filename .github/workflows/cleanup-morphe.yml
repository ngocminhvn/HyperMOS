name: Cleanup Morphe traces

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-morphe.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Morphe releases, tags, artifacts and old runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh release delete morphe-test-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          gh release delete morphe-standalone-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y

          for ARTIFACT_ID in 11047761094 11047712867 11048726728; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          done

          for RUN_ID in 36598096962 36599319453 36599412422; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          done

          exit 0
