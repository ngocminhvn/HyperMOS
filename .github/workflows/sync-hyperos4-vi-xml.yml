name: Sync HyperOS 4 Vietnamese XML

on:
  workflow_dispatch:
    inputs:
      publish_to_repo:
        description: "Commit the XML snapshot into MultiLang/OS4 (requires redistribution rights)"
        type: boolean
        required: true
        default: false
      confirm_redistribution_rights:
        description: "I have permission to redistribute these upstream XML files"
        type: boolean
        required: true
        default: false
  push:
    paths:
      - .github/workflows/sync-hyperos4-vi-xml.yml
      - bin/modfile/UpdateFile/MultiLang/OS4/sync_os4_vi.py

permissions:
  contents: write

concurrency:
  group: sync-hyperos4-vietnamese-xml
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout HyperMOS
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false

      - name: Check MultiLang dispatch layout and syntax
        shell: bash
        run: |
          set -euo pipefail
          for path in bin/modfile/UpdateFile/insupdate.sh bin/modfile/UpdateFile/MultiLang/update.sh bin/modfile/UpdateFile/MultiLang/OS3/update.sh bin/modfile/UpdateFile/MultiLang/OS4/update.sh; do
            bash -n "$path"
          done
          python3 - <<'PY'
          from pathlib import Path
          root = Path("bin/modfile/UpdateFile/MultiLang")
          entries = {item.name for item in root.iterdir()}
          assert entries == {"OS3", "OS4", "update.sh"}, entries
          PY

      - name: Download only Qualcomm SDK37 Vietnamese XML source
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper='!gh auth git-credential' \
            clone --quiet --depth=1 --filter=blob:none --sparse \
            --branch master \
            https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git \
            "$RUNNER_TEMP/xiaomi-eu-xml"
          git -C "$RUNNER_TEMP/xiaomi-eu-xml" sparse-checkout set \
            qcom-sdk37/Vietnamese/main
          revision="$(git -C "$RUNNER_TEMP/xiaomi-eu-xml" rev-parse HEAD)"
          echo "UPSTREAM_REVISION=$revision" >> "$GITHUB_ENV"

      - name: Validate and stage OS4 Vietnamese XML
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/modfile/UpdateFile/MultiLang/OS4/sync_os4_vi.py \
            --source "$RUNNER_TEMP/xiaomi-eu-xml/qcom-sdk37/Vietnamese/main" \
            --revision "$UPSTREAM_REVISION"
          {
            echo "### HyperOS 4 Vietnamese XML"
            echo "Source: ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global/qcom-sdk37/Vietnamese/main"
            echo "Commit: \`$UPSTREAM_REVISION\`"
            echo "Destination: \`bin/modfile/UpdateFile/MultiLang/OS4/Vietnamese/main\`"
            echo "This is XML staging only; no APK/RRO/framework patch is performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject publication without redistribution permission
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_repo == true && inputs.confirm_redistribution_rights != true
        shell: bash
        run: |
          echo "::error::Publishing upstream XML requires confirmed redistribution rights"
          exit 1

      - name: Commit verified OS4 XML only with explicit permission
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_repo == true && inputs.confirm_redistribution_rights == true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bin/modfile/UpdateFile/MultiLang/OS4/Vietnamese/
          if git diff --cached --quiet; then
            echo "OS4 Vietnamese XML is already up to date."
          else
            git commit -m "chore(multilang): sync OS4 Vietnamese XML from Xiaomi.eu"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
