name: Verify EU SecurityCenter countdown

on:
  push:
    branches:
      - fix/eu-securitycenter-countdown
    paths:
      - .github/workflows/inspect-eu-securitycenter.yml
      - bin/modfile/ModApp/OS3/kashimod.sh
      - bin/modfile/ModApp/OS3/verify_eu_securitycenter.py

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: xiaomieu
            run_id: 39432734236
            artifact: xiaomieu-securitycenter-39432734236
          - label: ryu-eu
            run_id: 39533579142
            artifact: ryu-eu-securitycenter-39533579142
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: original
      - name: Verify original signed EU APK
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/modfile/ModApp/OS3/kashimod.sh
          python3 -m py_compile bin/modfile/ModApp/OS3/verify_eu_securitycenter.py
          test -s original/SecurityCenter.apk
          before="$(sha256sum original/SecurityCenter.apk)"
          java -jar bin/apktool/apksigner.jar verify original/SecurityCenter.apk
          java -Xmx4g -jar bin/apktool/apke.jar d -t raw -f -no-dex-debug \
            -i original/SecurityCenter.apk -o decoded > decode.log
          python3 bin/modfile/ModApp/OS3/verify_eu_securitycenter.py decoded
          after="$(sha256sum original/SecurityCenter.apk)"
          test "$before" = "$after"
          echo "${{ matrix.label }}: original signed APK unchanged"
