name: Collect ZKOS HAOTIAN PowerKeeper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DRIVE_FILE_ID: 15tzXbZvcSwP23bnbeGlMjT9Eh4KOD275
      DRIVE_FILE_BYTES: 16515592696
      EXPECTED_SHA256: 559665acc17f0e6c900cbaf644331ea431d1c59519a0c44a944b6cb16d7c003f

    steps:
      - name: Free runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker image prune --all --force >/dev/null 2>&1 || true

      - name: Checkout extraction tools
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            erofs-utils e2fsprogs android-sdk-libsparse-utils unzip python3-venv file jq
          python3 -m venv "$RUNNER_TEMP/zk-env"
          "$RUNNER_TEMP/zk-env/bin/pip" -q install gdown==5.2.0

      - name: Download verified ZKOS archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zk-haotian.zip"
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/zk-env/bin/gdown" \
              "https://drive.google.com/uc?id=$DRIVE_FILE_ID" \
              -O "$archive" --continue --fuzzy && break
            echo "Download attempt $attempt failed"
            sleep 20
          done
          [[ "$(stat -c %s "$archive")" == "$DRIVE_FILE_BYTES" ]] || {
            echo "::error::Unexpected ZKOS archive size"
            exit 1
          }
          unzip -tq "$archive"

      - name: Select newest HAOTIAN release
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/zk-haotian.zip" "$RUNNER_TEMP/zk-super.img" <<'PY'
          import re
          import shutil
          import sys
          from zipfile import ZipFile

          source, output = sys.argv[1:]
          with ZipFile(source) as archive:
              ranked = []
              for item in archive.infolist():
                  if item.filename.split('/')[-1] != 'super.img' or item.is_dir():
                      continue
                  match = re.search(
                      r'ZKOS_HAOTIAN_OS(\d+)\.(\d+)\.(\d+)\.(\d+)\.([A-Z0-9]+)_[^/]+/images/super\.img$',
                      item.filename,
                  )
                  if not match:
                      raise SystemExit('Unknown HAOTIAN super image: ' + item.filename)
                  ranked.append((tuple(map(int, match.groups()[:4])), match.group(5), item))
              if not ranked or len({variant for _, variant, _ in ranked}) != 1:
                  raise SystemExit('Missing or incompatible ZKOS HAOTIAN releases')
              newest = max(version for version, _, _ in ranked)
              selected = [item for version, _, item in ranked if version == newest]
              if len(selected) != 1:
                  raise SystemExit('Newest ZKOS release is ambiguous')
              item = selected[0]
              print('Selected:', item.filename, flush=True)
              with archive.open(item) as src, open(output, 'wb') as dst:
                  shutil.copyfileobj(src, dst, 16 * 1024 * 1024)
          PY
          rm -f "$RUNNER_TEMP/zk-haotian.zip"

      - name: Extract exact ZKOS PowerKeeper
        shell: bash
        run: |
          set -euo pipefail
          super="$RUNNER_TEMP/zk-super.img"
          if [[ "$(od -An -tx4 -N4 "$super" | tr -d ' \n')" == ed26ff3a ]]; then
            simg2img "$super" "$RUNNER_TEMP/zk-super.raw"
            mv "$RUNNER_TEMP/zk-super.raw" "$super"
          fi
          python3 bin/lpunpack.py --info -f json "$super" > "$RUNNER_TEMP/partitions.json"
          partition="$(python3 - "$RUNNER_TEMP/partitions.json" <<'PY'
          import json
          import sys
          names = {p['name'] for p in json.load(open(sys.argv[1], encoding='utf-8'))['partitions']}
          candidates = [name for name in ('system_ext_a', 'system_ext') if name in names]
          if len(candidates) != 1:
              raise SystemExit('Missing or ambiguous ZKOS system_ext partition: ' + repr(sorted(names)))
          print(candidates[0])
          PY
          )"
          mkdir -p "$RUNNER_TEMP/partition" "$RUNNER_TEMP/system-ext" "$RUNNER_TEMP/artifact"
          python3 bin/lpunpack.py -p "$partition" "$super" "$RUNNER_TEMP/partition"
          image="$(find "$RUNNER_TEMP/partition" -maxdepth 1 -type f -name '*.img' -print -quit)"
          [[ -s "$image" ]] || { echo "::error::system_ext image missing"; exit 1; }
          if file -b "$image" | grep -qi erofs; then
            fsck.erofs --extract="$RUNNER_TEMP/system-ext" "$image"
          else
            debugfs -R "rdump /app $RUNNER_TEMP/system-ext" "$image" >/dev/null
          fi
          apk="$(find "$RUNNER_TEMP/system-ext" -type f -name 'PowerKeeper*.apk' -print -quit)"
          [[ -s "$apk" ]] || { echo "::error::ZKOS PowerKeeper missing"; exit 1; }
          cp "$apk" "$RUNNER_TEMP/artifact/PowerKeeperZK.apk"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/artifact/PowerKeeperZK.apk" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/artifact/PowerKeeperZK.apk"

      - name: Upload build donor
        uses: actions/upload-artifact@v4
        with:
          name: ZKOS-HAOTIAN-PowerKeeper
          path: ${{ runner.temp }}/artifact/PowerKeeperZK.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
