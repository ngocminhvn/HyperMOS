name: dump

on:
  workflow_call:
    inputs:
      rom_url:
        description: 'Direct ROM ZIP URL'
        required: true
        type: string
      upload_method:
        description: 'Save extracted dump to'
        required: true
        type: string
        default: artifact
      dump_mode:
        description: 'base = 5 named JAR/APK files; full = complete target list'
        required: false
        type: string
        default: base
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct ROM ZIP URL (OTA, fastboot or modified ROM)'
        required: true
        type: string
      upload_method:
        description: 'Save extracted dump to'
        required: true
        type: choice
        default: artifact
        options:
          - artifact
          - drive
      dump_mode:
        description: 'Dump mode (base: 5 files, full: target list)'
        required: true
        type: choice
        default: base
        options:
          - base
          - full

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DUMP_MODE: ${{ inputs.dump_mode }}
    steps:
      - name: Free runner space
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          df -h .

      - name: Checkout HyperMOS tools
        uses: actions/checkout@v4
        with:
          ref: feature/dump-workflow
          lfs: false
          persist-credentials: false

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 unzip brotli erofs-utils android-sdk-libsparse-utils e2fsprogs rclone zip
          python3 -m py_compile bin/dump/collect.py bin/dump/base.py
          bash -n bin/dump/extract.sh
          test -s bin/dump/targets.txt

      - name: Download ROM
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euo pipefail
          case "$ROM_URL" in http://*|https://*) ;; *) echo '[ERROR] Invalid ROM URL'; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/hypermos-dump"
          aria2c --file-allocation=none --max-tries=5 --retry-wait=5 -c -x8 -s8 \
            --dir="$RUNNER_TEMP/hypermos-dump" --out=source.zip "$ROM_URL"
          unzip -tq "$RUNNER_TEMP/hypermos-dump/source.zip" >/dev/null

      - name: Unpack ROM without mod or repack
        shell: bash
        run: |
          set -euo pipefail
          bash bin/dump/extract.sh "$RUNNER_TEMP/hypermos-dump/source.zip" "$RUNNER_TEMP/hypermos-dump/work"

      - name: Copy files and create map
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euo pipefail
          case "$DUMP_MODE" in
            base)
              python3 bin/dump/base.py \
                --images "$RUNNER_TEMP/hypermos-dump/work/images" \
                --output "$RUNNER_TEMP/hypermos-dump/output" \
                --source-url "$ROM_URL"
              ;;
            full)
              python3 bin/dump/collect.py \
                --images "$RUNNER_TEMP/hypermos-dump/work/images" \
                --targets bin/dump/targets.txt \
                --output "$RUNNER_TEMP/hypermos-dump/output" \
                --source-url "$ROM_URL"
              ;;
            *)
              echo "::error::Unsupported dump mode: $DUMP_MODE"
              exit 1
              ;;
          esac
          echo "Dump mode: $DUMP_MODE. map.tsv and map.json included in ZIP." >> "$GITHUB_STEP_SUMMARY"

      - name: Package dump ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hypermos-dump/output"
          zip -q -r -1 "$GITHUB_WORKSPACE/HyperMOS-dump-$DUMP_MODE-$GITHUB_RUN_NUMBER.zip" .
          ls -lh "$GITHUB_WORKSPACE/HyperMOS-dump-$DUMP_MODE-$GITHUB_RUN_NUMBER.zip"

      - name: Upload GitHub Artifact
        if: ${{ inputs.upload_method == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: HyperMOS-dump-${{ inputs.dump_mode }}-${{ github.run_number }}
          path: HyperMOS-dump-${{ inputs.dump_mode }}-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Google Drive using existing rclone config
        if: ${{ inputs.upload_method == 'drive' }}
        shell: bash
        env:
          RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_TOKEN_PATH" || { echo '[ERROR] Missing RCLONE_TOKEN_PATH'; exit 1; }
          config_url="$RCLONE_TOKEN_PATH"
          case "$config_url" in https://*|http://*) ;; //*) config_url="https:$config_url" ;; *) config_url="https://$config_url" ;; esac
          config="$RUNNER_TEMP/hypermos-dump/rclone.conf"
          curl -fsSL --retry 4 "$config_url" -o "$config"
          remote="$(rclone listremotes --config="$config" | head -1)"
          test -n "$remote" || { echo '[ERROR] No configured remote'; exit 1; }
          name="HyperMOS-dump-$DUMP_MODE-$GITHUB_RUN_NUMBER.zip"
          rclone copyto "$name" "${remote}HyperMOS/dump/$name" \
            --config="$config" --progress --transfers=1 --retries=6
          rclone link "${remote}HyperMOS/dump/$name" --config="$config" || true
