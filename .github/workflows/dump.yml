name: dump

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct ROM ZIP URL (OTA, fastboot or modified ROM)'
        required: true
        type: string
      upload_method:
        description: 'Save extracted dump to'
        required: true
        type: choice
        default: artifact
        options:
          - artifact
          - drive
      dump_mode:
        description: 'Dump mode (base: 5 files, full: target list)'
        required: true
        type: choice
        default: base
        options:
          - base
          - full

permissions:
  contents: read

jobs:
  dump:
    # Launcher only: all dump logic remains on feature/dump-workflow.
    uses: ngocminhvn/HyperMOS/.github/workflows/dump.yml@feature/dump-workflow
    with:
      rom_url: ${{ inputs.rom_url }}
      upload_method: ${{ inputs.upload_method }}
      dump_mode: ${{ inputs.dump_mode }}
    secrets: inherit
