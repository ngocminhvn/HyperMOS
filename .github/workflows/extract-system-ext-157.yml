name: Extract system_ext.img (#157)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Google Drive ROM ZIP URL (or Drive file ID)'
        required: true
        type: string
        default: 'https://drive.google.com/open?id=1Uv7hGxx38KtNfJiz-qj-4FWTMrJRQNFW'
      upload_method:
        description: 'Save the extracted system_ext.img to'
        required: true
        type: choice
        default: drive
        options:
          - drive
          - artifact
  # The first commit adding this workflow runs the pinned #157 extraction once.
  # Subsequent pushes to unrelated files will not trigger large downloads.
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-system-ext-157.yml'

permissions:
  contents: read

concurrency:
  group: extract-system-ext-157-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ROM_URL: ${{ inputs.rom_url || 'https://drive.google.com/open?id=1Uv7hGxx38KtNfJiz-qj-4FWTMrJRQNFW' }}
      UPLOAD_METHOD: ${{ inputs.upload_method || 'drive' }}
      WORK: /tmp/hypermos-system-ext-157
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          df -h .

      - name: Checkout extraction tool
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          persist-credentials: false

      - name: Install rclone and sparse-image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone android-sdk-libsparse-utils unzip
          command -v simg2img
          command -v rclone
          python3 -m py_compile bin/lpunpack.py
          mkdir -p "$WORK/output" "$WORK/extracted"

      - name: Validate Drive URL and input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse, parse_qs
          value = os.environ["ROM_URL"].strip()
          match = re.fullmatch(r"[A-Za-z0-9_-]{15,}", value)
          if match:
              file_id = value
          else:
              url = urlparse(value)
              if url.scheme != "https" or url.hostname not in {"drive.google.com", "www.drive.google.com"}:
                  raise SystemExit("Input must be a Google Drive HTTPS file link or file ID")
              path = re.fullmatch(r"/file/d/([A-Za-z0-9_-]{15,})(?:/view)?/?", url.path)
              if path:
                  file_id = path.group(1)
              elif url.path in ("/open", "/uc"):
                  file_id = parse_qs(url.query).get("id", [""])[0]
              else:
                  raise SystemExit("Unsupported Google Drive file URL")
              if not re.fullmatch(r"[A-Za-z0-9_-]{15,}", file_id):
                  raise SystemExit("Invalid Google Drive file ID")
          if os.environ["UPLOAD_METHOD"] not in {"artifact", "drive"}:
              raise SystemExit("Unsupported upload_method")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"DRIVE_FILE_ID={file_id}\n")
          print("Validated Drive file ID:", file_id)
          PY

      - name: Load existing private rclone configuration
        shell: bash
        env:
          RCLONE_TOKEN_PATH: ${{ secrets.RCLONE_TOKEN_PATH }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$RCLONE_TOKEN_PATH" ]]; then
            echo "::error::RCLONE_TOKEN_PATH secret is required to download this large Drive ZIP by file ID."
            exit 1
          fi
          config_url="$RCLONE_TOKEN_PATH"
          case "$config_url" in
            https://*) ;;
            //*) config_url="https:$config_url" ;;
            *) config_url="https://$config_url" ;;
          esac
          config="$WORK/rclone.conf"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 4 "$config_url" -o "$config"
          chmod 600 "$config"
          remote="$(rclone listremotes --config "$config" | head -n 1)"
          if [[ -z "$remote" ]]; then
            echo "::error::No rclone remote found in existing config"
            exit 1
          fi
          remote_type="$(rclone config show "${remote%:}" --config "$config" | awk -F ' = ' '/^type = / {print $2; exit}')"
          if [[ "$remote_type" != "drive" ]]; then
            echo "::error::First rclone remote is not Google Drive"
            exit 1
          fi
          echo "RCLONE_CONFIG_PATH=$config" >> "$GITHUB_ENV"
          echo "RCLONE_REMOTE=$remote" >> "$GITHUB_ENV"
          echo "[OK] Google Drive OAuth remote ready (credentials are not printed)"

      - name: Download only the requested ROM ZIP by Drive file ID
        shell: bash
        run: |
          set -euo pipefail
          rclone backend copyid "$RCLONE_REMOTE" "$DRIVE_FILE_ID" "$WORK/source.zip" \
            --config "$RCLONE_CONFIG_PATH" \
            --transfers=1 --retries=5 --low-level-retries=10 \
            --stats=60s --stats-one-line
          test -s "$WORK/source.zip"
          size="$(stat -c%s "$WORK/source.zip")"
          if [[ "$DRIVE_FILE_ID" == "1Uv7hGxx38KtNfJiz-qj-4FWTMrJRQNFW" && "$size" != "8966620775" ]]; then
            echo "::error::The downloaded #157 ZIP size does not match verified Google Drive metadata"
            exit 1
          fi
          echo "Downloaded ROM bytes: $size"
          df -h "$WORK"

      - name: Stream only super/super.img from ROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path
          work = Path(os.environ["WORK"])
          src_zip = work / "source.zip"
          with zipfile.ZipFile(src_zip) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("ROM ZIP CRC validation failed")
              matches = [m for m in archive.infolist()
                         if m.filename in ("super/super.img", "super.img", "images/super.img")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one super.img in ROM ZIP, found {len(matches)}")
              part = matches[0]
              if part.flag_bits & 1:
                  raise SystemExit("Encrypted super.img entry is unsupported")
              if part.file_size < 100 * 1024 * 1024:
                  raise SystemExit("Unexpectedly small super.img")
              free = shutil.disk_usage(work).free
              if free < part.file_size + 1024**3:
                  raise SystemExit(f"Insufficient disk for super.img ({part.file_size} bytes, {free} free)")
              print(f"Extracting only {part.filename}, {part.file_size} bytes")
              with archive.open(part) as inp, (work / "super.img").open("wb") as out:
                  shutil.copyfileobj(inp, out, 8 * 1024 * 1024)
          if (work / "super.img").stat().st_size != part.file_size:
              raise SystemExit("Extracted super.img size mismatch")
          PY
          rm -f "$WORK/source.zip"
          df -h "$WORK"

      - name: Convert sparse super image, if required
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, struct, subprocess
          from pathlib import Path
          work = Path(os.environ["WORK"])
          source = work / "super.img"
          with source.open("rb") as fh:
              header = fh.read(28)
          if len(header) < 28:
              raise SystemExit("super.img header truncated")
          if header[:4] == b"\x3a\xff\x26\xed":
              magic, major, minor, file_hdr, chunk_hdr, block_sz, total_blks, chunks, crc = struct.unpack("<I4H4I", header)
              if major != 1 or block_sz < 4096 or block_sz % 4096 or not total_blks:
                  raise SystemExit("Unexpected Android sparse-image header")
              raw_size = block_sz * total_blks
              free = shutil.disk_usage(work).free
              if free < raw_size + 1024**3:
                  raise SystemExit(f"Insufficient disk to expand super.img: need {raw_size} bytes plus margin, free {free}")
              print(f"Expanding Android sparse super.img to {raw_size} raw bytes")
              subprocess.run(["simg2img", str(source), str(work / "super.raw.img")], check=True)
              if (work / "super.raw.img").stat().st_size != raw_size:
                  raise SystemExit("Raw super.img size mismatch")
              source.unlink()
          else:
              source.rename(work / "super.raw.img")
              print("Input super.img was already raw")
          PY
          df -h "$WORK"

      - name: Extract only the system_ext logical partition
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/lpunpack.py -p system_ext,system_ext_a "$WORK/super.raw.img" "$WORK/extracted"
          rm -f "$WORK/super.raw.img"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["WORK"])
          extracted = work / "extracted"
          images = list(extracted.glob("*.img"))
          if len(images) != 1 or images[0].name not in ("system_ext.img", "system_ext_a.img"):
              raise SystemExit(f"Expected exactly one populated system_ext partition; found {[p.name for p in images]}")
          source = images[0]
          output = work / "output" / "system_ext.img"
          source.rename(output)
          with output.open("rb") as fh:
              fh.seek(1024)
              erofs_magic = fh.read(4)
          if erofs_magic != b"\xe2\xe1\xf5\xe0":
              raise SystemExit(f"Result does not have EROFS superblock magic at offset 1024: {erofs_magic.hex()}")
          h = hashlib.sha256()
          with output.open("rb") as stream:
              for block in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  h.update(block)
          sha = h.hexdigest()
          (work / "output" / "SHA256SUMS.txt").write_text(f"{sha}  system_ext.img\n", encoding="utf-8")
          info = {
              "source_rom": os.environ["ROM_URL"],
              "drive_file_id": os.environ["DRIVE_FILE_ID"],
              "source_partition": source.stem,
              "output": "system_ext.img",
              "filesystem": "EROFS",
              "size_bytes": output.stat().st_size,
              "sha256": sha,
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_commit": os.environ["GITHUB_SHA"],
              "flashing_performed": False,
          }
          (work / "output" / "extract-info.json").write_text(
              json.dumps(info, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          (work / "output" / "README.txt").write_text(
              "HyperMOS #157: system_ext.img from source ROM ZIP.\n"
              "This is a FULL LOGICAL PARTITION image, NOT a single-file patch.\n"
              "Extraction only: the Action does NOT flash any phone.\n"
              "Do not flash before verifying fastbootd, slot, partition layout,\n"
              "vbmeta compatibility, and a working recovery/rollback image.\n",
              encoding="utf-8")
          print(json.dumps(info, indent=2))
          PY
          ls -lh "$WORK/output/"
          df -h "$WORK"
          {
            echo "### HyperMOS system_ext.img extracted"
            echo ""
            echo "- ROM Drive ID: \`$DRIVE_FILE_ID\`"
            echo "- Partition: \`system_ext.img\` (EROFS)"
            echo "- Only \`system_ext\` was extracted; no flashing performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extracted image to Google Drive
        if: ${{ env.UPLOAD_METHOD == 'drive' }}
        shell: bash
        run: |
          set -euo pipefail
          destination="${RCLONE_REMOTE}HyperMOS/extracted/system_ext/run-${GITHUB_RUN_ID}"
          rclone copy "$WORK/output" "$destination" \
            --config "$RCLONE_CONFIG_PATH" \
            --transfers=1 --retries=5 --low-level-retries=10 \
            --drive-chunk-size=128M --stats=60s --stats-one-line
          image_url="$(rclone link "$destination/system_ext.img" --config "$RCLONE_CONFIG_PATH" 2>/dev/null || true)"
          {
            echo ""
            echo "### Download"
            echo ""
            if [[ "$image_url" == https://* ]]; then
              echo "[system_ext.img on Google Drive]($image_url)"
              echo "[Open Drive output folder](https://drive.google.com/drive/u/0/my-drive)"
              echo "EXTRACTED_IMAGE_URL=$image_url" >> "$GITHUB_ENV"
              echo "Extracted image URL: $image_url"
            else
              echo "Drive upload succeeded, but no public link was returned. Check: $destination"
              echo "::warning::rclone did not return a shareable image link"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extracted image as GitHub artifact
        if: ${{ env.UPLOAD_METHOD == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: HyperMOS-157-system_ext-${{ github.run_number }}
          path: ${{ runner.temp }}/hypermos-system-ext-157/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::Extraction failed. Review the failed step and available disk space."
          df -h "$WORK" || true
          du -sh "$WORK"/* 2>/dev/null || true
