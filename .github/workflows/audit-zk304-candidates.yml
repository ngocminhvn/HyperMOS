name: Audit useful ZK304 policy differences
on:
  push:
    branches: [main]
    paths:
      - 'bin/audit/zk304_candidate_audit.py'
      - 'bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py'
      - 'bin/package/NOTIFICATION_FIX/A16/EU/patch.sh'
      - 'bin/package/NOTIFICATION_FIX/A16/EU/PowerKeeper.sh'
      - '.github/workflows/audit-zk304-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare original ZK304, EU309 and Global303 donor JAR/APK DEX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=/tmp/zk304-audit
          mkdir -p "$root"
          for side in zk eu global; do
            mkdir -p "$root/$side/jar" "$root/$side/power"
          done
          archive=bin/package/NOTIFICATION_FIX/A16/EU/backupzk.zip
          test -s "$archive"
          echo "[ZK BACKUP] checking archive"
          unzip -t "$archive" >/dev/null
          prefix=bin/package/NOTIFICATION_FIX/A16/EU/ZK304
          unzip -p "$archive" "$prefix/zk304-miui-services.jar.zst" | zstd -d -q -c > "$root/zk/jar.jar"
          unzip -p "$archive" "$prefix/zk304-powerkeeper.dex.zst" | zstd -d -q -c > "$root/zk/power.dex"
          echo "[ZK BACKUP] extracted ZK304 framework donor"
          gh run download 39452530513 --repo "$GITHUB_REPOSITORY" --name xiaomieu-original-miui-services-39452530513 --dir "$root/eu"
          mv "$root/eu/miui-services.jar" "$root/eu/jar.jar"
          zstd -d -q -c bin/package/NOTIFICATION_FIX/A16/CN/eu-powerkeeper.dex.zst > "$root/eu/power.dex"
          gh run download 39936737623 --repo "$GITHUB_REPOSITORY" --name HyperMOS-dump-base-2 --dir "$root/global"
          unzip -p "$root/global/HyperMOS-dump-base-2.zip" miui-services.jar > "$root/global/jar.jar"
          zstd -d -q -c bin/package/NOTIFICATION_FIX/A16/EU/global-powerkeeper.dex.zst > "$root/global/power.dex"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          import zipfile
          archive='bin/package/NOTIFICATION_FIX/A16/EU/backupzk.zip'
          pre='bin/package/NOTIFICATION_FIX/A16/EU/ZK304/'
          with zipfile.ZipFile(archive) as f: obj=json.loads(f.read(pre+'manifest.json'))
          for key,p in [('miui-services.jar','/tmp/zk304-audit/zk/jar.jar'),
                        ('classes.dex','/tmp/zk304-audit/zk/power.dex')]:
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              assert got==obj['files'][key], f'{key} checksum mismatch'
          print('[ZK BACKUP] original ZK304 donor SHA256 verified')
          PY
          for side in zk eu global; do
            mkdir -p "$root/$side/jar" "$root/$side/power"
            unzip -q "$root/$side/jar.jar" 'classes*.dex' -d "$root/$side"
            for dex in "$root/$side"/classes*.dex; do
              stem="$(basename "$dex" .dex)"
              group=smali
              if [[ "$stem" != classes ]]; then group="smali_$stem"; fi
              java -jar bin/apktool/baksmaliv2.jar d --api 36 "$dex" -o "$root/$side/jar/$group" > /dev/null
            done
            java -jar bin/apktool/baksmaliv2.jar d --api 36 "$root/$side/power.dex" -o "$root/$side/power/smali" > /dev/null
          done
      - name: Compare ZK-only policies against EU and Global
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/audit/zk304_candidate_audit.py
          mkdir -p /tmp/zk304-audit/report
          for area in jar power; do
            python3 bin/audit/zk304_candidate_audit.py \
              --zk "/tmp/zk304-audit/zk/$area" \
              --eu "/tmp/zk304-audit/eu/$area" \
              --global "/tmp/zk304-audit/global/$area" \
              --report "/tmp/zk304-audit/report/$area.json" \
              --details "/tmp/zk304-audit/report/$area.md"
          done
          echo "[ZK304] Audit complete"
      - name: Preflight combined EU ZK304 candidates in one build
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/zk304-audit
          python3 -m py_compile bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py
          bash -n bin/package/NOTIFICATION_FIX/A16/EU/patch.sh
          bash -n bin/package/NOTIFICATION_FIX/A16/EU/PowerKeeper.sh
          cp -a "$root/eu/jar" "$root/selected-jar"
          cp -a "$root/eu/power" "$root/selected-power"
          for area in jar power; do
            component=jar
            [[ "$area" == power ]] && component=power
            python3 bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py \
              --component "$component" \
              --eu-root "$root/selected-$area" --donor-root "$root/zk/$area" \
              --report "$root/report/selected-$area.json"
            python3 bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py \
              --component "$component" \
              --eu-root "$root/selected-$area" --donor-root "$root/zk/$area" \
              --verify-original "$root/eu/$area"
          done
          echo "[ZK304] Focused GMS, important apps, and Millet methods preflight passed"
      - name: Verify combined Global303 plus selected ZK304 bytecode
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/zk304-audit
          both="$root/combined"
          mkdir -p "$both/power" "$both/jar-assembled" "$both/jar-verified"
          cp -a "$root/eu/power/smali" "$both/eu-power"
          cp -a "$root/eu/jar" "$both/eu-jar"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/port_global_powerkeeper.py \
            --eu "$both/eu-power" --global-donor "$root/global/power/smali" \
            --report "$root/report/combined-global-power.json"
          cp -a "$both/eu-power" "$both/eu-power-global"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py \
            --component power --eu-root "$both/eu-power" --donor-root "$root/zk/power" \
            --report "$root/report/combined-global-zk-power.json"
          java -jar bin/apktool/smaliv2.jar a --api 36 "$both/eu-power" -o "$both/power/merged.dex" >/dev/null
          java -jar bin/apktool/baksmaliv2.jar d --api 36 "$both/power/merged.dex" -o "$both/power/verified" >/dev/null
          python3 bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py \
            --component power --eu-root "$both/power/verified" --donor-root "$root/zk/power" \
            --verify-original "$both/eu-power-global"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/jar_port.py \
            "$both/eu-jar" bin/package/NOTIFICATION_FIX/A16/EU/global-battery.smali \
            --report "$root/report/combined-global-battery.json"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/fcm_greeze.py \
            "$both/eu-jar" --report "$root/report/combined-fcm.json"
          cp -a "$both/eu-jar" "$both/eu-jar-global-fcm"
          python3 bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py \
            --component jar --eu-root "$both/eu-jar" --donor-root "$root/zk/jar" \
            --report "$root/report/combined-global-zk-jar.json"
          for group in "$both/eu-jar"/smali*; do
            [[ -d "$group" ]] || continue
            stem="$(basename "$group")"
            dex=classes
            [[ "$stem" == smali ]] || dex="$(echo "$stem" | sed 's/^smali_//')"
            java -jar bin/apktool/smaliv2.jar a --api 36 "$group" \
              -o "$both/jar-assembled/$dex.dex" >/dev/null
            java -jar bin/apktool/baksmaliv2.jar d --api 36 "$both/jar-assembled/$dex.dex" \
              -o "$both/jar-verified/$stem" >/dev/null
          done
          python3 bin/package/NOTIFICATION_FIX/A16/EU/port_zk_selected_a16.py \
            --component jar --eu-root "$both/jar-verified" --donor-root "$root/zk/jar" \
            --verify-original "$both/eu-jar-global-fcm"
          echo "[EU A16] Global303 + scoped FCM + selected ZK304 combined assembly verified"
      - name: Verify ROM patches using only compact method deltas
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/zk304-audit
          mini="$root/compact"
          base=bin/package/NOTIFICATION_FIX/A16/EU
          mkdir -p "$mini/jar" "$mini/power" "$mini/jar-assembled" "$mini/jar-verified"
          cp -a "$root/eu/jar/." "$mini/jar/"
          cp -a "$root/eu/power/." "$mini/power/"
          for policy in global-jar zk-jar; do
            python3 "$base/policy_delta.py" --root "$mini/jar" \
              --manifest "$base/policy_deltas.json" --policy "$policy"
          done
          python3 "$base/fcm_greeze.py" "$mini/jar" --report "$mini/fcm.json"
          for group in "$mini/jar"/smali*; do
            [[ -d "$group" ]] || continue
            stem="$(basename "$group")"
            dex=classes
            [[ "$stem" == smali ]] || dex="$(echo "$stem" | sed 's/^smali_//')"
            java -jar bin/apktool/smaliv2.jar a --api 36 "$group" \
              -o "$mini/jar-assembled/$dex.dex" > /dev/null
            java -jar bin/apktool/baksmaliv2.jar d --api 36 "$mini/jar-assembled/$dex.dex" \
              -o "$mini/jar-verified/$stem" > /dev/null
          done
          for policy in global-jar zk-jar; do
            python3 "$base/policy_delta.py" --root "$mini/jar-verified" \
              --manifest "$base/policy_deltas.json" --policy "$policy" --verify
          done
          for policy in global-power zk-power; do
            python3 "$base/policy_delta.py" --root "$mini/power" \
              --manifest "$base/policy_deltas.json" --policy "$policy"
          done
          java -jar bin/apktool/smaliv2.jar a --api 36 "$mini/power/smali" -o "$mini/power-final.dex" > /dev/null
          java -jar bin/apktool/baksmaliv2.jar d --api 36 "$mini/power-final.dex" -o "$mini/power-verified/smali" > /dev/null
          for policy in global-power zk-power; do
            python3 "$base/policy_delta.py" --root "$mini/power-verified" \
              --manifest "$base/policy_deltas.json" --policy "$policy" --verify
          done
          bash -n "$base/patch.sh"
          bash -n "$base/PowerKeeper.sh"
          python3 -m unittest discover -s "$base/tests" -v
          echo "[EU COMPACT] no Global/ZK donor DEX required by production patcher"
      - name: Export pinned method-level deltas instead of bundled DEX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib, hashlib, json, re
          from pathlib import Path
          root=Path("/tmp/zk304-audit")
          METHODS={
            "global-jar":[("com/android/server/MiuiBatteryIntelligence.smali",v)
                          for v in ("<clinit>()V","<init>(Landroid/content/Context;)V","init(Landroid/content/Context;)V")],
            "global-power":[
              ("com/miui/powerkeeper/cloudcontrol/CloudUpdateReceiver.smali","onReceive(Landroid/content/Context;Landroid/content/Intent;)V"),
              ("com/miui/powerkeeper/cloudcontrol/LocalUpdateUtils.smali","getCloudServer(Landroid/content/Context;)Ljava/lang/String;"),
              ("com/miui/powerkeeper/cloudcontrol/LocalUpdateUtils.smali","setServerConfigurations(Landroid/content/Context;)V"),
              ("com/miui/powerkeeper/utils/InternationalAdapter.smali","<clinit>()V"),
              ("com/miui/powerkeeper/utils/PowerModeAdapter.smali","<clinit>()V"),
              ("com/miui/powerkeeper/utils/Utils.smali","isSleepModeViewVisable()Z"),
              ("f/h.smali","c(Landroid/content/Context;)Lf/j;")],
            "zk-jar":[("com/miui/server/greeze/InternationalPolicyManager.smali","getImportantApps()Ljava/util/List;")],
            "zk-power":[
              ("com/miui/powerkeeper/utils/GmsObserver.smali","isGmsControlEnabled()Z"),
              ("com/miui/powerkeeper/utils/GmsObserver.smali","enableGms()V"),
              ("com/miui/powerkeeper/utils/GmsObserver.smali","disableGms()V"),
              ("com/miui/powerkeeper/statemachine/ActiveStateController.smali","dealNoRestrictApp()V")],
          }
          METHOD=re.compile(r"(?ms)^\.method[^\n]*\n.*?^\.end method[ \t]*$")
          IGNORE=("#",".line ", ".param ", ".end param", ".local ", ".end local",
                  ".restart local", ".prologue", ".epilogue", ".source ")
          def norm(body):
            return [v for line in body.splitlines() if (v:=line.strip()) and not v.startswith(IGNORE)]
          def sha(lines):
            return hashlib.sha256("\n".join(lines).encode()).hexdigest()
          def find(root,rel,sig):
            files=list(root.glob("smali*/"+rel))
            if not files: files=list(root.rglob(rel.split("/")[-1]))
            if len(files)!=1:raise ValueError(f"expected one class {rel}: {files}")
            source=files[0].read_text()
            opts=[m.group() for m in METHOD.finditer(source)
                  if m.group().splitlines()[0].strip().split()[-1] == sig]
            if len(opts)!=1:raise ValueError(f"expected one method {rel}->{sig}: {len(opts)}")
            return norm(opts[0])
          obj={"format":"hypermos_a16_method_deltas_v1","methods":[],"fields":[]}
          for bucket,items in METHODS.items():
            donor,area=bucket.split("-")
            if area=="jar":
              eu=root/"eu"/"jar"
              other=root/donor/"jar"
            else:
              eu=root/"eu"/"power"
              other=root/donor/"power"
            for rel,sig in items:
              a,b=find(eu,rel,sig),find(other,rel,sig)
              operations=[]
              for tag,x1,x2,y1,y2 in difflib.SequenceMatcher(a=a,b=b,autojunk=False).get_opcodes():
                if tag=="equal":continue
                operations.append({"at":x1,"remove":a[x1:x2],"insert":b[y1:y2]})
              obj["methods"].append({"bucket":bucket,"path":rel,"signature":sig,
                 "before_sha256":sha(a),"after_sha256":sha(b),"changes":operations,
                 "original_lines":len(a),"result_lines":len(b)})
          pat=re.compile(r"(?m)^\.field[^\n]*MAP_APP:\[Ljava/lang/String;[^\n]*$")
          rel="com/android/server/MiuiBatteryIntelligence.smali"
          def one_field(side):
            file=list((root/side/"jar").glob("smali*/"+rel))
            assert len(file)==1,file
            found=pat.findall(file[0].read_text())
            assert len(found)==1,found
            return found[0].strip()
          obj["fields"]=[{"bucket":"global-jar","path":rel,
             "before":one_field("eu"),"after":one_field("global")}]
          out=root/"report"/"compact-policy-deltas.json"
          out.write_text(json.dumps(obj,ensure_ascii=False,separators=(",",":"))+"\n")
          print("[COMPACT SOURCE] donor delta JSON bytes:",out.stat().st_size)
          import base64, textwrap
          print("HYPERMOS_COMPACT_DELTA_BEGIN")
          for line in textwrap.wrap(base64.b64encode(out.read_bytes()).decode(),120):
            print(line)
          print("HYPERMOS_COMPACT_DELTA_END")
          for m in obj["methods"]:
            print(m["bucket"],m["path"],m["signature"],"edits",len(m["changes"]))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zk304-vs-eu309-global303-policy-audit
          path: /tmp/zk304-audit/report/
          retention-days: 7
          if-no-files-found: warn
